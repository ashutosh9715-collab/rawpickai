  <text x="400" y="118" fill="#3A3228" font-size="11" text-anchor="middle" font-weight="600">Design-First Stack</text>
  <text x="400" y="140" fill="#8A8577" font-size="10" text-anchor="middle">Next.js + Vercel (locked)</text>
  <text x="400" y="158" fill="#8A8577" font-size="10" text-anchor="middle">shadcn/ui components</text>
  <text x="400" y="176" fill="#8A8577" font-size="10" text-anchor="middle">Full-stack since Jan 2026</text>
  <text x="400" y="194" fill="#8A8577" font-size="10" text-anchor="middle">Vercel auto-deploy</text>
  <text x="400" y="220" fill="#4A5942" font-size="11" font-weight="600" text-anchor="middle">Best for: UI specialists</text>
  <text x="400" y="238" fill="#6B7C5E" font-size="10" text-anchor="middle">Best design quality</text>

  <!-- Bolt.new -->
  <rect x="540" y="60" width="230" height="220" rx="10" fill="#EEEAE2" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="540" y="60" width="230" height="36" rx="10" fill="#4A5942"/>
  <rect x="540" y="86" width="230" height="10" fill="#4A5942"/>
  <text x="655" y="84" fill="#F4F1EA" font-size="14" font-weight="700" text-anchor="middle">Bolt.new</text>
  <text x="655" y="118" fill="#3A3228" font-size="11" text-anchor="middle" font-weight="600">Flexible Stack</text>
  <text x="655" y="140" fill="#8A8577" font-size="10" text-anchor="middle">Any framework (your choice)</text>
  <text x="655" y="158" fill="#8A8577" font-size="10" text-anchor="middle">WebContainers (browser)</text>
  <text x="655" y="176" fill="#8A8577" font-size="10" text-anchor="middle">Full code visibility</text>
  <text x="655" y="194" fill="#8A8577" font-size="10" text-anchor="middle">Manual deploy</text>
  <text x="655" y="220" fill="#4A5942" font-size="11" font-weight="600" text-anchor="middle">Best for: Developers</text>
  <text x="655" y="238" fill="#4A5942" font-size="10" text-anchor="middle">Most transparency</text>

  <text x="400" y="306" fill="#8A8577" font-size="10" text-anchor="middle">Architecture Comparison - rawpickai.com</text>
