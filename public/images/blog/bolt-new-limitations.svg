<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="340" rx="12" fill="#F4F1EA"/>

  <text x="40" y="38" fill="#3A3228" font-size="18" font-weight="700">Where Bolt.new Falls Short</text>
  <text x="40" y="58" fill="#8A8577" font-size="13">Real limitations found during testing</text>

  <!-- Row 1 -->
  <rect x="40" y="78" width="720" height="40" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <circle cx="68" cy="98" r="12" fill="#96845A" opacity="0.15"/>
  <text x="62" y="103" fill="#96845A" font-size="14" font-weight="700">X</text>
  <text x="95" y="95" fill="#3A3228" font-size="13" font-weight="600">Free tier burns out in 20 min</text>
  <text x="95" y="110" fill="#8A8577" font-size="11">Stingiest free tier of all 3 vibe coding tools</text>

  <!-- Row 2 -->
  <rect x="40" y="126" width="720" height="40" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <circle cx="68" cy="146" r="12" fill="#96845A" opacity="0.15"/>
  <text x="62" y="151" fill="#96845A" font-size="14" font-weight="700">X</text>
  <text x="95" y="143" fill="#3A3228" font-size="13" font-weight="600">No managed backend</text>
  <text x="95" y="158" fill="#8A8577" font-size="11">You configure Supabase, auth, DB manually</text>

  <!-- Row 3 -->
  <rect x="40" y="174" width="720" height="40" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <circle cx="68" cy="194" r="12" fill="#96845A" opacity="0.15"/>
  <text x="62" y="199" fill="#96845A" font-size="14" font-weight="700">X</text>
  <text x="95" y="191" fill="#3A3228" font-size="13" font-weight="600">Browser memory pressure</text>
  <text x="95" y="206" fill="#8A8577" font-size="11">Large projects can crash tabs (needs 16 GB RAM)</text>

  <!-- Row 4 -->
  <rect x="40" y="222" width="720" height="40" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <circle cx="68" cy="242" r="12" fill="#96845A" opacity="0.15"/>
  <text x="62" y="247" fill="#96845A" font-size="14" font-weight="700">X</text>
  <text x="95" y="239" fill="#3A3228" font-size="13" font-weight="600">Design quality is mid</text>
  <text x="95" y="254" fill="#8A8577" font-size="11">v0 produces better-looking UIs consistently</text>

  <!-- Row 5 -->
  <rect x="40" y="270" width="720" height="40" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <circle cx="68" cy="290" r="12" fill="#96845A" opacity="0.15"/>
  <text x="62" y="295" fill="#96845A" font-size="14" font-weight="700">X</text>
  <text x="95" y="287" fill="#3A3228" font-size="13" font-weight="600">No real-time collaboration</text>
  <text x="95" y="302" fill="#8A8577" font-size="11">Team plan is shared billing, not simultaneous editing</text>

  <!-- Footer -->
  <text x="40" y="332" fill="#8A8577" font-size="11">None are dealbreakers for solo developers - rawpickai.com</text>
</svg>