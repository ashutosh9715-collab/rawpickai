<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#F4F1EA}.h{font-family:sans-serif;font-size:20px;font-weight:600;fill:#4A5942}.l{font-family:sans-serif;font-size:13px;fill:#3A3228}.p{font-family:sans-serif;font-size:16px;font-weight:600;fill:#3A3228}.m{font-family:sans-serif;font-size:11px;fill:#8A8577}</style></defs><rect class="bg" width="900" height="300"/><text class="h" x="40" y="35">Pricing: Depends on Your Context</text><rect x="40" y="50" width="200" height="110" rx="8" fill="#fffbf5" stroke="#e0dcd5" stroke-width="1"/><text class="l" x="60" y="70">Midjourney Basic</text><text class="p" x="60" y="100">₹930/mo</text><text class="m" x="60" y="125">Best for designers</text><rect x="280" y="50" width="200" height="110" rx="8" fill="#f5fbf5" stroke="#e0dcd5" stroke-width="1"/><text class="l" x="300" y="70">DALL-E 3 (via ChatGPT)</text><text class="p" x="300" y="100">₹1,860/mo</text><text class="m" x="300" y="125">If no ChatGPT yet</text><rect x="520" y="50" width="350" height="110" rx="8" fill="none" stroke="#d0ccc5" stroke-width="2" stroke-dasharray="4,2"/><text class="l" x="540" y="75">Smart Strategy</text><text class="m" x="540" y="100">If you have ChatGPT Plus</text><text class="p" x="540" y="125">DALL-E 3 = free (included)</text><text class="m" x="40" y="200">Decision tree: Already have ChatGPT Plus? → DALL-E 3 free. No? → Midjourney ₹930 cheaper than ChatGPT ₹1,860.</text><text class="m" x="40" y="220">For professionals: Use both (Midjourney ₹930 + ChatGPT ₹1,860 = ₹2,790 total) for hero images + supporting images.</text><text class="m" x="40" y="240">For students/casual: Start free. Try both. Pick one based on quality vs ease tradeoff.</text></svg>