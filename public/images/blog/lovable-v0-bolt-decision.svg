<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="300" rx="12" fill="#F4F1EA"/>
  <text x="400" y="32" fill="#4A5942" font-size="16" font-weight="700" text-anchor="middle">Which Tool Should You Pick?</text>

  <!-- Question -->
  <rect x="280" y="50" width="240" height="40" rx="8" fill="#4A5942"/>
  <text x="400" y="75" fill="#F4F1EA" font-size="12" font-weight="600" text-anchor="middle">Are you a developer?</text>

  <!-- Lines -->
  <line x1="330" y1="90" x2="150" y2="130" stroke="#DDD8CE" stroke-width="2"/>
  <line x1="470" y1="90" x2="650" y2="130" stroke="#DDD8CE" stroke-width="2"/>
  <text x="220" y="108" fill="#8A8577" font-size="10">No</text>
  <text x="570" y="108" fill="#8A8577" font-size="10">Yes</text>

  <!-- No branch: Non-technical -->
  <rect x="40" y="130" width="220" height="36" rx="8" fill="#96845A"/>
  <text x="150" y="153" fill="#F4F1EA" font-size="11" font-weight="600" text-anchor="middle">Need a working backend?</text>
  <line x1="90" y1="166" x2="90" y2="190" stroke="#DDD8CE" stroke-width="2"/>
  <line x1="210" y1="166" x2="210" y2="190" stroke="#DDD8CE" stroke-width="2"/>
  <text x="70" y="183" fill="#8A8577" font-size="10">Yes</text>
  <text x="220" y="183" fill="#8A8577" font-size="10">No</text>

  <rect x="20" y="192" width="140" height="50" rx="8" fill="#96845A" opacity="0.8"/>
  <text x="90" y="214" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">Lovable</text>
  <text x="90" y="232" fill="#F4F1EA" font-size="10" text-anchor="middle">$20/mo (≈₹1,860)</text>

  <rect x="180" y="192" width="140" height="50" rx="8" fill="#6B7C5E"/>
  <text x="250" y="214" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">v0</text>
  <text x="250" y="232" fill="#F4F1EA" font-size="10" text-anchor="middle">$20/mo (≈₹1,860)</text>

  <!-- Yes branch: Developer -->
  <rect x="540" y="130" width="220" height="36" rx="8" fill="#4A5942"/>
  <text x="650" y="153" fill="#F4F1EA" font-size="11" font-weight="600" text-anchor="middle">Need framework flexibility?</text>
  <line x1="590" y1="166" x2="590" y2="190" stroke="#DDD8CE" stroke-width="2"/>
  <line x1="710" y1="166" x2="710" y2="190" stroke="#DDD8CE" stroke-width="2"/>
  <text x="575" y="183" fill="#8A8577" font-size="10">Yes</text>
  <text x="720" y="183" fill="#8A8577" font-size="10">No</text>

  <rect x="520" y="192" width="140" height="50" rx="8" fill="#4A5942"/>
  <text x="590" y="214" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">Bolt.new</text>
  <text x="590" y="232" fill="#F4F1EA" font-size="10" text-anchor="middle">$25/mo (≈₹2,325)</text>

  <rect x="680" y="192" width="100" height="50" rx="8" fill="#6B7C5E"/>
  <text x="730" y="214" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">v0</text>
  <text x="730" y="232" fill="#F4F1EA" font-size="10" text-anchor="middle">$20/mo</text>

  <text x="400" y="280" fill="#8A8577" font-size="10" text-anchor="middle">Decision Guide - rawpickai.com</text>
</svg>
