  <text x="80" y="370" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#1A2416">Google + SpaceX: Space DCs</text>
  <text x="80" y="395" font-family="Georgia, serif" font-size="14" fill="#4A453E">Project Suncatcher: TPU satellites</text>
  <text x="80" y="420" font-family="Georgia, serif" font-size="14" fill="#4A453E">Prototype launches by 2027</text>
