  <text x="450" y="340" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#96845A">05 API</text>
  <text x="450" y="370" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#1A2416">xAI Kills 8 Grok Models</text>
  <text x="450" y="395" font-family="Georgia, serif" font-size="14" fill="#4A453E">All redirect to Grok 4.3</text>
  <text x="450" y="420" font-family="Georgia, serif" font-size="14" fill="#4A453E">$1.25/$2.50 per M tokens</text>
