  <text x="350" y="48" font-size="11" text-anchor="middle" fill="#8A8577">Decision framework based on your primary need</text>
  <rect x="30" y="75" width="120" height="80" rx="8" fill="#6B7C5E"/>
  <text x="90" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Best Overall</text>
  <text x="90" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="white">Cursor</text>
  <text x="90" y="140" font-size="10" text-anchor="middle" fill="white">$20/mo</text>
  <rect x="170" y="75" width="120" height="80" rx="8" fill="#6B7C5E" opacity="0.85"/>
  <text x="230" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Best Value</text>
  <text x="230" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="white">Copilot</text>
  <text x="230" y="140" font-size="10" text-anchor="middle" fill="white">$10/mo</text>
  <rect x="310" y="75" width="120" height="80" rx="8" fill="#96845A"/>
  <text x="370" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Deep Reasoning</text>
  <text x="370" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="white">Claude Code</text>
  <text x="370" y="140" font-size="10" text-anchor="middle" fill="white">Usage-based</text>
  <rect x="450" y="75" width="120" height="80" rx="8" fill="#96845A" opacity="0.85"/>
  <text x="510" y="102" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Best Free</text>
  <text x="510" y="120" font-size="13" font-weight="700" text-anchor="middle" fill="white">Windsurf</text>
  <text x="510" y="140" font-size="10" text-anchor="middle" fill="white">$0/mo</text>
  <rect x="590" y="75" width="80" height="80" rx="8" fill="#8A8577"/>
  <text x="630" y="102" font-size="10" font-weight="bold" text-anchor="middle" fill="white">AWS Focus</text>
  <text x="630" y="118" font-size="10" font-weight="700" text-anchor="middle" fill="white">Code</text>
  <text x="630" y="132" font-size="10" font-weight="700" text-anchor="middle" fill="white">Whisperer</text>
  <text x="630" y="148" font-size="9" text-anchor="middle" fill="white">$19/mo</text>
