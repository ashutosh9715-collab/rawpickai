<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 600; fill: #4A5942; }
      .subheading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #8A8577; }
      .tool-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #3A3228; }
      .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #3A3228; }
      .value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #8A8577; }
      .bar-bg { fill: #DDD8CE; }
      .bar1 { fill: #6B7C5E; }
      .bar2 { fill: #96845A; }
      .bar3 { fill: #A89F8F; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="600" rx="12"/>

  <!-- Header -->
  <text class="heading" x="40" y="50">Leonardo AI vs Midjourney vs Firefly</text>
  <text class="subheading" x="40" y="70">Quality, pricing, features, and specialized strengths</text>

  <!-- Free Tier -->
  <text class="metric-label" x="40" y="115">Free Tier Value</text>
  <rect class="bar-bg" x="150" y="105" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="105" width="200" height="16" rx="6"/>
  <text class="value" x="360" y="115">Leonardo: 150 tokens/day</text>

  <rect class="bar-bg" x="550" y="105" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="105" width="50" height="16" rx="6"/>
  <text class="value" x="760" y="115">Midjourney: 25 images</text>

  <rect class="bar-bg" x="150" y="130" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="130" width="120" height="16" rx="6"/>
  <text class="value" x="360" y="140">Firefly: 25 credits/mo</text>

  <!-- Photorealism -->
  <text class="metric-label" x="40" y="180">Photorealism Quality</text>
  <rect class="bar-bg" x="150" y="170" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="170" width="160" height="16" rx="6"/>
  <text class="value" x="360" y="180">Leonardo: 80%</text>

  <rect class="bar-bg" x="550" y="170" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="170" width="200" height="16" rx="6"/>
  <text class="value" x="760" y="180">Midjourney: 100%</text>

  <rect class="bar-bg" x="150" y="195" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="195" width="170" height="16" rx="6"/>
  <text class="value" x="360" y="205">Firefly: 85%</text>

  <!-- Specialized Models -->
  <text class="metric-label" x="40" y="245">Specialized Style Models</text>
  <rect class="bar-bg" x="150" y="235" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="235" width="200" height="16" rx="6"/>
  <text class="value" x="360" y="245">Leonardo: 8+ models</text>

  <rect class="bar-bg" x="550" y="235" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="235" width="80" height="16" rx="6"/>
  <text class="value" x="760" y="245">Midjourney: 1 general</text>

  <rect class="bar-bg" x="150" y="260" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="260" width="40" height="16" rx="6"/>
  <text class="value" x="360" y="270">Firefly: 1 general</text>

  <!-- Monthly Cost -->
  <text class="metric-label" x="40" y="310">Monthly Cost (Paid Tier)</text>
  <text class="value" x="150" y="320">Leonardo Artisan</text>
  <rect class="bar-bg" x="150" y="300" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="300" width="140" height="16" rx="6"/>
  <text class="value" x="360" y="310">≈₹2,232</text>

  <text class="value" x="550" y="320">Midjourney Pro</text>
  <rect class="bar-bg" x="550" y="300" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="300" width="170" height="16" rx="6"/>
  <text class="value" x="760" y="310">≈₹1,860</text>

  <text class="value" x="150" y="345">Firefly Pro</text>
  <rect class="bar-bg" x="150" y="325" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="325" width="150" height="16" rx="6"/>
  <text class="value" x="360" y="335">≈₹2,790</text>

  <!-- Use Case Recommendations -->
  <text class="metric-label" x="40" y="385">Best for</text>

  <!-- Leonardo Box -->
  <rect x="40" y="400" width="280" height="180" fill="#FFF9F5" stroke="#6B7C5E" stroke-width="2" rx="10"/>
  <text class="tool-name" x="60" y="425" style="fill: #6B7C5E;">✓ Leonardo AI</text>
  <text class="value" x="60" y="448">• Free forever (10-15/mo)</text>
  <text class="value" x="60" y="468">• Anime/art styles</text>
  <text class="value" x="60" y="488">• Custom model training</text>
  <text class="value" x="60" y="508">• Canvas editing</text>
  <text class="value" x="60" y="528">• Transparent pricing</text>
  <text class="value" x="60" y="548">• Semi-professionals</text>
  <text class="value" x="60" y="568">• Accessibility first</text>

  <!-- Midjourney Box -->
  <rect x="360" y="400" width="280" height="180" fill="#FFF9F5" stroke="#96845A" stroke-width="2" rx="10"/>
  <text class="tool-name" x="380" y="425" style="fill: #96845A;">✓ Midjourney</text>
  <text class="value" x="380" y="448">• Best photorealism</text>
  <text class="value" x="380" y="468">• Portfolio work</text>
  <text class="value" x="380" y="488">• Editorial/commercial</text>
  <text class="value" x="380" y="508">• Consistent quality</text>
  <text class="value" x="380" y="528">• Brand power</text>
  <text class="value" x="380" y="548">• Community/examples</text>
  <text class="value" x="380" y="568">• Premium aesthetic</text>

  <!-- Firefly Box -->
  <rect x="680" y="400" width="280" height="180" fill="#FFF9F5" stroke="#A89F8F" stroke-width="2" rx="10"/>
  <text class="tool-name" x="700" y="425" style="fill: #A89F8F;">✓ Firefly</text>
  <text class="value" x="700" y="448">• Legal certainty</text>
  <text class="value" x="700" y="468">• Photoshop integration</text>
  <text class="value" x="700" y="488">• Generative Fill</text>
  <text class="value" x="700" y="508">• Commercial safety</text>
  <text class="value" x="700" y="528">• IP indemnity</text>
  <text class="value" x="700" y="548">• Agencies</text>
  <text class="value" x="700" y="568">• Risk-conscious teams</text>
</svg>