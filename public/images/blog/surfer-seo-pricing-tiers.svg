<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #F4F1EA; }
      .card-bg { fill: #FFFFFF; stroke: #DDD8CE; stroke-width: 2; }
      .card-highlight { fill: #F0EDE4; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #4A5942; }
      .price { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 700; fill: #4A5942; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #8A8577; }
      .feature { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #3A3228; }
      .page-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 600; fill: #4A5942; }
    </style>
  </defs>

  <rect class="bg" width="900" height="320" rx="12" />
  <text x="40" y="35" class="page-title">Surfer SEO Pricing Tiers</text>

  <g id="essential">
    <rect x="50" y="60" width="190" height="240" rx="8" class="card-highlight" />
    <rect x="50" y="60" width="190" height="240" rx="8" class="card-bg" />
    <text x="145" y="95" text-anchor="middle" class="title">Essential</text>
    <text x="145" y="120" text-anchor="middle" class="price">$79</text>
    <text x="145" y="140" text-anchor="middle" class="subtitle">/month ($79)</text>
    <text x="70" y="165" class="feature">✓ Content editor</text>
    <text x="70" y="185" class="feature">✓ Audit tools</text>
    <text x="70" y="205" class="feature">✓ SERP analysis</text>
    <text x="70" y="225" class="feature">✓ Basic AI</text>
    <text x="70" y="245" class="feature">✓ 5 audits/month</text>
  </g>

  <g id="scale">
    <rect x="270" y="60" width="190" height="240" rx="8" class="card-bg" />
    <text x="365" y="95" text-anchor="middle" class="title">Scale</text>
    <text x="365" y="120" text-anchor="middle" class="price">$175</text>
    <text x="365" y="140" text-anchor="middle" class="subtitle">/month ($175)</text>
    <text x="290" y="165" class="feature">✓ Everything</text>
    <text x="290" y="185" class="feature">✓ Content API</text>
    <text x="290" y="205" class="feature">✓ More credits</text>
    <text x="290" y="225" class="feature">✓ Priority support</text>
    <text x="290" y="245" class="feature">✓ Advanced</text>
  </g>

  <g id="scale-ai">
    <rect x="490" y="60" width="190" height="240" rx="8" class="card-bg" />
    <text x="585" y="95" text-anchor="middle" class="title" style="font-size: 14px;">Scale AI</text>
    <text x="585" y="120" text-anchor="middle" class="price">$219</text>
    <text x="585" y="140" text-anchor="middle" class="subtitle">/month ($219)</text>
    <text x="510" y="165" class="feature">✓ All Scale</text>
    <text x="510" y="185" class="feature">✓ Unlimited AI</text>
    <text x="510" y="205" class="feature">✓ Full access</text>
    <text x="510" y="225" class="feature">✓ AI writer</text>
    <text x="510" y="245" class="feature">✓ Premium</text>
  </g>

  <g id="enterprise">
    <rect x="710" y="60" width="140" height="240" rx="8" class="card-bg" />
    <text x="780" y="95" text-anchor="middle" class="title" style="font-size: 14px;">Enterprise</text>
    <text x="780" y="120" text-anchor="middle" class="price" style="font-size: 20px;">Custom</text>
    <text x="780" y="140" text-anchor="middle" class="subtitle">Contact sales</text>
    <text x="730" y="165" class="feature" style="font-size: 12px;">✓ Custom</text>
    <text x="730" y="185" class="feature" style="font-size: 12px;">✓ Support</text>
    <text x="730" y="205" class="feature" style="font-size: 12px;">✓ Integration</text>
    <text x="730" y="225" class="feature" style="font-size: 12px;">✓ Training</text>
    <text x="730" y="245" class="feature" style="font-size: 12px;">✓ Dedicated</text>
  </g>
</svg>