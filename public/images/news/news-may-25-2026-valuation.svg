<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <rect width="900" height="200" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Anthropic Valuation: $380B to $900B+ in Four Months</text>
  <rect x="100" y="60" width="160" height="105" rx="10" fill="white" stroke="#6B6960" stroke-width="1"/>
  <text x="180" y="85" font-family="Georgia, serif" font-size="11" font-weight="600" text-anchor="middle" fill="#6B6960">Feb 2026</text>
  <text x="180" y="118" font-family="Georgia, serif" font-size="28" font-weight="700" text-anchor="middle" fill="#6B6960">$380B</text>
  <text x="180" y="145" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Previous round</text>
  <text x="310" y="115" font-family="Georgia, serif" font-size="24" fill="#22c55e">→</text>
  <rect x="360" y="60" width="160" height="105" rx="10" fill="white" stroke="#96845A" stroke-width="1"/>
  <text x="440" y="85" font-family="Georgia, serif" font-size="11" font-weight="600" text-anchor="middle" fill="#96845A">Mar 2026</text>
  <text x="440" y="118" font-family="Georgia, serif" font-size="28" font-weight="700" text-anchor="middle" fill="#96845A">$852B</text>
  <text x="440" y="145" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">OpenAI's valuation</text>
  <text x="570" y="115" font-family="Georgia, serif" font-size="24" fill="#22c55e">→</text>
  <rect x="620" y="60" width="160" height="105" rx="10" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="700" y="85" font-family="Georgia, serif" font-size="11" font-weight="700" text-anchor="middle" fill="#4A5942">May 2026</text>
  <text x="700" y="118" font-family="Georgia, serif" font-size="28" font-weight="700" text-anchor="middle" fill="#4A5942">$900B+</text>
  <text x="700" y="145" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#22c55e">Surpasses OpenAI</text>
  <text x="450" y="190" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">$30B round led by Sequoia, Dragoneer, Greenoaks, Altimeter. Source: Bloomberg, May 25, 2026</text>
</svg>
