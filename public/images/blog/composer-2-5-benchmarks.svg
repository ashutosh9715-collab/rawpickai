<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="700" height="360" rx="12" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="350" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#4A5942">Composer 2.5 Benchmarks</text>
  <text x="350" y="52" text-anchor="middle" font-size="12" fill="#8A8577">vs Opus 4.7 and GPT-5.5 at default settings</text>

  <!-- Legend -->
  <rect x="136" y="66" width="12" height="12" rx="3" fill="#6B7C5E"/>
  <text x="154" y="77" font-size="11" fill="#3A3228">Composer 2.5</text>
  <rect x="268" y="66" width="12" height="12" rx="3" fill="#96845A"/>
  <text x="286" y="77" font-size="11" fill="#3A3228">Claude Opus 4.7</text>
  <rect x="410" y="66" width="12" height="12" rx="3" fill="#8A8577"/>
  <text x="428" y="77" font-size="11" fill="#3A3228">GPT-5.5</text>

  <!-- === CursorBench v3.1 === -->
  <!-- Y-axis label -->
  <text x="24" y="104" font-size="11" font-weight="600" fill="#4A5942">CursorBench v3.1</text>

  <!-- Bars (max width 200, anchored at x=100) -->
  <!-- Composer 2.5: 63.2% → 126.4 -->
  <rect x="100" y="112" width="126.4" height="22" rx="4" fill="#6B7C5E"/>
  <text x="232" y="127" font-size="11" font-weight="700" fill="#3A3228">63.2%</text>

  <!-- Opus 4.7 xhigh: 61.6% → 123.2 -->
  <rect x="100" y="138" width="123.2" height="22" rx="4" fill="#96845A"/>
  <text x="229" y="153" font-size="11" font-weight="700" fill="#3A3228">61.6%</text>

  <!-- GPT-5.5 medium: 59.2% → 118.4 -->
  <rect x="100" y="164" width="118.4" height="22" rx="4" fill="#8A8577"/>
  <text x="224" y="179" font-size="11" font-weight="700" fill="#3A3228">59.2%</text>

  <line x1="90" y1="105" x2="90" y2="195" stroke="#DDD8CE" stroke-width="1"/>
  <line x1="90" y1="195" x2="360" y2="195" stroke="#DDD8CE" stroke-width="1"/>

  <!-- === SWE-Bench === -->
  <text x="24" y="224" font-size="11" font-weight="600" fill="#4A5942">SWE-Bench</text>
  <text x="24" y="238" font-size="11" fill="#8A8577">Multilingual</text>

  <!-- Composer 2.5: 79.8% → 159.6 -->
  <rect x="100" y="232" width="159.6" height="22" rx="4" fill="#6B7C5E"/>
  <text x="265" y="247" font-size="11" font-weight="700" fill="#3A3228">79.8%</text>

  <!-- Note: Opus 4.7 ~matches, GPT-5.5 ~matches -->
  <rect x="100" y="258" width="158" height="22" rx="4" fill="#96845A"/>
  <text x="264" y="273" font-size="11" font-weight="700" fill="#3A3228">~79%</text>

  <rect x="100" y="284" width="160" height="22" rx="4" fill="#8A8577"/>
  <text x="266" y="299" font-size="11" font-weight="700" fill="#3A3228">~80%</text>

  <line x1="90" y1="225" x2="90" y2="315" stroke="#DDD8CE" stroke-width="1"/>
  <line x1="90" y1="315" x2="360" y2="315" stroke="#DDD8CE" stroke-width="1"/>

  <!-- === Terminal-Bench === -->
  <text x="390" y="104" font-size="11" font-weight="600" fill="#4A5942">Terminal-Bench</text>

  <!-- Composer 2.5: 69.3% → 138.6 -->
  <rect x="480" y="112" width="138.6" height="22" rx="4" fill="#6B7C5E"/>
  <text x="624" y="127" font-size="11" font-weight="700" fill="#3A3228">69.3%</text>

  <!-- GPT-5.5: 82.7% → 165.4 -->
  <rect x="480" y="164" width="165.4" height="22" rx="4" fill="#8A8577"/>
  <text x="651" y="179" font-size="11" font-weight="700" fill="#3A3228">82.7%</text>

  <!-- Opus not measured label -->
  <text x="484" y="153" font-size="10" fill="#8A8577">Opus 4.7 - n/a</text>

  <line x1="470" y1="105" x2="470" y2="195" stroke="#DDD8CE" stroke-width="1"/>
  <line x1="470" y1="195" x2="690" y2="195" stroke="#DDD8CE" stroke-width="1"/>

  <!-- Gap callout -->
  <rect x="390" y="205" width="300" height="44" rx="8" fill="#DDD8CE"/>
  <text x="540" y="221" text-anchor="middle" font-size="11" font-weight="600" fill="#4A5942">Terminal-Bench gap:</text>
  <text x="540" y="237" text-anchor="middle" font-size="11" fill="#3A3228">Composer 2.5 trails GPT-5.5 by 13.4 pts</text>

  <!-- Footer -->
  <text x="350" y="340" text-anchor="middle" font-size="10" fill="#8A8577">SWE-Bench Opus/GPT figures approximate. CursorBench at default effort settings.</text>
  <text x="350" y="354" text-anchor="middle" font-size="10" fill="#8A8577">rawpickai.com</text>
</svg>
