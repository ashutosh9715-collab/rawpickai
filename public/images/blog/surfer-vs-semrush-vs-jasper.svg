<svg viewBox="0 0 850 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #F4F1EA; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 600; fill: #4A5942; }
      .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #3A3228; }
      .cell { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #3A3228; }
      .row-odd { fill: #FEFDFB; }
      .row-even { fill: #F8F5F0; }
    </style>
  </defs>

  <rect class="bg" width="850" height="480" rx="12" />
  <text x="40" y="40" class="title">Surfer SEO vs Semrush vs Jasper</text>

  <rect x="40" y="65" width="770" height="35" fill="#EDE9DF" rx="0" />
  <text x="55" y="90" class="header">Feature</text>
  <text x="240" y="90" class="header" text-anchor="middle">Surfer SEO</text>
  <text x="480" y="90" class="header" text-anchor="middle">Semrush</text>
  <text x="720" y="90" class="header" text-anchor="middle">Jasper</text>

  <rect x="40" y="100" width="770" height="45" class="row-odd" />
  <text x="55" y="125" class="header">Content Scoring</text>
  <text x="240" y="125" class="cell" text-anchor="middle">Excellent (4.1/5)</text>
  <text x="480" y="125" class="cell" text-anchor="middle">Good (3.7/5)</text>
  <text x="720" y="125" class="cell" text-anchor="middle">Fair (3.3/5)</text>

  <rect x="40" y="145" width="770" height="45" class="row-even" />
  <text x="55" y="170" class="header">SERP Analysis</text>
  <text x="240" y="170" class="cell" text-anchor="middle">Expert (4.2/5)</text>
  <text x="480" y="170" class="cell" text-anchor="middle">Competent (3.9/5)</text>
  <text x="720" y="170" class="cell" text-anchor="middle">None</text>

  <rect x="40" y="190" width="770" height="45" class="row-odd" />
  <text x="55" y="215" class="header">AI Content Writer</text>
  <text x="240" y="215" class="cell" text-anchor="middle">Weak (3.2/5)</text>
  <text x="480" y="215" class="cell" text-anchor="middle">Moderate (3.5/5)</text>
  <text x="720" y="215" class="cell" text-anchor="middle">Strong (4.0/5)</text>

  <rect x="40" y="235" width="770" height="45" class="row-even" />
  <text x="55" y="260" class="header">Rank Tracking</text>
  <text x="240" y="260" class="cell" text-anchor="middle">No</text>
  <text x="480" y="260" class="cell" text-anchor="middle">Yes (excellent)</text>
  <text x="720" y="260" class="cell" text-anchor="middle">No</text>

  <rect x="40" y="280" width="770" height="45" class="row-odd" />
  <text x="55" y="305" class="header">Backlink Analysis</text>
  <text x="240" y="305" class="cell" text-anchor="middle">No</text>
  <text x="480" y="305" class="cell" text-anchor="middle">Yes (comprehensive)</text>
  <text x="720" y="305" class="cell" text-anchor="middle">No</text>

  <rect x="40" y="325" width="770" height="45" class="row-even" />
  <text x="55" y="350" class="header">Monthly Price (USD)</text>
  <text x="240" y="350" class="cell" text-anchor="middle">$79 (≈₹7,347) (Essential)</text>
  <text x="480" y="350" class="cell" text-anchor="middle">$108 (≈₹10,000)-20,000</text>
  <text x="720" y="350" class="cell" text-anchor="middle">$27 (≈₹2,500)-15,000</text>

  <rect x="40" y="370" width="770" height="45" class="row-odd" />
  <text x="55" y="395" class="header">Best For</text>
  <text x="240" y="395" class="cell" text-anchor="middle">Content optimization</text>
  <text x="480" y="395" class="cell" text-anchor="middle">Full SEO toolkit</text>
  <text x="720" y="395" class="cell" text-anchor="middle">Content creation</text>

  <rect x="40" y="415" width="770" height="35" class="row-even" />
  <text x="55" y="440" class="header">Learning Curve</text>
  <text x="240" y="440" class="cell" text-anchor="middle">Moderate (6-8 hours)</text>
  <text x="480" y="440" class="cell" text-anchor="middle">Steep (15+ hours)</text>
  <text x="720" y="440" class="cell" text-anchor="middle">Minimal (2-3 hours)</text>
</svg>