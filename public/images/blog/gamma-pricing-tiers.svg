<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 700; fill: #4A5942; }
      .card-bg { fill: #fff; stroke: #DDD8CE; stroke-width: 1; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #4A5942; }
      .card-price { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #6B7C5E; }
      .card-feature { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #3A3228; }
      .muted { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #8A8577; }
    </style>
  </defs>

  <rect class="bg" width="800" height="400" rx="12"/>

  <text class="heading" x="40" y="45">Gamma AI Pricing Tiers</text>

  <!-- Free Card -->
  <rect class="card-bg" x="40" y="75" width="200" height="280" rx="8"/>
  <text class="card-title" x="60" y="105">Free</text>
  <text class="card-price" x="60" y="135">₹0/mo</text>
  <line x1="60" y1="150" x2="220" y2="150" stroke="#DDD8CE" stroke-width="1"/>
  <text class="card-feature" x="60" y="170">• 10 monthly credits</text>
  <text class="card-feature" x="60" y="190">• Watermark on exports</text>
  <text class="card-feature" x="60" y="210">• 1-2 complete decks</text>
  <text class="muted" x="60" y="330">Try Gamma</text>

  <!-- Plus Card -->
  <rect class="card-bg" x="300" y="60" width="200" height="310" rx="8" stroke="#6B7C5E" stroke-width="2"/>
  <rect fill="#6B7C5E" x="300" y="60" width="200" height="30" rx="8"/>
  <text class="card-title" x="320" y="82" fill="white" style="font-size: 12px; font-weight: 600;">MOST POPULAR</text>
  <text class="card-title" x="320" y="115">Plus</text>
  <text class="card-price" x="320" y="145">≈₹930/mo</text>
  <line x1="320" y1="160" x2="480" y2="160" stroke="#DDD8CE" stroke-width="1"/>
  <text class="card-feature" x="320" y="180">• 400 monthly credits</text>
  <text class="card-feature" x="320" y="200">• 8-10 full decks/month</text>
  <text class="card-feature" x="320" y="220">• No watermark</text>
  <text class="card-feature" x="320" y="240">• Web sharing + PDF export</text>
  <text class="muted" x="320" y="340">Best value</text>

  <!-- Pro Card -->
  <rect class="card-bg" x="560" y="75" width="200" height="280" rx="8"/>
  <text class="card-title" x="580" y="105">Pro</text>
  <text class="card-price" x="580" y="135">≈₹1,860/mo</text>
  <line x1="580" y1="150" x2="740" y2="150" stroke="#DDD8CE" stroke-width="1"/>
  <text class="card-feature" x="580" y="170">• Unlimited credits</text>
  <text class="card-feature" x="580" y="190">• Unlimited decks</text>
  <text class="card-feature" x="580" y="210">• Custom domain</text>
  <text class="card-feature" x="580" y="230">• Analytics dashboard</text>
  <text class="muted" x="580" y="330">For agencies</text>
</svg>
