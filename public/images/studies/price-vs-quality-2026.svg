<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="420" rx="12" fill="#F4F1EA"/>

  <text x="400" y="32" fill="#4A5942" font-size="17" font-weight="700" text-anchor="middle">Does More Expensive Mean Better?</text>
  <text x="400" y="52" fill="#8A8577" font-size="12" text-anchor="middle">Average score (out of 5) by entry-level price bracket — 48 tools tested</text>

  <!-- Chart area background -->
  <rect x="80" y="90" width="640" height="230" fill="#FFFFFF" rx="6" stroke="#DDD8CE" stroke-width="0.5"/>

  <!-- Y-axis scale (3.0 to 4.5, 0.25 increments → 7 lines) -->
  <line x1="80" y1="105" x2="720" y2="105" stroke="#E8E3D6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="74" y="109" fill="#8A8577" font-size="10" text-anchor="end">4.50</text>
  <line x1="80" y1="143" x2="720" y2="143" stroke="#E8E3D6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="74" y="147" fill="#8A8577" font-size="10" text-anchor="end">4.25</text>
  <line x1="80" y1="181" x2="720" y2="181" stroke="#E8E3D6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="74" y="185" fill="#8A8577" font-size="10" text-anchor="end">4.00</text>
  <line x1="80" y1="219" x2="720" y2="219" stroke="#E8E3D6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="74" y="223" fill="#8A8577" font-size="10" text-anchor="end">3.75</text>
  <line x1="80" y1="257" x2="720" y2="257" stroke="#E8E3D6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="74" y="261" fill="#8A8577" font-size="10" text-anchor="end">3.50</text>
  <line x1="80" y1="295" x2="720" y2="295" stroke="#E8E3D6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="74" y="299" fill="#8A8577" font-size="10" text-anchor="end">3.25</text>
  <line x1="80" y1="320" x2="720" y2="320" stroke="#4A5942" stroke-width="1.5"/>

  <!-- Bars — values: cheap=3.75, mid=4.01, expensive=3.62 -->
  <!-- Mapping: 3.00 = y=320, 4.50 = y=90, so y = 320 - (score - 3.00) * 153.33 -->

  <!-- CHEAP ($≤15) — 17 tools, avg 3.75 → y = 320 - (0.75 * 153.33) = 205 -->
  <rect x="140" y="205" width="120" height="115" fill="#6B7C5E" rx="4"/>
  <text x="200" y="195" fill="#3A3228" font-size="22" font-weight="800" text-anchor="middle">3.75</text>
  <text x="200" y="345" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Cheap (≤$15/mo)</text>
  <text x="200" y="362" fill="#8A8577" font-size="11" text-anchor="middle">17 tools</text>

  <!-- MID ($16-30) — 12 tools, avg 4.01 → y = 320 - (1.01 * 153.33) = 165 -->
  <rect x="340" y="165" width="120" height="155" fill="#4A5942" rx="4"/>
  <text x="400" y="155" fill="#3A3228" font-size="22" font-weight="800" text-anchor="middle">4.01</text>
  <text x="400" y="345" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Mid ($16–30/mo)</text>
  <text x="400" y="362" fill="#8A8577" font-size="11" text-anchor="middle">12 tools · THE SWEET SPOT</text>

  <!-- EXPENSIVE ($&gt;30) — 4 tools, avg 3.62 → y = 320 - (0.62 * 153.33) = 225 -->
  <rect x="540" y="225" width="120" height="95" fill="#96845A" rx="4"/>
  <text x="600" y="215" fill="#3A3228" font-size="22" font-weight="800" text-anchor="middle">3.62</text>
  <text x="600" y="345" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Expensive (&gt;$30/mo)</text>
  <text x="600" y="362" fill="#8A8577" font-size="11" text-anchor="middle">4 tools</text>

  <!-- Key insight callout -->
  <rect x="80" y="382" width="640" height="28" rx="6" fill="#4A5942"/>
  <text x="400" y="401" fill="#F4F1EA" font-size="12" font-weight="600" text-anchor="middle">Finding: expensive tools don't win — the $16–30 bracket scores highest overall</text>

  <!-- Footer attribution -->
  <text x="720" y="378" fill="#8A8577" font-size="10" text-anchor="end">Source: rawpickai.com · 48 tools · April 2026</text>
</svg>
