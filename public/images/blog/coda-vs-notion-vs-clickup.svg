<svg viewBox="0 0 850 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #F4F1EA; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 600; fill: #4A5942; }
      .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #3A3228; }
      .cell { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #3A3228; }
      .row-odd { fill: #FEFDFB; }
      .row-even { fill: #F8F5F0; }
    </style>
  </defs>

  <rect class="bg" width="850" height="450" rx="12" />
  <text x="40" y="40" class="title">Coda AI vs Notion AI vs ClickUp</text>

  <rect x="40" y="65" width="770" height="35" fill="#EDE9DF" rx="0" />
  <text x="55" y="90" class="header">Feature</text>
  <text x="240" y="90" class="header" text-anchor="middle">Coda AI</text>
  <text x="480" y="90" class="header" text-anchor="middle">Notion AI</text>
  <text x="720" y="90" class="header" text-anchor="middle">ClickUp AI</text>

  <rect x="40" y="100" width="770" height="45" class="row-odd" />
  <text x="55" y="125" class="header">Pricing Model</text>
  <text x="240" y="125" class="cell" text-anchor="middle">Doc Maker only</text>
  <text x="480" y="125" class="cell" text-anchor="middle">Per user</text>
  <text x="720" y="125" class="cell" text-anchor="middle">Per workspace</text>

  <rect x="40" y="145" width="770" height="45" class="row-even" />
  <text x="55" y="170" class="header">Cost (100 people)</text>
  <text x="240" y="170" class="cell" text-anchor="middle">₹15,300/mo (10 makers)</text>
  <text x="480" y="170" class="cell" text-anchor="middle">₹102,000/mo (all users)</text>
  <text x="720" y="170" class="cell" text-anchor="middle">₹31,000/mo</text>

  <rect x="40" y="190" width="770" height="45" class="row-odd" />
  <text x="55" y="215" class="header">Formula Generation</text>
  <text x="240" y="215" class="cell" text-anchor="middle">Excellent (4.2/5)</text>
  <text x="480" y="215" class="cell" text-anchor="middle">Good (3.8/5)</text>
  <text x="720" y="215" class="cell" text-anchor="middle">Fair (3.5/5)</text>

  <rect x="40" y="235" width="770" height="45" class="row-even" />
  <text x="55" y="260" class="header">Automation Rules</text>
  <text x="240" y="260" class="cell" text-anchor="middle">Strong (4.1/5)</text>
  <text x="480" y="260" class="cell" text-anchor="middle">Basic (3.5/5)</text>
  <text x="720" y="260" class="cell" text-anchor="middle">Strong (4.0/5)</text>

  <rect x="40" y="280" width="770" height="45" class="row-odd" />
  <text x="55" y="305" class="header">Learning Curve</text>
  <text x="240" y="305" class="cell" text-anchor="middle">Steep (20+ hours)</text>
  <text x="480" y="305" class="cell" text-anchor="middle">Easy (4-5 hours)</text>
  <text x="720" y="305" class="cell" text-anchor="middle">Moderate (10 hours)</text>

  <rect x="40" y="325" width="770" height="45" class="row-even" />
  <text x="55" y="350" class="header">Best For</text>
  <text x="240" y="350" class="cell" text-anchor="middle">Data-heavy teams 20+</text>
  <text x="480" y="350" class="cell" text-anchor="middle">Small teams &lt;10</text>
  <text x="720" y="350" class="cell" text-anchor="middle">Project management</text>

  <rect x="40" y="370" width="770" height="35" class="row-odd" />
  <text x="55" y="395" class="header">AI Quality</text>
  <text x="240" y="395" class="cell" text-anchor="middle">Strong (4.0/5)</text>
  <text x="480" y="395" class="cell" text-anchor="middle">Good (3.7/5)</text>
  <text x="720" y="395" class="cell" text-anchor="middle">Moderate (3.4/5)</text>
</svg>