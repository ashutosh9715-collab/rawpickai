<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #4A5942; }
      .label { font-size: 12px; fill: #3A3228; }
      .value { font-size: 11px; fill: #3A3228; }
      .track { fill: #DDD8CE; }
      .bar1 { fill: #6B7C5E; }
      .bar2 { fill: #96845A; }
    </style>
  </defs>

  <rect class="bg" width="900" height="450"/>

  <text class="header" x="40" y="35">Capability Comparison</text>

  <g>
    <text class="label" x="40" y="70" font-weight="600">Presentation Speed</text>
    <rect class="track" x="40" y="78" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="78" width="200" height="7" rx="3"/>
    <text class="value" x="250" y="87">Gamma: 1 minute</text>

    <rect class="track" x="40" y="92" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="92" width="120" height="7" rx="3"/>
    <text class="value" x="250" y="101">Canva: 20-30 min</text>
  </g>

  <g>
    <text class="label" x="40" y="135" font-weight="600">Design Beyond Presentations</text>
    <rect class="track" x="40" y="143" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="143" width="30" height="7" rx="3"/>
    <text class="value" x="250" y="152">Gamma: Presentations only</text>

    <rect class="track" x="40" y="157" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="157" width="200" height="7" rx="3"/>
    <text class="value" x="250" y="166">Canva: Social, print, video</text>
  </g>

  <g>
    <text class="label" x="40" y="200" font-weight="600">Design Quality (Default)</text>
    <rect class="track" x="40" y="208" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="208" width="140" height="7" rx="3"/>
    <text class="value" x="250" y="217">Gamma: 7/10</text>

    <rect class="track" x="40" y="222" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="222" width="180" height="7" rx="3"/>
    <text class="value" x="250" y="231">Canva: 9/10</text>
  </g>

  <g>
    <text class="label" x="40" y="265" font-weight="600">Team Collaboration</text>
    <rect class="track" x="40" y="273" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="273" width="80" height="7" rx="3"/>
    <text class="value" x="250" y="282">Gamma: Basic</text>

    <rect class="track" x="40" y="287" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="287" width="200" height="7" rx="3"/>
    <text class="value" x="250" y="296">Canva: Strong</text>
  </g>

  <g>
    <text class="label" x="40" y="330" font-weight="600">Free Tier Quality</text>
    <rect class="track" x="40" y="338" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="338" width="160" height="7" rx="3"/>
    <text class="value" x="250" y="347">Gamma: Decent (10 credits)</text>

    <rect class="track" x="40" y="352" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="352" width="120" height="7" rx="3"/>
    <text class="value" x="250" y="361">Canva: Limited templates</text>
  </g>

  <g>
    <text class="label" x="40" y="395" font-weight="600">Best Use Case</text>
    <text class="value" x="40" y="415">Gamma: Rapid presentations, speed-first workflows</text>
    <text class="value" x="40" y="433">Canva: Multi-purpose design, teams, brand consistency</text>
  </g>
</svg>