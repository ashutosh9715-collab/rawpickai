<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <rect width="900" height="200" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Composer 2.5 Pricing — API Token Rates</text>
  <rect x="80" y="55" width="340" height="110" rx="12" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="250" y="82" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#4A5942">Standard Tier</text>
  <text x="250" y="112" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#4A453E">$0.50/M input (≈₹46.50)</text>
  <text x="250" y="136" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#4A453E">$2.50/M output (≈₹232.50)</text>
  <text x="250" y="155" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">6x cheaper than Claude Sonnet</text>
  <rect x="480" y="55" width="340" height="110" rx="12" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="650" y="82" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#96845A">Fast Tier (Default)</text>
  <text x="650" y="112" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#4A453E">$3.00/M input (≈₹279)</text>
  <text x="650" y="136" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#4A453E">$15.00/M output (≈₹1,395)</text>
  <text x="650" y="155" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Same price as Claude Sonnet</text>
  <text x="450" y="190" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Launch week: double included usage for all Cursor Pro subscribers ($20/mo ≈ ₹1,860/mo)</text>
</svg>
