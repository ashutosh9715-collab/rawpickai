  <text x="600" y="100" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1A2416" text-anchor="middle">Week of May 12-15, 2026</text>
  <line x1="200" y1="125" x2="1000" y2="125" stroke="#4A5942" stroke-width="1" opacity="0.3"/>
  <rect x="60" y="150" width="340" height="130" rx="12" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="80" y="180" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#c0392b">01 LAYOFFS</text>
  <text x="80" y="210" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#1A2416">Cloudflare: 1,100 Jobs Cut</text>
  <text x="80" y="235" font-family="Georgia, serif" font-size="14" fill="#4A453E">Record $640M revenue, -20% staff</text>
  <text x="80" y="260" font-family="Georgia, serif" font-size="14" fill="#4A453E">CEO: AI made roles unnecessary</text>
  <rect x="430" y="150" width="340" height="130" rx="12" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="450" y="180" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#c0392b">02 LAYOFFS</text>
