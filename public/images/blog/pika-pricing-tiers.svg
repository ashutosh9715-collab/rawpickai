<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #4A5942; }
      .tier-name { font-size: 14px; font-weight: bold; fill: #3A3228; }
      .price { font-size: 16px; font-weight: bold; fill: #96845A; }
      .credits { font-size: 12px; fill: #3A3228; }
      .description { font-size: 11px; fill: #8A8577; }
      .bar-bg { fill: #DDD8CE; }
      .bar-fill { fill: #6B7C5E; }
      .bar-secondary { fill: #96845A; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Pika AI Pricing Tiers</text>
  <text x="400" y="48" text-anchor="middle" class="description">Monthly credits and realistic monthly spend. Commercial rights start at Pro tier.</text>

  <!-- Free Tier -->
  <g>
    <rect x="20" y="70" width="170" height="300" fill="white" stroke="#DDD8CE" stroke-width="2" rx="8"/>
    <text x="105" y="100" text-anchor="middle" class="tier-name">Free</text>
    <text x="105" y="125" text-anchor="middle" class="price">$0</text>
    <text x="105" y="145" text-anchor="middle" class="credits">(₹0)</text>
    <rect x="35" y="160" width="140" height="8" rx="4" class="bar-bg"/>
    <rect x="35" y="160" width="5.4" height="8" rx="4" class="bar-secondary"/>
    <text x="105" y="185" text-anchor="middle" class="credits">80 credits</text>
    <text x="105" y="205" text-anchor="middle" class="description" style="font-size: 10px;">8-10 videos</text>
    <text x="105" y="220" text-anchor="middle" class="description" style="font-size: 10px;">Watermarked</text>
    <text x="105" y="235" text-anchor="middle" class="description" style="font-size: 9px;">No rights</text>
  </g>

  <!-- Standard Tier -->
  <g>
    <rect x="215" y="70" width="170" height="300" fill="white" stroke="#DDD8CE" stroke-width="2" rx="8"/>
    <text x="300" y="100" text-anchor="middle" class="tier-name">Standard</text>
    <text x="300" y="125" text-anchor="middle" class="price">$10/mo</text>
    <text x="300" y="145" text-anchor="middle" class="credits">(≈₹930)</text>
    <rect x="230" y="160" width="140" height="8" rx="4" class="bar-bg"/>
    <rect x="230" y="160" width="47.6" height="8" rx="4" class="bar-fill"/>
    <text x="300" y="185" text-anchor="middle" class="credits">700 credits</text>
    <text x="300" y="205" text-anchor="middle" class="description" style="font-size: 10px;">70 videos</text>
    <text x="300" y="220" text-anchor="middle" class="description" style="font-size: 10px;">Watermarked</text>
    <text x="300" y="235" text-anchor="middle" class="description" style="font-size: 9px;">No rights</text>
  </g>

  <!-- Pro Tier - RECOMMENDED -->
  <g>
    <rect x="410" y="70" width="170" height="300" fill="white" stroke="#96845A" stroke-width="3" rx="8"/>
    <!-- Badge -->
    <rect x="440" y="55" width="110" height="20" fill="#96845A" rx="4"/>
    <text x="495" y="67" text-anchor="middle" class="description" style="fill: white; font-weight: bold; font-size: 10px;">RECOMMENDED</text>

    <text x="495" y="100" text-anchor="middle" class="tier-name">Pro</text>
    <text x="495" y="125" text-anchor="middle" class="price">$35/mo</text>
    <text x="495" y="145" text-anchor="middle" class="credits">(≈₹3,255)</text>
    <rect x="425" y="160" width="140" height="8" rx="4" class="bar-bg"/>
    <rect x="425" y="160" width="155.6" height="8" rx="4" class="bar-secondary"/>
    <text x="495" y="185" text-anchor="middle" class="credits">2,300 credits</text>
    <text x="495" y="205" text-anchor="middle" class="description" style="font-size: 10px;">460 videos</text>
    <text x="495" y="220" text-anchor="middle" class="description" style="font-size: 10px;">No watermark</text>
    <text x="495" y="235" text-anchor="middle" class="description" style="font-size: 9px; font-weight: bold;">Commercial ✓</text>
  </g>

  <!-- Fancy Tier -->
  <g>
    <rect x="605" y="70" width="170" height="300" fill="white" stroke="#DDD8CE" stroke-width="2" rx="8"/>
    <text x="690" y="100" text-anchor="middle" class="tier-name">Fancy</text>
    <text x="690" y="125" text-anchor="middle" class="price">$95/mo</text>
    <text x="690" y="145" text-anchor="middle" class="credits">(≈₹8,075)</text>
    <rect x="620" y="160" width="140" height="8" rx="4" class="bar-bg"/>
    <rect x="620" y="160" width="140" height="8" rx="4" class="bar-fill"/>
    <text x="690" y="185" text-anchor="middle" class="credits">Unlimited</text>
    <text x="690" y="205" text-anchor="middle" class="description" style="font-size: 10px;">1000+ videos</text>
    <text x="690" y="220" text-anchor="middle" class="description" style="font-size: 10px;">API access</text>
    <text x="690" y="235" text-anchor="middle" class="description" style="font-size: 9px;">Agencies</text>
  </g>

  <!-- Footer note -->
  <text x="400" y="400" text-anchor="middle" class="description">Generation speed: 2-3 minutes per 5-second video on Pro tier. Free/Standard have longer queue times (5-10 min peak).</text>
  <text x="400" y="420" text-anchor="middle" class="description">Commercial rights restriction on Standard is critical: you cannot monetize or sell Standard content.</text>
  <text x="400" y="440" text-anchor="middle" class="description">Conversion at ₹93/USD | Updated May 2026</text>
</svg>