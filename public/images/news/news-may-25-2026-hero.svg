  <text x="290" y="385" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#4A5942">Magnifica Humanitas</text>
  <text x="290" y="415" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A453E">First papal encyclical on AI</text>
  <text x="290" y="440" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">Signed 135 years after Rerum Novarum</text>
  <rect x="460" y="350" width="280" height="120" rx="12" fill="white" stroke="#96845A" stroke-width="1.5"/>
