<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F1EA" rx="16"/>
  <rect x="0" y="0" width="1200" height="6" fill="#4A5942" rx="3"/>
  <text x="600" y="70" font-family="Georgia, serif" font-size="16" font-weight="600" text-anchor="middle" fill="#6B7C5E">RAWPICKAI NEWS · MAY 30, 2026</text>
  <text x="600" y="150" font-family="Georgia, serif" font-size="40" font-weight="700" text-anchor="middle" fill="#1A2416">Enterprise AI Cost Crisis:</text>
  <text x="600" y="205" font-family="Georgia, serif" font-size="40" font-weight="700" text-anchor="middle" fill="#1A2416">Microsoft Drops Claude Code, Uber Blew $3.4B in 4 Months</text>
  <text x="600" y="255" font-family="Georgia, serif" font-size="22" text-anchor="middle" fill="#4A453E">Token-based pricing is breaking enterprise budgets</text>
