  <text x="910" y="295" font-family="Georgia, serif" font-size="48" font-weight="700" text-anchor="middle" fill="#c0392b">-1,100</text>
  <text x="910" y="323" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#4A453E">jobs cut (20% of workforce)</text>
