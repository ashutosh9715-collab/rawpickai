<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="380" rx="12" fill="#F4F1EA"/>

  <text x="400" y="36" fill="#1A2416" font-size="18" font-weight="700" text-anchor="middle">The Tokenizer Cost Trap: Same Prompt, Higher Bill</text>
  <text x="400" y="56" fill="#8b8fa3" font-size="13" text-anchor="middle">Per-token rate unchanged, but the new tokenizer uses more tokens</text>

  <!-- Scenario: 10,000-word production prompt -->
  <text x="400" y="90" fill="#c4c7d4" font-size="12" text-anchor="middle">Scenario: Same 10,000-word prompt on both models</text>

  <!-- Opus 4.6 card -->
  <rect x="40" y="112" width="340" height="210" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <rect x="160" y="102" width="100" height="18" rx="9" fill="#5a5e72"/>
  <text x="210" y="115" fill="#1A2416" font-size="9" font-weight="700" text-anchor="middle">OPUS 4.6 (BASELINE)</text>
  <text x="210" y="148" fill="#c4c7d4" font-size="12" font-weight="600" text-anchor="middle">Old tokenizer</text>

  <text x="60" y="180" fill="#8b8fa3" font-size="10">Tokens used:</text>
  <text x="360" y="180" fill="#1A2416" font-size="13" font-weight="700" text-anchor="end">≈13,000 tokens</text>

  <text x="60" y="208" fill="#8b8fa3" font-size="10">Input cost:</text>
  <text x="360" y="208" fill="#1A2416" font-size="13" font-weight="700" text-anchor="end">$0.065 (≈₹6)</text>

  <text x="60" y="236" fill="#8b8fa3" font-size="10">Output (1K tokens):</text>
  <text x="360" transform="rotate(-25,360,236)" y="236" fill="#1A2416" font-size="13" font-weight="700" text-anchor="end">$0.025 (≈₹2.3)</text>

  <text x="60" y="264" fill="#8b8fa3" font-size="10">Total per request:</text>
  <text x="360" transform="rotate(-25,360,264)" y="264" fill="#3a8c5e" font-size="14" font-weight="700" text-anchor="end">$0.090 (≈₹8.4)</text>

  <text x="60" y="298" fill="#8b8fa3" font-size="10">At 10K requests/mo:</text>
  <text x="360" transform="rotate(-25,360,298)" y="298" fill="#3a8c5e" font-size="13" font-weight="700" text-anchor="end">$900/mo (≈₹83,700)</text>

  <!-- Arrow -->
  <text x="400" y="220" fill="#c97b3a" font-size="28" font-weight="700" text-anchor="middle">→</text>
  <text x="400" y="242" fill="#c97b3a" font-size="10" font-weight="600" text-anchor="middle">same prompt</text>
  <text x="400" y="256" fill="#c97b3a" font-size="10" font-weight="600" text-anchor="middle">same rate</text>

  <!-- Opus 4.7 card -->
  <rect x="420" y="112" width="340" height="210" rx="10" fill="#1a1d2a" stroke="#c97b3a" stroke-width="2"/>
  <rect x="540" y="102" width="100" height="18" rx="9" fill="#c97b3a"/>
  <text x="590" y="115" fill="#1A2416" font-size="9" font-weight="700" text-anchor="middle">OPUS 4.7 (NEW)</text>
  <text x="590" y="148" fill="#c4c7d4" font-size="12" font-weight="600" text-anchor="middle">New tokenizer</text>

  <text x="468" y="180" fill="#8b8fa3" font-size="10">Tokens used:</text>
  <text x="740" y="180" fill="#c97b3a" font-size="13" font-weight="700" text-anchor="end">≈16,640 tokens (+28%)</text>

  <text x="454" y="208" fill="#8b8fa3" font-size="10">Input cost:</text>
  <text x="740" y="208" fill="#c97b3a" font-size="13" font-weight="700" text-anchor="end">$0.083 (≈₹7.7)</text>

  <text x="440" transform="rotate(-25,440,236)" y="236" fill="#8b8fa3" font-size="10">Output (1K tokens):</text>
  <text x="740" y="236" fill="#1A2416" font-size="13" font-weight="700" text-anchor="end">$0.025 (≈₹2.3)</text>

  <text x="440" transform="rotate(-25,440,264)" y="264" fill="#8b8fa3" font-size="10">Total per request:</text>
  <text x="740" y="264" fill="#c97b3a" font-size="14" font-weight="700" text-anchor="end">$0.108 (≈₹10.0)</text>

  <text x="440" transform="rotate(-25,440,298)" y="298" fill="#8b8fa3" font-size="10">At 10K requests/mo:</text>
  <text x="740" y="298" fill="#c97b3a" font-size="13" font-weight="700" text-anchor="end">$1,080/mo (≈₹1.0L)</text>

  <!-- Bottom warning -->
  <rect x="40" y="338" width="720" height="30" rx="6" fill="#3d2a1a" stroke="#c97b3a" stroke-width="1"/>
  <text x="400" y="357" fill="#c97b3a" font-size="12" font-weight="700" text-anchor="middle">Effective cost increase: ≈20% on mixed workloads, up to 35% on text-heavy prompts</text>
</svg>
