<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 700; fill: #4A5942; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #4A5942; }
      .row-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 500; fill: #3A3228; }
      .cell-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #3A3228; }
      .slides { fill: #6B7C5E; opacity: 0.1; }
      .ppt { fill: #96845A; opacity: 0.1; }
      .gamma { fill: #6B7C5E; opacity: 0.08; }
      .highlight { font-weight: 600; }
      .best { fill: #6B7C5E; font-weight: 700; }
      .expensive { fill: #96845A; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" width="900" height="560" rx="12"/>

  <text class="heading" x="40" y="45">Google Slides Gemini vs PowerPoint Copilot vs Gamma</text>

  <!-- Table Header -->
  <rect class="slides" x="40" y="65" width="280" height="40" rx="4"/>
  <text class="col-header" x="60" y="95">Google Slides</text>

  <rect class="ppt" x="340" y="65" width="280" height="40" rx="4"/>
  <text class="col-header" x="360" y="95">PowerPoint Copilot</text>

  <rect class="gamma" x="640" y="65" width="220" height="40" rx="4"/>
  <text class="col-header" x="660" y="95">Gamma</text>

  <!-- Price Row -->
  <text class="row-label" x="40" y="135">Price/Month</text>
  <text class="best" x="60" y="155">$0 (free)</text>
  <text class="expensive" x="360" y="155">$52</text>
  <text class="highlight" x="660" y="155">$10</text>

  <!-- Design Quality -->
  <text class="row-label" x="40" y="200">Design Quality</text>
  <text class="cell-text" x="60" y="220">5/10</text>
  <text class="cell-text" x="360" y="220">6/10</text>
  <text class="cell-text highlight" x="660" y="220">8.5/10</text>

  <!-- Outline/Notes Quality -->
  <text class="row-label" x="40" y="265">Outline + Notes</text>
  <text class="cell-text highlight" x="60" y="285">Excellent</text>
  <text class="cell-text" x="360" y="285">Good</text>
  <text class="cell-text" x="660" y="285">Good</text>

  <!-- Teams Integration -->
  <text class="row-label" x="40" y="330">Integration</text>
  <text class="cell-text highlight" x="60" y="350">Google Workspace</text>
  <text class="cell-text highlight" x="360" y="350">Microsoft Teams</text>
  <text class="cell-text" x="660" y="350">Web-native</text>

  <!-- Collaboration -->
  <text class="row-label" x="40" y="395">Collaboration</text>
  <text class="cell-text highlight" x="60" y="415">Real-time sync</text>
  <text class="cell-text highlight" x="360" y="415">Excellent</text>
  <text class="cell-text" x="660" y="415">Limited</text>

  <!-- Learning Curve -->
  <text class="row-label" x="40" y="460">Learning Curve</text>
  <text class="cell-text highlight" x="60" y="480">None (familiar)</text>
  <text class="cell-text" x="360" y="480">Medium</text>
  <text class="cell-text" x="660" y="480">Low</text>

  <!-- Best For -->
  <text class="row-label" x="40" y="525">Best For</text>
  <text class="cell-text" x="60" y="545">Internal + budget conscious</text>
  <text class="cell-text" x="360" y="545">Enterprise Microsoft only</text>
  <text class="cell-text" x="660" y="545">External + design quality</text>
</svg>
