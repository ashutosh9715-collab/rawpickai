<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <rect width="900" height="160" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">The Verdict: Which Model Should You Pay For?</text>
  <rect x="40" y="55" width="380" height="80" rx="10" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="230" y="82" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4A5942">Pick Claude Opus 4.8 if</text>
  <text x="230" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">You write for work · Debug existing code</text>
  <text x="230" y="123" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Run browser agents · Want Mythos 1 later</text>
  <rect x="480" y="55" width="380" height="80" rx="10" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="670" y="82" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#96845A">Pick GPT-5.5 if</text>
  <text x="670" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">You need image generation · Build from scratch</text>
  <text x="670" y="123" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Use ChatGPT plugins/GPTs heavily</text>
  <text x="450" y="152" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Both cost $20/mo (≈₹1,860) at standard tier. The difference is what you do with them daily.</text>
