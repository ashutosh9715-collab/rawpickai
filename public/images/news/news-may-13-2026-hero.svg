  <text x="60" y="80" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#96845A" letter-spacing="3">RAWPICKAI NEWS BRIEF</text>
  <text x="60" y="138" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#1A2416" letter-spacing="-1">Cloudflare Cuts 1,100 at Record Revenue</text>
