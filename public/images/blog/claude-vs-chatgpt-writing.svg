<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="900" height="480" rx="12" fill="#F4F1EA"/>

  <text x="450" y="36" fill="#3A3228" font-size="18" font-weight="700" text-anchor="middle">Claude vs ChatGPT: Writing Quality</text>
  <text x="450" y="56" fill="#8A8577" font-size="13" text-anchor="middle">Detailed comparison across writing tasks  -  May 2026</text>

  <!-- Header row -->
  <rect x="20" y="76" width="220" height="40" rx="7" fill="#4A5942"/>
  <rect x="240" y="76" width="220" height="40" rx="7" fill="#4A5942"/>
  <rect x="460" y="76" width="220" height="40" rx="7" fill="#4A5942"/>
  <rect x="680" y="76" width="200" height="40" rx="7" fill="#4A5942"/>

  <text x="130" y="104" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">Task</text>
  <text x="350" y="104" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">ChatGPT 5.4</text>
  <text x="570" y="104" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">Claude Opus</text>
  <text x="780" y="104" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">Winner</text>

  <!-- Row 1: Blog introductions -->
  <rect x="20" y="124" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="124" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="124" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="124" width="200" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="152" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Blog introductions</text>
  <text x="350" y="152" fill="#96845A" font-size="12" font-weight="700" text-anchor="middle">Good</text>
  <text x="570" y="152" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Excellent</text>
  <text x="780" y="152" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Claude</text>

  <!-- Row 2: Long-form articles (3000+ words) -->
  <rect x="20" y="172" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="172" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="172" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="172" width="200" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="200" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Long-form articles</text>
  <text x="350" y="200" fill="#96845A" font-size="12" font-weight="700" text-anchor="middle">Fair</text>
  <text x="570" y="200" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Very good</text>
  <text x="780" y="200" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Claude</text>

  <!-- Row 3: Email writing -->
  <rect x="20" y="220" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="220" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="220" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="220" width="200" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="248" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Email writing</text>
  <text x="350" y="248" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>
  <text x="570" y="248" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Excellent</text>
  <text x="780" y="248" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Claude</text>

  <!-- Row 4: Code documentation -->
  <rect x="20" y="268" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="268" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="268" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="268" width="200" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="296" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Technical docs</text>
  <text x="350" y="296" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>
  <text x="570" y="296" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>
  <text x="780" y="296" fill="#8A8577" font-size="12" font-weight="700" text-anchor="middle">Tie</text>

  <!-- Row 5: Prose voice/style -->
  <rect x="20" y="316" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="316" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="316" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="316" width="200" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="344" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Prose voice</text>
  <text x="350" y="344" fill="#96845A" font-size="12" font-weight="700" text-anchor="middle">Formulaic</text>
  <text x="570" y="344" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Natural</text>
  <text x="780" y="344" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Claude</text>

  <!-- Row 6: AI detection rate -->
  <rect x="20" y="364" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="364" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="364" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="364" width="200" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="392" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">AI detection rate</text>
  <text x="350" y="392" fill="#96845A" font-size="12" font-weight="700" text-anchor="middle">Often flagged</text>
  <text x="570" y="392" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Less flagged</text>
  <text x="780" y="392" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Claude</text>

  <!-- Row 7: Editing time required -->
  <rect x="20" y="412" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="412" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="412" width="220" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="412" width="200" height="40" rx="7" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="440" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Edit time needed</text>
  <text x="350" y="440" fill="#96845A" font-size="12" font-weight="700" text-anchor="middle">20-30%</text>
  <text x="570" y="440" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">10-15%</text>
  <text x="780" y="440" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Claude</text>

  <!-- Legend -->
  <text x="20" y="472" fill="#8A8577" font-size="11">Scale: Excellent = Best | Very good = Strong | Good = Competitive | Fair = Usable | Formulaic = Predictable</text>
</svg>
