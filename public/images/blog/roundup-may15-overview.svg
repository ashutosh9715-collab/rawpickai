  <text x="820" y="180" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#96845A">03 PLATFORM</text>
  <text x="820" y="210" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#1A2416">iOS 27: Choose Your AI</text>
  <text x="820" y="235" font-family="Georgia, serif" font-size="14" fill="#4A453E">Claude, Gemini, Grok on iPhone</text>
  <text x="820" y="260" font-family="Georgia, serif" font-size="14" fill="#4A453E">WWDC June 8 for details</text>
