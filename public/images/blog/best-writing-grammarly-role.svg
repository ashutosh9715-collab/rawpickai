<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="200" fill="#F4F1EA"/>
  <text x="350" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#4A5942">Grammarly vs AI Writers - Different Jobs</text>
  <text x="350" y="48" font-size="11" text-anchor="middle" fill="#8A8577">Grammarly complements, not competes with, generative AI tools</text>
  <rect x="40" y="75" width="280" height="70" rx="8" fill="white" stroke="#6B7C5E" stroke-width="1"/>
  <text x="180" y="100" font-size="13" font-weight="bold" text-anchor="middle" fill="#4A5942">AI Writers (Claude, ChatGPT)</text>
  <text x="180" y="120" font-size="11" text-anchor="middle" fill="#3A3228">Generate content from scratch</text>
  <text x="180" y="136" font-size="10" text-anchor="middle" fill="#8A8577">$20/mo each</text>
  <text x="350" y="112" font-size="16" fill="#4A5942">+</text>
  <rect x="380" y="75" width="280" height="70" rx="8" fill="white" stroke="#96845A" stroke-width="1"/>
  <text x="520" y="100" font-size="13" font-weight="bold" text-anchor="middle" fill="#4A5942">Grammarly</text>
  <text x="520" y="120" font-size="11" text-anchor="middle" fill="#3A3228">Polish and improve existing text</text>
  <text x="520" y="136" font-size="10" text-anchor="middle" fill="#8A8577">$12/mo - works everywhere</text>
  <rect x="130" y="160" width="440" height="25" rx="5" fill="#6B7C5E" opacity="0.1" stroke="#6B7C5E" stroke-width="1"/>
  <text x="350" y="178" font-size="11" font-weight="600" text-anchor="middle" fill="#4A5942">Best combo: Generate with Claude/ChatGPT, polish with Grammarly</text>
</svg>
