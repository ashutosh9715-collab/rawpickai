<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="380" rx="12" fill="#F4F1EA"/>

  <text x="400" y="36" fill="#1A2416" font-size="18" font-weight="700" text-anchor="middle">Anthropic's Capability Ladder: Where Opus 4.7 Sits</text>
  <text x="400" y="56" fill="#8b8fa3" font-size="13" text-anchor="middle">Mythos is more capable, but locked to ≈50 partner organizations</text>

  <!-- Mythos Preview (top, restricted) -->
  <rect x="60" y="86" width="680" height="70" rx="10" fill="#1a1d2a" stroke="#8c3a3a" stroke-width="2"/>
  <rect x="80" y="104" width="90" height="20" rx="10" fill="#8c3a3a"/>
  <text x="125" y="118" fill="#1A2416" font-size="10" font-weight="700" text-anchor="middle">RESTRICTED</text>
  <text x="80" y="144" fill="#1A2416" font-size="16" font-weight="700">Claude Mythos Preview</text>
  <text x="720" y="144" fill="#8c3a3a" font-size="13" font-weight="600" text-anchor="end">Project Glasswing only</text>
  <text x="720" y="124" fill="#8b8fa3" font-size="11" text-anchor="end">Most capable cyber/reasoning</text>

  <!-- Gap indicator -->
  <line x1="400" y1="166" x2="400" y2="186" stroke="#c97b3a" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="410" y="180" fill="#c97b3a" font-size="10" font-style="italic">capability gap by design</text>

  <!-- Opus 4.7 (middle, generally available) -->
  <rect x="60" y="196" width="680" height="70" rx="10" fill="#1a3328" stroke="#3a8c5e" stroke-width="2"/>
  <rect x="80" y="214" width="130" height="20" rx="10" fill="#3a8c5e"/>
  <text x="145" y="228" fill="#1A2416" font-size="10" font-weight="700" text-anchor="middle">GENERALLY AVAILABLE</text>
  <text x="80" y="254" fill="#1A2416" font-size="16" font-weight="700">Claude Opus 4.7 (you are here)</text>
  <text x="720" y="254" fill="#3a8c5e" font-size="13" font-weight="600" text-anchor="end">$5/$25 per 1M tokens</text>
  <text x="720" y="234" fill="#8b8fa3" font-size="11" text-anchor="end">Better coding, vision, agentic</text>

  <!-- Arrow down -->
  <text x="400" y="284" fill="#5a5e72" font-size="14" text-anchor="middle">↓</text>

  <!-- Opus 4.6 (bottom, previous gen) -->
  <rect x="60" y="296" width="680" height="70" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <rect x="80" y="314" width="100" height="20" rx="10" fill="#5a5e72"/>
  <text x="130" y="328" fill="#1A2416" font-size="10" font-weight="700" text-anchor="middle">PREVIOUS GEN</text>
  <text x="80" y="354" fill="#c4c7d4" font-size="16" font-weight="700">Claude Opus 4.6</text>
  <text x="720" y="354" fill="#8b8fa3" font-size="13" font-weight="600" text-anchor="end">$5/$25 per 1M tokens</text>
  <text x="720" y="334" fill="#8b8fa3" font-size="11" text-anchor="end">Still available via API</text>
</svg>
