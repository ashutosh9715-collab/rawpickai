<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 600; fill: #4A5942; }
      .subheading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #8A8577; }
      .tool-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #3A3228; }
      .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #3A3228; }
      .value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #8A8577; }
      .bar-bg { fill: #DDD8CE; }
      .bar1 { fill: #6B7C5E; }
      .bar2 { fill: #96845A; }
      .bar3 { fill: #A89F8F; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="600" rx="12"/>

  <!-- Header -->
  <text class="heading" x="40" y="50">Firefly vs Midjourney vs Canva</text>
  <text class="subheading" x="40" y="70">Quality, pricing, and best-fit comparison</text>

  <!-- Photorealism -->
  <text class="metric-label" x="40" y="115">Photorealism</text>
  <rect class="bar-bg" x="150" y="105" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="105" width="170" height="16" rx="6"/>
  <text class="value" x="360" y="115">Firefly: 85%</text>

  <rect class="bar-bg" x="550" y="105" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="105" width="200" height="16" rx="6"/>
  <text class="value" x="760" y="115">Midjourney: 100%</text>

  <rect class="bar-bg" x="150" y="130" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="130" width="140" height="16" rx="6"/>
  <text class="value" x="360" y="140">Canva: 70%</text>

  <!-- Legal Safety -->
  <text class="metric-label" x="40" y="180">Legal Safety</text>
  <rect class="bar-bg" x="150" y="170" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="170" width="200" height="16" rx="6"/>
  <text class="value" x="360" y="180">Firefly: Licensed</text>

  <rect class="bar-bg" x="550" y="170" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="170" width="100" height="16" rx="6"/>
  <text class="value" x="760" y="180">Midjourney: Ambiguous</text>

  <rect class="bar-bg" x="150" y="195" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="195" width="120" height="16" rx="6"/>
  <text class="value" x="360" y="205">Canva: Moderate</text>

  <!-- Photoshop Integration -->
  <text class="metric-label" x="40" y="245">Photoshop Integration</text>
  <rect class="bar-bg" x="150" y="235" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="235" width="200" height="16" rx="6"/>
  <text class="value" x="360" y="245">Firefly: Native</text>

  <rect class="bar-bg" x="550" y="235" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="235" width="30" height="16" rx="6"/>
  <text class="value" x="760" y="245">Midjourney: None</text>

  <rect class="bar-bg" x="150" y="260" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="260" width="60" height="16" rx="6"/>
  <text class="value" x="360" y="270">Canva: Basic</text>

  <!-- Monthly Cost (inverted scale) -->
  <text class="metric-label" x="40" y="310">Monthly Cost</text>
  <text class="value" x="150" y="320">Firefly</text>
  <rect class="bar-bg" x="150" y="300" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="300" width="160" height="16" rx="6"/>
  <text class="value" x="360" y="310">≈₹930–2,790</text>

  <text class="value" x="550" y="320">Midjourney</text>
  <rect class="bar-bg" x="550" y="300" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="300" width="180" height="16" rx="6"/>
  <text class="value" x="760" y="310">≈₹1,860–3,720</text>

  <text class="value" x="150" y="345">Canva</text>
  <rect class="bar-bg" x="150" y="325" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="325" width="100" height="16" rx="6"/>
  <text class="value" x="360" y="335">≈₹140–930</text>

  <!-- Use Case Recommendations -->
  <text class="metric-label" x="40" y="385">Best for</text>

  <!-- Firefly Box -->
  <rect x="40" y="400" width="280" height="180" fill="#FFF9F5" stroke="#6B7C5E" stroke-width="2" rx="10"/>
  <text class="tool-name" x="60" y="425" style="fill: #6B7C5E;">✓ Firefly</text>
  <text class="value" x="60" y="448">• Legal safety</text>
  <text class="value" x="60" y="468">• Photoshop users</text>
  <text class="value" x="60" y="488">• Commercial work</text>
  <text class="value" x="60" y="508">• Agencies</text>
  <text class="value" x="60" y="528">• IP indemnity</text>
  <text class="value" x="60" y="548">• Internal assets</text>
  <text class="value" x="60" y="568">• 85% quality</text>

  <!-- Midjourney Box -->
  <rect x="360" y="400" width="280" height="180" fill="#FFF9F5" stroke="#96845A" stroke-width="2" rx="10"/>
  <text class="tool-name" x="380" y="425" style="fill: #96845A;">✓ Midjourney</text>
  <text class="value" x="380" y="448">• Photorealism</text>
  <text class="value" x="380" y="468">• Premium assets</text>
  <text class="value" x="380" y="488">• Client deliverables</text>
  <text class="value" x="380" y="508">• Portfolio work</text>
  <text class="value" x="380" y="528">• API access</text>
  <text class="value" x="380" y="548">• Fine details</text>
  <text class="value" x="380" y="568">• Best quality</text>

  <!-- Canva Box -->
  <rect x="680" y="400" width="280" height="180" fill="#FFF9F5" stroke="#A89F8F" stroke-width="2" rx="10"/>
  <text class="tool-name" x="700" y="425" style="fill: #A89F8F;">✓ Canva</text>
  <text class="value" x="700" y="448">• Quick graphics</text>
  <text class="value" x="700" y="468">• Budget-conscious</text>
  <text class="value" x="700" y="488">• Social media</text>
  <text class="value" x="700" y="508">• Design templates</text>
  <text class="value" x="700" y="528">• Beginners</text>
  <text class="value" x="700" y="548">• Free tier users</text>
  <text class="value" x="700" y="568">• Non-designers</text>
</svg>