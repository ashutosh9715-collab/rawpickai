<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .background { fill: #F4F1EA; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #4A5942; }
      .card { fill: #ffffff; stroke: #DDD8CE; stroke-width: 2; rx: 12; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700; fill: #4A5942; }
      .price-usd { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 32px; font-weight: 700; fill: #96845A; }
      .price-inr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #8A8577; }
      .description { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #3A3228; }
      .feature { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #6B7C5E; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" class="background"/>

  <!-- Title -->
  <text x="40" y="40" class="title">Cursor Pricing Plans (May 2026)</text>

  <!-- Free Plan Card -->
  <rect x="30" y="80" width="180" height="380" rx="12" class="card"/>
  <text x="50" y="110" class="card-title">Free</text>
  <text x="50" y="135" class="price-usd">$0/mo</text>
  <text x="50" y="152" class="price-inr">$0/mo</text>
  <text x="50" y="180" class="description">2,000 completions/month</text>
  <text x="50" y="200" class="feature">• Testing only</text>
  <text x="50" y="218" class="feature">• Basic editor</text>
  <text x="50" y="236" class="feature">• No agent mode</text>
  <text x="50" y="254" class="feature">• Limited models</text>

  <!-- Pro Plan Card (Highlighted) -->
  <rect x="240" y="60" width="180" height="400" rx="12" class="card" stroke="#96845A" stroke-width="3"/>
  <text x="260" y="95" class="card-title" fill="#96845A">Pro</text>
  <text x="260" y="120" class="price-usd">$20/mo</text>
  <text x="260" y="137" class="price-inr">≈$20/mo (≈₹1,860)</text>
  <text x="260" y="165" class="description">Best for individuals</text>
  <text x="260" y="190" class="feature">• Full credits ($20)</text>
  <text x="260" y="208" class="feature">• All models access</text>
  <text x="260" y="226" class="feature">• Agent mode</text>
  <text x="260" y="244" class="feature">• MCP integrations</text>
  <text x="260" y="262" class="feature">• Cloud agents</text>
  <text x="260" y="280" class="feature">• 15-18 days usage</text>

  <!-- Pro+ Plan Card -->
  <rect x="450" y="80" width="180" height="380" rx="12" class="card"/>
  <text x="470" y="110" class="card-title">Pro+</text>
  <text x="470" y="135" class="price-usd">$60/mo</text>
  <text x="470" y="152" class="price-inr">≈$60/mo (≈₹5,580)</text>
  <text x="470" y="180" class="description">3x credits, heavy use</text>
  <text x="470" y="200" class="feature">• $60 monthly credits</text>
  <text x="470" y="218" class="feature">• All Pro features</text>
  <text x="470" y="236" class="feature">• Intensive workflows</text>
  <text x="470" y="254" class="feature">• Full month usage</text>

  <!-- Ultra Plan Card -->
  <rect x="660" y="80" width="180" height="380" rx="12" class="card"/>
  <text x="680" y="110" class="card-title">Ultra</text>
  <text x="680" y="135" class="price-usd">$200/mo</text>
  <text x="680" y="152" class="price-inr">≈$200/mo (≈₹18,600)</text>
  <text x="680" y="180" class="description">20x credits, premium</text>
  <text x="680" y="200" class="feature">• $200 monthly credits</text>
  <text x="680" y="218" class="feature">• Priority features</text>
  <text x="680" y="236" class="feature">• All-day agent mode</text>
  <text x="680" y="254" class="feature">• For client billing</text>

  <!-- Teams Plan Note -->
  <text x="40" y="495" class="description" style="font-size: 11px; fill: #8A8577;">Teams: $40/user/mo (≈₹3,720/user/mo)  -  Centralized billing, SSO, admin controls. Annual billing available at 20% discount.</text>

</svg>