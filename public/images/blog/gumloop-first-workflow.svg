<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 155" width="1200" height="207">
  <rect width="900" height="155" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Building in Gumloop: What to Expect</text>
  <rect x="40" y="55" width="260" height="75" rx="8" fill="white" stroke="#22c55e" stroke-width="1.5"/>
  <text x="170" y="78" font-family="Georgia, serif" font-size="12" font-weight="600" text-anchor="middle" fill="#22c55e">Easy</text>
  <text x="170" y="98" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#4A453E">AI generates workflow structure</text>
  <text x="170" y="116" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#6B6960">from natural language prompt</text>
  <rect x="320" y="55" width="260" height="75" rx="8" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="450" y="78" font-family="Georgia, serif" font-size="12" font-weight="600" text-anchor="middle" fill="#96845A">Medium</text>
  <text x="450" y="98" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#4A453E">Writing effective AI prompts</text>
  <text x="450" y="116" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#6B6960">Your job, not Gumloop's</text>
  <rect x="600" y="55" width="260" height="75" rx="8" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="730" y="78" font-family="Georgia, serif" font-size="12" font-weight="600" text-anchor="middle" fill="#c0392b">Harder first time</text>
  <text x="730" y="98" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#4A453E">Connecting nodes with</text>
  <text x="730" y="116" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#6B6960">different data shapes</text>
  <text x="450" y="148" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Watch one tutorial before your first build. The token/data-shape concept is unintuitive until you see it once.</text>
</svg>
