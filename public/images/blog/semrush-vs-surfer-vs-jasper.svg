<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="500" fill="#F4F1EA"/>
  <text x="40" y="45" font-size="28" font-weight="bold" fill="#4A5942" font-family="system-ui">
    Semrush vs Surfer vs Jasper: Tools Breakdown
  </text>

  <text x="40" y="100" font-size="13" font-weight="600" fill="#3A3228" font-family="system-ui">Metric</text>
  <text x="240" y="100" font-size="13" font-weight="600" fill="#3A3228" font-family="system-ui">Semrush</text>
  <text x="460" y="100" font-size="13" font-weight="600" fill="#3A3228" font-family="system-ui">Surfer SEO</text>
  <text x="680" y="100" font-size="13" font-weight="600" fill="#3A3228" font-family="system-ui">Jasper</text>

  <line x1="40" y1="115" x2="960" y2="115" stroke="#DDD8CE" stroke-width="2"/>

  <text x="40" y="155" font-size="12" font-weight="500" fill="#3A3228" font-family="system-ui">Price/Month</text>
  <text x="240" y="155" font-size="12" fill="#6B7C5E" font-family="system-ui" font-weight="bold">$117</text>
  <text x="460" y="155" font-size="12" fill="#6B7C5E" font-family="system-ui" font-weight="bold">$16 (≈₹1,500)-3,500</text>
  <text x="680" y="155" font-size="12" fill="#6B7C5E" font-family="system-ui" font-weight="bold">$49</text>

  <text x="40" y="195" font-size="12" font-weight="500" fill="#3A3228" font-family="system-ui">AI Writing Quality</text>
  <text x="240" y="195" font-size="12" fill="#3A3228" font-family="system-ui">7/10</text>
  <text x="460" y="195" font-size="12" fill="#6B7C5E" font-family="system-ui" font-weight="bold">8/10</text>
  <text x="680" y="195" font-size="12" fill="#3A3228" font-family="system-ui">7/10</text>

  <text x="40" y="235" font-size="12" font-weight="500" fill="#3A3228" font-family="system-ui">SEO Tools</text>
  <text x="240" y="235" font-size="12" fill="#6B7C5E" font-family="system-ui" font-weight="bold">Excellent</text>
  <text x="460" y="235" font-size="12" fill="#3A3228" font-family="system-ui">Specialized</text>
  <text x="680" y="235" font-size="12" fill="#3A3228" font-family="system-ui">Limited</text>

  <text x="40" y="275" font-size="12" font-weight="500" fill="#3A3228" font-family="system-ui">Keyword Research</text>
  <text x="240" y="275" font-size="12" fill="#6B7C5E" font-family="system-ui" font-weight="bold">Unmatched</text>
  <text x="460" y="275" font-size="12" fill="#8A8577" font-family="system-ui">Good</text>
  <text x="680" y="275" font-size="12" fill="#8A8577" font-family="system-ui">None</text>

  <text x="40" y="315" font-size="12" font-weight="500" fill="#3A3228" font-family="system-ui">For Individuals</text>
  <rect x="240" y="300" width="190" height="30" rx="6" fill="#DDD8CE"/>
  <text x="255" y="320" font-size="12" fill="#8A8577" font-family="system-ui">No (too expensive)</text>
  <rect x="460" y="300" width="190" height="30" rx="6" fill="#6B7C5E" opacity="0.2"/>
  <text x="475" y="320" font-size="12" fill="#3A3228" font-family="system-ui">Yes</text>
  <rect x="680" y="300" width="190" height="30" rx="6" fill="#DDD8CE"/>
  <text x="695" y="320" font-size="12" fill="#8A8577" font-family="system-ui">No (overpriced)</text>

  <text x="40" y="365" font-size="12" font-weight="500" fill="#3A3228" font-family="system-ui">For Agencies</text>
  <rect x="240" y="350" width="190" height="30" rx="6" fill="#6B7C5E" opacity="0.2"/>
  <text x="255" y="370" font-size="12" fill="#3A3228" font-family="system-ui">Yes</text>
  <rect x="460" y="350" width="190" height="30" rx="6" fill="#6B7C5E" opacity="0.2"/>
  <text x="475" y="370" font-size="12" fill="#3A3228" font-family="system-ui">Yes</text>
  <rect x="680" y="350" width="190" height="30" rx="6" fill="#6B7C5E" opacity="0.2"/>
  <text x="695" y="370" font-size="12" fill="#3A3228" font-family="system-ui">Yes</text>

  <rect x="40" y="410" width="920" height="45" rx="8" fill="#96845A" opacity="0.1" stroke="#DDD8CE" stroke-width="1"/>
  <text x="60" y="433" font-size="11" fill="#3A3228" font-family="system-ui" font-weight="600">
    Semrush = all-in-one but expensive. Surfer = SEO specialist + Claude combo. Jasper = brand voice focus.
  </text>
</svg>