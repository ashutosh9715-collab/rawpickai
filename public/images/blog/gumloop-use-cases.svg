  <text x="555" y="118" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">best in no-code 2026</text>
  <rect x="670" y="55" width="190" height="90" rx="8" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="765" y="80" font-family="Georgia, serif" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Support agents</text>
