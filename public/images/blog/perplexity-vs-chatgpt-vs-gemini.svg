<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="900" height="480" rx="12" fill="#F4F1EA"/>

  <text x="450" y="36" fill="#3A3228" font-size="18" font-weight="700" text-anchor="middle">Perplexity vs ChatGPT vs Gemini</text>
  <text x="450" y="56" fill="#8A8577" font-size="13" text-anchor="middle">How they compare across research and writing  -  May 2026</text>

  <!-- Header row -->
  <rect x="20" y="76" width="220" height="40" rx="6" fill="#4A5942"/>
  <rect x="240" y="76" width="220" height="40" rx="6" fill="#4A5942"/>
  <rect x="460" y="76" width="220" height="40" rx="6" fill="#4A5942"/>
  <rect x="680" y="76" width="200" height="40" rx="6" fill="#4A5942"/>

  <text x="130" y="104" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">Task</text>
  <text x="350" y="104" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">Perplexity</text>
  <text x="570" y="104" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">ChatGPT</text>
  <text x="780" y="104" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">Gemini</text>

  <!-- Row 1: Factual research -->
  <rect x="20" y="124" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="124" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="124" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="124" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="152" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Factual research</text>
  <text x="350" y="152" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Excellent</text>
  <text x="570" y="152" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>
  <text x="780" y="152" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>

  <!-- Row 2: Citations and sources -->
  <rect x="20" y="172" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="172" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="172" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
