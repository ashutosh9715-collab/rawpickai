<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title3">
  <title id="title3">Comparison of this weeks four AI tool launches with pricing and status</title>
  <rect width="800" height="440" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="40" y="42" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#1A2416">This week's launches at a glance</text>
  <text x="40" y="62" font-family="Georgia, serif" font-size="13" fill="#6B6960">Pricing verified April 24, 2026 at $1 (≈₹93)/USD</text>

  <!-- Table header -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="720" height="38" rx="6" fill="#4A5942"/>
    <text x="20" y="25" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#F4F1EA">Tool</text>
    <text x="200" y="25" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#F4F1EA">Best for</text>
    <text x="450" y="25" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#F4F1EA">Price (USD)</text>
    <text x="620" y="25" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#F4F1EA">Status</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(40, 138)">
    <rect x="0" y="0" width="720" height="62" fill="#FFFFFF" stroke="#E8E3D3" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="62" fill="#4A5942"/>
    <text x="20" y="28" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A2416">ChatGPT Images 2.0</text>
    <text x="20" y="48" font-family="Georgia, serif" font-size="11" fill="#6B6960">OpenAI · Apr 21</text>
    <text x="200" y="28" font-family="Georgia, serif" font-size="13" fill="#4A453E">Multilingual posters,</text>
    <text x="200" y="48" font-family="Georgia, serif" font-size="13" fill="#4A453E">infographics, manga/pixel art</text>
    <text x="450" y="28" font-family="Georgia, serif" font-size="13" fill="#4A453E">$20/mo (Plus)</text>
    <text x="450" y="48" font-family="Georgia, serif" font-size="13" fill="#4A453E">≈ $20/mo (≈₹1,860)</text>
    <rect x="610" y="18" width="92" height="26" rx="13" fill="#6B7C5E"/>
    <text x="656" y="35" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Live (GA)</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="720" height="62" fill="#FFFFFF" stroke="#E8E3D3" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="62" fill="#6B7C5E"/>
    <text x="20" y="28" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A2416">Claude Live Artifacts</text>
    <text x="20" y="48" font-family="Georgia, serif" font-size="11" fill="#6B6960">Anthropic · Cowork</text>
    <text x="200" y="28" font-family="Georgia, serif" font-size="13" fill="#4A453E">Auto-updating dashboards,</text>
    <text x="200" y="48" font-family="Georgia, serif" font-size="13" fill="#4A453E">trackers, ops tooling</text>
    <text x="450" y="28" font-family="Georgia, serif" font-size="13" fill="#4A453E">In Cowork beta</text>
    <text x="450" y="48" font-family="Georgia, serif" font-size="13" fill="#4A453E">Invite-based</text>
    <rect x="610" y="18" width="92" height="26" rx="13" fill="#96845A"/>
    <text x="656" y="35" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Beta</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(40, 282)">
    <rect x="0" y="0" width="720" height="62" fill="#FFFFFF" stroke="#E8E3D3" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="62" fill="#96845A"/>
    <text x="20" y="28" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A2416">Canva × Claude Design</text>
    <text x="20" y="48" font-family="Georgia, serif" font-size="11" fill="#6B6960">Canva + Anthropic · April</text>
    <text x="200" y="28" font-family="Georgia, serif" font-size="13" fill="#4A453E">Editable AI drafts,</text>
    <text x="200" y="48" font-family="Georgia, serif" font-size="13" fill="#4A453E">HTML import to Canva</text>
    <text x="450" y="28" font-family="Georgia, serif" font-size="13" fill="#4A453E">$14.99/mo (Canva Pro)</text>
    <text x="450" y="48" font-family="Georgia, serif" font-size="13" fill="#4A453E">≈ $15/mo (≈₹1,394)</text>
    <rect x="610" y="18" width="92" height="26" rx="13" fill="#6B7C5E"/>
    <text x="656" y="35" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rolling out</text>
  </g>

  <!-- Row 4 -->
  <g transform="translate(40, 354)">
    <rect x="0" y="0" width="720" height="62" fill="#FFFFFF" stroke="#E8E3D3" stroke-width="1"/>
    <rect x="0" y="0" width="4" height="62" fill="#2D3A28"/>
    <text x="20" y="28" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A2416">Perplexity Personal Computer</text>
    <text x="20" y="48" font-family="Georgia, serif" font-size="11" fill="#6B6960">Perplexity · macOS</text>
    <text x="226" y="28" font-family="Georgia, serif" font-size="13" fill="#4A453E">Local file operations,</text>
    <text x="200" y="48" font-family="Georgia, serif" font-size="13" fill="#4A453E">cross-app automation</text>
    <text x="450" y="28" font-family="Georgia, serif" font-size="13" fill="#4A453E">$200/mo (Max)</text>
    <text x="450" y="48" font-family="Georgia, serif" font-size="13" fill="#4A453E">≈ $200/mo (≈₹18,600)</text>
    <rect x="610" y="18" width="92" height="26" rx="13" fill="#96845A"/>
    <text x="656" y="35" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Waitlist</text>
  </g>
</svg>
