<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <rect width="900" height="200" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#96845A" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Magnifica Humanitas: The Vatican Frames AI as This Era's Industrial Revolution</text>
  <rect x="60" y="55" width="250" height="115" rx="10" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="185" y="82" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#4A5942">The Parallel</text>
  <text x="185" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Rerum Novarum (1891)</text>
  <text x="185" y="125" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Workers' rights in Industrial Rev</text>
  <text x="185" y="150" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#96845A">Magnifica Humanitas (2026)</text>
  <text x="185" y="165" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#96845A">Human dignity in AI era</text>
  <rect x="340" y="55" width="250" height="115" rx="10" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="465" y="82" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#96845A">Core Themes</text>
  <text x="465" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Protection of human person</text>
  <text x="465" y="125" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">AI safety as moral imperative</text>
  <text x="465" y="150" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Technology serving humanity</text>
  <text x="465" y="165" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Not anti-AI, but pro-human</text>
  <rect x="620" y="55" width="250" height="115" rx="10" fill="white" stroke="#6B7C5E" stroke-width="1.5"/>
  <text x="745" y="82" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#6B7C5E">Why Chris Olah?</text>
  <text x="745" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Anthropic co-founder</text>
  <text x="745" y="125" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Pioneer in AI interpretability</text>
  <text x="745" y="150" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Vatican chose safety-focused lab</text>
  <text x="745" y="165" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Not Google, not OpenAI</text>
  <text x="450" y="192" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Signed May 15, 2026. Presented May 25. 135 years to the day after Rerum Novarum.</text>
</svg>
