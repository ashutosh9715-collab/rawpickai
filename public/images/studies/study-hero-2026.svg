<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F1EA"/>
      <stop offset="100%" stop-color="#E8E3D6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" rx="12" fill="url(#bg)"/>

  <!-- Study badge -->
  <rect x="40" y="40" width="90" height="26" rx="13" fill="#4A5942"/>
  <text x="85" y="58" fill="#F4F1EA" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">STUDY</text>

  <!-- Period -->
  <text x="145" y="58" fill="#8A8577" font-size="11" font-weight="600">Q1 2026 · Jan–Apr</text>

  <!-- Title -->
  <text x="40" y="110" fill="#4A5942" font-size="28" font-weight="800">The 2026 AI Tools Reality Check</text>
  <text x="40" y="142" fill="#6B7C5E" font-size="15" font-weight="500">What 48 tools, tested over 3 months, actually revealed about pricing and quality</text>

  <!-- Stats row — 4 headline numbers -->
  <g transform="translate(40, 180)">
    <!-- Stat 1 -->
    <rect width="170" height="90" rx="10" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="0.5"/>
    <text x="85" y="45" fill="#4A5942" font-size="32" font-weight="800" text-anchor="middle">48</text>
    <text x="85" y="64" fill="#8A8577" font-size="10" font-weight="600" text-anchor="middle">TOOLS TESTED</text>
    <text x="85" y="80" fill="#3A3228" font-size="10" text-anchor="middle">Over 3 months</text>

    <!-- Stat 2 -->
    <rect x="185" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="0.5"/>
    <text x="270" y="45" fill="#4A5942" font-size="32" font-weight="800" text-anchor="middle">79%</text>
    <text x="270" y="64" fill="#8A8577" font-size="10" font-weight="600" text-anchor="middle">HIDE ENTERPRISE PRICING</text>
    <text x="270" y="80" fill="#3A3228" font-size="10" text-anchor="middle">"Contact sales" only</text>

    <!-- Stat 3 -->
    <rect x="370" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="0.5"/>
    <text x="455" y="45" fill="#4A5942" font-size="32" font-weight="800" text-anchor="middle">67%</text>
    <text x="455" y="64" fill="#8A8577" font-size="10" font-weight="600" text-anchor="middle">USABLE FREE TIERS</text>
    <text x="455" y="80" fill="#3A3228" font-size="10" text-anchor="middle">Not just throttled demos</text>

    <!-- Stat 4 -->
    <rect x="555" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="0.5"/>
    <text x="640" y="45" fill="#4A5942" font-size="32" font-weight="800" text-anchor="middle">$15</text>
    <text x="640" y="64" fill="#8A8577" font-size="10" font-weight="600" text-anchor="middle">MEDIAN ENTRY PRICE</text>
    <text x="640" y="80" fill="#3A3228" font-size="10" text-anchor="middle">≈₹1,395/month</text>
  </g>

  <!-- Footer line -->
  <text x="40" y="320" fill="#8A8577" font-size="11">Methodology · Scoring rubric · Downloadable CSV with all 48 tools</text>
  <text x="760" y="320" fill="#8A8577" font-size="11" text-anchor="end">rawpickai.com</text>
</svg>
