<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="280" fill="#F4F1EA"/>
  <text x="350" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#4A5942">Perplexity vs Manual Research - Time Comparison</text>
  <text x="350" y="48" font-size="11" text-anchor="middle" fill="#8A8577">Finding 8 sources for a climate policy research essay</text>
  <text x="20" y="100" font-size="12" font-weight="600" fill="#3A3228">Perplexity Pro Search</text>
  <rect x="200" y="85" width="60" height="24" rx="4" fill="#6B7C5E"/>
  <text x="270" y="102" font-size="12" font-weight="700" fill="#4A5942">5 min</text>
  <text x="310" y="102" font-size="10" fill="#8A8577">8 sources with summaries</text>
  <text x="20" y="145" font-size="12" font-weight="600" fill="#3A3228">Google Scholar</text>
  <rect x="200" y="130" width="300" height="24" rx="4" fill="#96845A"/>
  <text x="510" y="147" font-size="12" font-weight="700" fill="#4A5942">45 min</text>
  <text x="555" y="147" font-size="10" fill="#8A8577">8 sources found</text>
  <text x="20" y="190" font-size="12" font-weight="600" fill="#3A3228">General Google</text>
  <rect x="200" y="175" width="400" height="24" rx="4" fill="#8A8577"/>
  <text x="610" y="192" font-size="12" font-weight="700" fill="#4A5942">90+ min</text>
  <text x="20" y="230" font-size="11" fill="#3A3228">Source quality:</text>
  <text x="200" y="230" font-size="11" fill="#4A5942">Perplexity: IMF, NBER, central banks</text>
  <text x="200" y="248" font-size="11" fill="#8A8577">Google: mixed academic + blog + Wikipedia</text>
  <text x="350" y="275" font-size="10" text-anchor="middle" fill="#8A8577">Data from RawPickAI testing - rawpickai.com</text>
</svg>
