<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="240" rx="12" fill="#F4F1EA"/>
  <text x="350" y="35" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#4A5942" text-anchor="middle">Lovable + Supabase Integration</text>

  <!-- Auth Card -->
  <rect x="30" y="60" width="200" height="150" rx="10" fill="white" stroke="#DDD8CE" stroke-width="1.5"/>
  <rect x="30" y="60" width="200" height="40" rx="10" fill="#6B7C5E"/>
  <rect x="30" y="85" width="200" height="15" fill="#6B7C5E"/>
  <text x="130" y="86" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F4F1EA" text-anchor="middle">Authentication</text>
  <text x="130" y="125" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3A3228" text-anchor="middle">Email + OAuth login</text>
  <text x="130" y="145" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3A3228" text-anchor="middle">Auto-generated RLS</text>
  <text x="130" y="165" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3A3228" text-anchor="middle">Session management</text>
  <text x="130" y="190" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7C5E" text-anchor="middle">Zero config needed</text>

  <!-- Database Card -->
  <rect x="250" y="60" width="200" height="150" rx="10" fill="white" stroke="#DDD8CE" stroke-width="1.5"/>
  <rect x="250" y="60" width="200" height="40" rx="10" fill="#96845A"/>
  <rect x="250" y="85" width="200" height="15" fill="#96845A"/>
  <text x="350" y="86" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F4F1EA" text-anchor="middle">Database</text>
  <text x="350" y="125" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3A3228" text-anchor="middle">PostgreSQL tables</text>
  <text x="350" y="145" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3A3228" text-anchor="middle">Auto schema creation</text>
  <text x="350" y="165" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3A3228" text-anchor="middle">Migration files</text>
  <text x="350" y="190" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#96845A" text-anchor="middle">Prompt-driven CRUD</text>

  <!-- Storage Card -->
  <rect x="470" y="60" width="200" height="150" rx="10" fill="white" stroke="#DDD8CE" stroke-width="1.5"/>
  <rect x="470" y="60" width="200" height="40" rx="10" fill="#6B7C5E"/>
  <rect x="470" y="85" width="200" height="15" fill="#6B7C5E"/>
  <text x="570" y="86" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F4F1EA" text-anchor="middle">Storage</text>
  <text x="570" y="125" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3A3228" text-anchor="middle">File uploads</text>
  <text x="570" y="145" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3A3228" text-anchor="middle">Image hosting</text>
  <text x="570" y="165" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3A3228" text-anchor="middle">Bucket policies</text>
  <text x="570" y="190" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7C5E" text-anchor="middle">Needs manual review</text>

  <text x="350" y="232" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8A8577" text-anchor="middle">Supabase free tier included. Paid tier ($25/mo) needed at scale.</text>
</svg>