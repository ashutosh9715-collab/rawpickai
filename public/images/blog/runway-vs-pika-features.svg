<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #4A5942; }
      .label { font-size: 12px; fill: #3A3228; }
      .value { font-size: 11px; fill: #3A3228; }
      .track { fill: #DDD8CE; }
      .bar1 { fill: #6B7C5E; }
      .bar2 { fill: #96845A; }
    </style>
  </defs>

  <rect class="bg" width="900" height="450"/>

  <text class="header" x="40" y="35">AI Video Generation Comparison</text>

  <g>
    <text class="label" x="40" y="70" font-weight="600">Video Quality</text>
    <rect class="track" x="40" y="78" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="78" width="180" height="7" rx="3"/>
    <text class="value" x="250" y="87">Runway: 9/10</text>

    <rect class="track" x="40" y="92" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="92" width="140" height="7" rx="3"/>
    <text class="value" x="250" y="101">Pika: 7/10</text>
  </g>

  <g>
    <text class="label" x="40" y="135" font-weight="600">Motion Consistency</text>
    <rect class="track" x="40" y="143" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="143" width="200" height="7" rx="3"/>
    <text class="value" x="250" y="152">Runway: 10/10</text>

    <rect class="track" x="40" y="157" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="157" width="120" height="7" rx="3"/>
    <text class="value" x="250" y="166">Pika: 6/10</text>
  </g>

  <g>
    <text class="label" x="40" y="200" font-weight="600">Ease of Use</text>
    <rect class="track" x="40" y="208" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="208" width="140" height="7" rx="3"/>
    <text class="value" x="250" y="217">Runway: 7/10</text>

    <rect class="track" x="40" y="222" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="222" width="180" height="7" rx="3"/>
    <text class="value" x="250" y="231">Pika: 9/10</text>
  </g>

  <g>
    <text class="label" x="40" y="265" font-weight="600">Commercial Rights</text>
    <rect class="track" x="40" y="273" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="273" width="200" height="7" rx="3"/>
    <text class="value" x="250" y="282">Runway: From $15/mo</text>

    <rect class="track" x="40" y="287" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="287" width="80" height="7" rx="3"/>
    <text class="value" x="250" y="296">Pika: Only $35/mo</text>
  </g>

  <g>
    <text class="label" x="40" y="330" font-weight="600">Image-to-Video</text>
    <text class="value" x="40" y="350">Runway: Strong feature (product demos, transformations)</text>
    <text class="value" x="40" y="368">Pika: Limited capability</text>
  </g>

  <g>
    <text class="label" x="40" y="400" font-weight="600">Best For</text>
    <text class="value" x="40" y="420">Runway: Professional/client work | Pika: Social media on budget</text>
  </g>
</svg>