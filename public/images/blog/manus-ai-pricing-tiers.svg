  <text x="691" y="194" fill="#c4c7d4" font-size="11" text-anchor="middle">Shared credit pool</text>
  <text x="691" y="214" fill="#c4c7d4" font-size="11" text-anchor="middle">SSO + analytics</text>
  <text x="691" y="234" fill="#c4c7d4" font-size="11" text-anchor="middle">All Pro features</text>
