<svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 600; fill: #4A5942; }
      .col-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #3A3228; }
      .row-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #3A3228; }
      .cell-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #3A3228; }
      .price-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #6B7C5E; }
      .winner { fill: #6B7C5E; font-weight: 700; }
      .header-bg { fill: #DDD8CE; }
      .row-separator { stroke: #DDD8CE; stroke-width: 1; }
      .cell-border { stroke: #DDD8CE; stroke-width: 1; }
      .muted { fill: #8A8577; }
    </style>
  </defs>

  <rect class="bg" width="900" height="550" rx="12"/>

  <!-- Header -->
  <text class="heading" x="40" y="45">Windsurf vs. Cursor vs. GitHub Copilot</text>
  <text class="muted" x="40" y="65" font-size="12">Direct comparison across pricing, features, and output quality</text>

  <!-- Table Header Row -->
  <rect class="header-bg" x="40" y="85" width="820" height="35" rx="4"/>

  <text class="col-header" x="55" y="110">Feature</text>
  <line class="cell-border" x1="220" y1="85" x2="220" y2="120"/>
  <text class="col-header" x="235" y="110">Windsurf</text>
  <line class="cell-border" x1="420" y1="85" x2="420" y2="120"/>
  <text class="col-header" x="435" y="110">Cursor</text>
  <line class="cell-border" x1="620" y1="85" x2="620" y2="120"/>
  <text class="col-header" x="635" y="110">GitHub Copilot</text>

  <!-- Free Tier -->
  <rect class="row-separator" x="40" y="120" width="820" height="0.5"/>
  <text class="row-label" x="55" y="150">Free Tier</text>
  <rect class="cell-border" x="220" y="125" width="0.5" height="40"/>
  <text class="cell-text" x="235" y="150">Unlimited auto-complete</text>
  <rect class="cell-border" x="420" y="125" width="0.5" height="40"/>
  <text class="cell-text" x="435" y="150">2-week trial</text>
  <rect class="cell-border" x="620" y="125" width="0.5" height="40"/>
  <text class="cell-text" x="635" y="150">None (₹930+)</text>

  <!-- Monthly Cost -->
  <rect class="row-separator" x="40" y="165" width="820" height="0.5"/>
  <text class="row-label" x="55" y="195">Monthly Cost</text>
  <rect class="cell-border" x="220" y="170" width="0.5" height="40"/>
  <text class="price-text" x="235" y="195">₹1,395 ($15)</text>
  <rect class="cell-border" x="420" y="170" width="0.5" height="40"/>
  <text class="price-text" x="435" y="195">₹1,860 ($20)</text>
  <rect class="cell-border" x="620" y="170" width="0.5" height="40"/>
  <text class="price-text" x="635" y="195">₹930 ($10)</text>

  <!-- Code Completion Quality -->
  <rect class="row-separator" x="40" y="210" width="820" height="0.5"/>
  <text class="row-label" x="55" y="240">Completion Quality</text>
  <rect class="cell-border" x="220" y="215" width="0.5" height="40"/>
  <text class="cell-text" x="235" y="240">Very good (72)</text>
  <rect class="cell-border" x="420" y="215" width="0.5" height="40"/>
  <text class="cell-text winner" x="435" y="240">Excellent (88)</text>
  <rect class="cell-border" x="620" y="215" width="0.5" height="40"/>
  <text class="cell-text" x="635" y="240">Good (78)</text>

  <!-- Multi-File Context -->
  <rect class="row-separator" x="40" y="255" width="820" height="0.5"/>
  <text class="row-label" x="55" y="285">Multi-File Context</text>
  <rect class="cell-border" x="220" y="260" width="0.5" height="40"/>
  <text class="cell-text" x="235" y="285">Good</text>
  <rect class="cell-border" x="420" y="260" width="0.5" height="40"/>
  <text class="cell-text winner" x="435" y="285">Excellent</text>
  <rect class="cell-border" x="620" y="260" width="0.5" height="40"/>
  <text class="cell-text" x="635" y="285">Good</text>

  <!-- IDE Integration -->
  <rect class="row-separator" x="40" y="300" width="820" height="0.5"/>
  <text class="row-label" x="55" y="330">IDE Integration</text>
  <rect class="cell-border" x="220" y="305" width="0.5" height="40"/>
  <text class="cell-text" x="235" y="330">VS Code (fork)</text>
  <rect class="cell-border" x="420" y="305" width="0.5" height="40"/>
  <text class="cell-text winner" x="435" y="330">Native IDE</text>
  <rect class="cell-border" x="620" y="305" width="0.5" height="40"/>
  <text class="cell-text" x="635" y="330">Plugin-based</text>

  <!-- Agent Mode -->
  <rect class="row-separator" x="40" y="345" width="820" height="0.5"/>
  <text class="row-label" x="55" y="375">Agent Mode</text>
  <rect class="cell-border" x="220" y="350" width="0.5" height="40"/>
  <text class="cell-text" x="235" y="375">Cascade (Pro)</text>
  <rect class="cell-border" x="420" y="350" width="0.5" height="40"/>
  <text class="cell-text winner" x="435" y="375">Composer (native)</text>
  <rect class="cell-border" x="620" y="350" width="0.5" height="40"/>
  <text class="cell-text" x="635" y="375">Limited</text>

  <!-- Enterprise Support -->
  <rect class="row-separator" x="40" y="390" width="820" height="0.5"/>
  <text class="row-label" x="55" y="420">Enterprise Support</text>
  <rect class="cell-border" x="220" y="395" width="0.5" height="40"/>
  <text class="cell-text" x="235" y="420">Yes (Team plan)</text>
  <rect class="cell-border" x="420" y="395" width="0.5" height="40"/>
  <text class="cell-text winner" x="435" y="420">Yes (dedicated)</text>
  <rect class="cell-border" x="620" y="395" width="0.5" height="40"/>
  <text class="cell-text" x="635" y="420">Yes (Enterprise)</text>

  <!-- Best For -->
  <rect class="row-separator" x="40" y="435" width="820" height="0.5"/>
  <text class="row-label" x="55" y="480">Best For</text>
  <rect class="cell-border" x="220" y="440" width="0.5" height="65"/>
  <text class="cell-text" x="235" y="460">Free users,</text>
  <text class="cell-text" x="235" y="480">budget-conscious</text>
  <text class="cell-text" x="235" y="500">developers</text>
  <rect class="cell-border" x="420" y="440" width="0.5" height="65"/>
  <text class="cell-text winner" x="435" y="460">Professional</text>
  <text class="cell-text winner" x="435" y="480">developers,</text>
  <text class="cell-text winner" x="435" y="500">daily use</text>
  <rect class="cell-border" x="620" y="440" width="0.5" height="65"/>
  <text class="cell-text" x="635" y="460">Enterprise,</text>
  <text class="cell-text" x="635" y="480">GitHub ecosystem</text>
  <text class="cell-text" x="635" y="500">users</text>

  <!-- Footer -->
  <text class="muted" x="40" y="535" font-size="11">Data current as of May 2026  -  Pricing converted at ₹93/USD</text>
</svg>
