<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 600; fill: #4A5942; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #3A3228; }
      .score-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #4A5942; }
      .overall-score { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 60px; font-weight: 700; fill: #4A5942; }
      .overall-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; fill: #8A8577; }
      .bar-bg { fill: #DDD8CE; }
      .bar-fill-primary { fill: #6B7C5E; }
      .bar-fill-secondary { fill: #96845A; }
      .muted { fill: #8A8577; }
    </style>
  </defs>

  <rect class="bg" width="800" height="450" rx="12"/>

  <!-- Header -->
  <text class="heading" x="40" y="45">Tabnine Review Scores</text>
  <text class="muted" x="40" y="65" font-size="12">Our rating across 5 categories  -  Overall: 3.2/5</text>

  <!-- Overall Score Circle -->
  <circle cx="700" cy="80" r="50" fill="none" stroke="#DDD8CE" stroke-width="8"/>
  <circle cx="700" cy="80" r="50" fill="none" stroke="#96845A" stroke-width="8" stroke-dasharray="179 314" stroke-linecap="round" transform="rotate(-90 700 80)"/>
  <text class="overall-score" x="700" y="95" text-anchor="middle">3.2</text>
  <text class="overall-label" x="700" y="145" text-anchor="middle">out of 5</text>

  <!-- Ease of Use -->
  <text class="label" x="40" y="120">Ease of Use</text>
  <rect class="bar-bg" x="40" y="130" width="250" height="20" rx="8"/>
  <rect class="bar-fill-primary" x="40" y="130" width="175" height="20" rx="8"/>
  <text class="score-text" x="305" y="145">70</text>

  <!-- Value for Money -->
  <text class="label" x="40" y="175">Value for Money</text>
  <rect class="bar-bg" x="40" y="185" width="250" height="20" rx="8"/>
  <rect class="bar-fill-secondary" x="40" y="185" width="125" height="20" rx="8"/>
  <text class="score-text" x="305" y="200">50</text>

  <!-- Output Quality -->
  <text class="label" x="40" y="230">Output Quality</text>
  <rect class="bar-bg" x="40" y="240" width="250" height="20" rx="8"/>
  <rect class="bar-fill-secondary" x="40" y="240" width="150" height="20" rx="8"/>
  <text class="score-text" x="305" y="255">60</text>

  <!-- Feature Depth -->
  <text class="label" x="40" y="285">Feature Depth</text>
  <rect class="bar-bg" x="40" y="295" width="250" height="20" rx="8"/>
  <rect class="bar-fill-secondary" x="40" y="295" width="150" height="20" rx="8"/>
  <text class="score-text" x="305" y="310">60</text>

  <!-- Free Tier -->
  <text class="label" x="40" y="340">Free Tier</text>
  <rect class="bar-bg" x="40" y="350" width="250" height="20" rx="8"/>
  <rect class="bar-fill-secondary" x="40" y="350" width="50" height="20" rx="8"/>
  <text class="score-text" x="305" y="365">20</text>

  <!-- Footer -->
  <text class="muted" x="40" y="415" font-size="11">Tested 2 months on free trial + Dev tier  -  rawpickai.com</text>
</svg>
