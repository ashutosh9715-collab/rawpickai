  <text x="145" y="238" fill="#96845A" font-size="10" text-anchor="middle">Least code visibility</text>

  <!-- v0 -->
  <rect x="285" y="60" width="230" height="220" rx="10" fill="#EEEAE2" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="285" y="60" width="230" height="36" rx="10" fill="#6B7C5E"/>
  <rect x="285" y="86" width="230" height="10" fill="#6B7C5E"/>
