<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <rect width="900" height="160" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">OpenAI Model Autonomously Disproves 80-Year Geometry Conjecture</text>
  <rect x="60" y="55" width="250" height="80" rx="10" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="185" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#4A5942">What happened</text>
  <text x="185" y="100" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Internal model received problem,</text>
  <text x="185" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">produced proof independently</text>
  <rect x="340" y="55" width="250" height="80" rx="10" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="465" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#96845A">Why it matters</text>
  <text x="465" y="100" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">First AI to solve a prominent</text>
  <text x="465" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">open math problem autonomously</text>
  <rect x="620" y="55" width="250" height="80" rx="10" fill="white" stroke="#6B7C5E" stroke-width="1.5"/>
  <text x="745" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#6B7C5E">Validation</text>
  <text x="745" y="100" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Fields medalist Tim Gowers:</text>
  <text x="745" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A5942">"a milestone in AI mathematics"</text>
  <text x="450" y="152" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Not trained for this problem. No human guidance. No retrieval of existing solution. Source: BuildFastWithAI, May 23</text>
</svg>
