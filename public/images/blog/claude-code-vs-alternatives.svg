<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="400" rx="12" fill="#F4F1EA"/>

  <text x="400" y="36" fill="#1A2416" font-size="18" font-weight="700" text-anchor="middle">Claude Code vs Cursor 3 vs GitHub Copilot</text>
  <text x="400" y="56" fill="#8b8fa3" font-size="13" text-anchor="middle">Quick comparison for choosing the right tool  -  April 2026</text>

  <!-- Column headers -->
  <rect x="250" y="72" width="160" height="30" rx="6" fill="#1a2a1f"/>
  <text x="330" y="92" fill="#3a8c5e" font-size="12" font-weight="700" text-anchor="middle">Claude Code</text>
  <rect x="420" y="72" width="160" height="30" rx="6" fill="#2d2316"/>
  <text x="500" y="92" fill="#c97b3a" font-size="12" font-weight="700" text-anchor="middle">Cursor 3</text>
  <rect x="590" y="72" width="160" height="30" rx="6" fill="#1a1d2a"/>
  <text x="670" y="92" fill="#8b8fa3" font-size="12" font-weight="700" text-anchor="middle">GitHub Copilot</text>

  <!-- Row 1: Interface -->
  <text x="40" y="128" fill="#c4c7d4" font-size="12" font-weight="600">Interface</text>
  <text x="330" y="128" fill="#c4c7d4" font-size="11" text-anchor="middle">Terminal CLI</text>
  <text x="500" y="128" fill="#c4c7d4" font-size="11" text-anchor="middle">Visual IDE</text>
  <text x="670" y="128" fill="#c4c7d4" font-size="11" text-anchor="middle">IDE Plugin</text>
  <line x1="40" y1="142" x2="760" y2="142" stroke="#1a1d2a" stroke-width="1"/>

  <!-- Row 2: Best for -->
  <text x="40" y="164" fill="#c4c7d4" font-size="12" font-weight="600">Best for</text>
  <text x="330" y="158" fill="#c4c7d4" font-size="10" text-anchor="middle">Refactoring,</text>
  <text x="330" y="172" fill="#c4c7d4" font-size="10" text-anchor="middle">migrations, arch</text>
  <text x="500" y="158" fill="#c4c7d4" font-size="10" text-anchor="middle">Daily coding,</text>
  <text x="500" y="172" fill="#c4c7d4" font-size="10" text-anchor="middle">parallel agents</text>
  <text x="670" y="158" fill="#c4c7d4" font-size="10" text-anchor="middle">Inline completions,</text>
  <text x="670" y="172" fill="#c4c7d4" font-size="10" text-anchor="middle">quick edits</text>
  <line x1="40" y1="186" x2="760" y2="186" stroke="#1a1d2a" stroke-width="1"/>

  <!-- Row 3: Output Quality -->
  <text x="40" y="208" fill="#c4c7d4" font-size="12" font-weight="600">Code quality</text>
  <rect x="290" y="198" width="80" height="18" rx="4" fill="#1a3328"/>
  <text x="330" y="212" fill="#3a8c5e" font-size="11" font-weight="700" text-anchor="middle">Excellent</text>
  <rect x="460" y="198" width="80" height="18" rx="4" fill="#2d2316"/>
  <text x="500" y="212" fill="#c97b3a" font-size="11" font-weight="600" text-anchor="middle">Very Good</text>
  <rect x="638" y="198" width="64" height="18" rx="4" fill="#1a1d2a"/>
  <text x="670" y="212" fill="#8b8fa3" font-size="11" text-anchor="middle">Good</text>
  <line x1="40" y1="226" x2="760" y2="226" stroke="#1a1d2a" stroke-width="1"/>

  <!-- Row 4: Monthly cost -->
  <text x="40" y="248" fill="#c4c7d4" font-size="12" font-weight="600">Realistic cost</text>
  <text x="330" y="242" fill="#8c3a3a" font-size="13" font-weight="700" text-anchor="middle">$100/mo</text>
  <text x="330" y="258" fill="#5a5e72" font-size="10" text-anchor="middle">≈₹9,300</text>
  <text x="500" y="242" fill="#3a8c5e" font-size="13" font-weight="700" text-anchor="middle">$20/mo</text>
  <text x="500" y="258" fill="#5a5e72" font-size="10" text-anchor="middle">≈₹1,860</text>
  <text x="670" y="242" fill="#3a8c5e" font-size="13" font-weight="700" text-anchor="middle">$10/mo</text>
  <text x="670" y="258" fill="#5a5e72" font-size="10" text-anchor="middle">≈₹930</text>
  <line x1="40" y1="272" x2="760" y2="272" stroke="#1a1d2a" stroke-width="1"/>

  <!-- Row 5: Learning curve -->
  <text x="40" y="294" fill="#c4c7d4" font-size="12" font-weight="600">Learning curve</text>
  <text x="330" y="294" fill="#b07a3a" font-size="11" text-anchor="middle">Medium-High</text>
  <text x="500" y="294" fill="#3a8c5e" font-size="11" text-anchor="middle">Low</text>
  <text x="670" y="294" fill="#3a8c5e" font-size="11" text-anchor="middle">Very Low</text>
  <line x1="40" y1="308" x2="760" y2="308" stroke="#1a1d2a" stroke-width="1"/>

  <!-- Row 6: Free tier -->
  <text x="40" y="330" fill="#c4c7d4" font-size="12" font-weight="600">Free tier</text>
  <text x="330" y="330" fill="#8c3a3a" font-size="11" text-anchor="middle">Very limited</text>
  <text x="500" y="330" fill="#b07a3a" font-size="11" text-anchor="middle">Limited</text>
  <text x="670" y="330" fill="#3a8c5e" font-size="11" text-anchor="middle">Generous</text>

  <!-- Bottom verdict -->
  <rect x="40" y="354" width="720" height="34" rx="8" fill="#1a1d2a"/>
  <text x="400" y="376" fill="#8b8fa3" font-size="11" text-anchor="middle">Best overall depends on your workflow: Claude Code for architecture, Cursor for daily coding, Copilot for inline completions</text>
</svg>
