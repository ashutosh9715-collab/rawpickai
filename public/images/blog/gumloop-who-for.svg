<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="1200" height="213">
  <rect width="900" height="160" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Gumloop: Right Fit vs Wrong Fit</text>
  <rect x="40" y="55" width="400" height="85" rx="10" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="240" y="82" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4A5942">Perfect for</text>
  <text x="240" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">AI-heavy workflows, ops teams, marketers</text>
  <text x="240" y="125" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">who want multi-model flexibility without coding</text>
  <rect x="460" y="55" width="400" height="85" rx="10" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="660" y="82" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#c0392b">Look elsewhere if</text>
  <text x="660" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">You need 8,500+ app integrations</text>
  <text x="660" y="125" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">or mainly non-AI automation - use Zapier</text>
  <text x="450" y="152" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Gumloop excels where AI is the core of the workflow. Traditional app-to-app automation is Zapier's territory.</text>
</svg>
