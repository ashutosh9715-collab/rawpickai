<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="1200" height="227">
  <rect width="900" height="170" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Gumloop Best Use Cases</text>
  <rect x="40" y="55" width="190" height="90" rx="8" fill="white" stroke="#4A5942" stroke-width="1.5"/>
