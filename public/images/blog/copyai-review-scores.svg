<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="40" y="50" font-size="32" font-weight="bold" fill="#4A5942" font-family="system-ui">
    Copy.ai Review Scores
  </text>

  <!-- Score items -->
  <!-- Ease of Use -->
  <text x="40" y="130" font-size="16" font-weight="600" fill="#3A3228" font-family="system-ui">
    Ease of Use
  </text>
  <rect x="280" y="115" width="300" height="28" rx="12" fill="#DDD8CE"/>
  <rect x="280" y="115" width="210" height="28" rx="12" fill="#6B7C5E"/>
  <text x="590" y="135" font-size="16" font-weight="bold" fill="#3A3228" font-family="system-ui">70/100</text>

  <!-- Output Quality -->
  <text x="40" y="195" font-size="16" font-weight="600" fill="#3A3228" font-family="system-ui">
