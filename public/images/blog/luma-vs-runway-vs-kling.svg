<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #F4F1EA; }
      .heading { fill: #4A5942; font-size: 20px; font-weight: bold; }
      .row-header { fill: #3A3228; font-size: 13px; font-weight: bold; }
      .cell-text { fill: #3A3228; font-size: 12px; }
      .divider { stroke: #DDD8CE; stroke-width: 1; }
      .col-bg { fill: #FFFFFF; }
      .luma { fill: #6B7C5E; }
      .runway { fill: #96845A; }
      .kling { fill: #8A8577; }
      .muted { fill: #8A8577; font-size: 11px; }
    </style>
  </defs>

  <rect class="bg" width="900" height="450" rx="12"/>

  <!-- Title -->
  <text x="40" y="40" class="heading">Luma Dream Machine vs Runway vs Kling: Spatial Video Comparison</text>

  <!-- Table header -->
  <rect x="30" y="60" width="200" height="40" rx="6" class="col-bg"/>
  <text x="50" y="90" class="row-header">Feature</text>

  <rect x="240" y="60" width="220" height="40" rx="6" class="luma" opacity="0.3"/>
  <text x="280" y="90" class="row-header">Luma Dream</text>

  <rect x="480" y="60" width="220" height="40" rx="6" class="runway" opacity="0.3"/>
  <text x="530" y="90" class="row-header">Runway ML</text>

  <rect x="720" y="60" width="150" height="40" rx="6" class="kling" opacity="0.3"/>
  <text x="760" y="90" class="row-header">Kling AI</text>

  <!-- Rows -->
  <!-- Spatial Video -->
  <rect x="30" y="110" width="200" height="35" class="col-bg"/>
  <text x="50" y="135" class="cell-text">3D Spatial Rendering</text>
  <rect x="240" y="110" width="220" height="35" class="col-bg"/>
  <text x="260" y="135" class="cell-text">Native 3D (unique)</text>
  <rect x="480" y="110" width="220" height="35" class="col-bg"/>
  <text x="500" y="135" class="cell-text">Flat video + illusion</text>
  <rect x="720" y="110" width="150" height="35" class="col-bg"/>
  <text x="740" y="135" class="cell-text">Flat motion focus</text>

  <!-- Monthly Cost (Standard) -->
  <rect x="30" y="150" width="200" height="35" class="col-bg"/>
  <text x="50" y="175" class="cell-text">Standard Tier</text>
  <rect x="240" y="150" width="220" height="35" class="col-bg"/>
  <text x="260" y="175" class="cell-text">₹2,790/month</text>
  <rect x="480" y="150" width="220" height="35" class="col-bg"/>
  <text x="500" y="175" class="cell-text">₹2,600/month</text>
  <rect x="720" y="150" width="150" height="35" class="col-bg"/>
  <text x="740" y="175" class="cell-text">₹1,850/month</text>

  <!-- Keeper Rate -->
  <rect x="30" y="190" width="200" height="35" class="col-bg"/>
  <text x="50" y="215" class="cell-text">Keeper Rate</text>
  <rect x="240" y="190" width="220" height="35" class="col-bg"/>
  <text x="260" y="215" class="cell-text">43% (needs 2-3 gen)</text>
  <rect x="480" y="190" width="220" height="35" class="col-bg"/>
  <text x="500" y="215" class="cell-text">85%+ consistent</text>
  <rect x="720" y="190" width="150" height="35" class="col-bg"/>
  <text x="740" y="215" class="cell-text">70% at 5-15 sec</text>

  <!-- Best Use Case -->
  <rect x="30" y="230" width="200" height="35" class="col-bg"/>
  <text x="50" y="255" class="cell-text">Primary Use</text>
  <rect x="240" y="230" width="220" height="35" class="col-bg"/>
  <text x="260" y="255" class="cell-text">3D/metaverse</text>
  <rect x="480" y="230" width="220" height="35" class="col-bg"/>
  <text x="500" y="255" class="cell-text">Professional video</text>
  <rect x="720" y="230" width="150" height="35" class="col-bg"/>
  <text x="740" y="255" class="cell-text">Long duration</text>

  <!-- Consistency -->
  <rect x="30" y="270" width="200" height="35" class="col-bg"/>
  <text x="50" y="295" class="cell-text">Quality Consistency</text>
  <rect x="240" y="270" width="220" height="35" class="col-bg"/>
  <text x="260" y="295" class="cell-text">Variable (weakness)</text>
  <rect x="480" y="270" width="220" height="35" class="col-bg"/>
  <text x="500" y="295" class="cell-text">Excellent</text>
  <rect x="720" y="270" width="150" height="35" class="col-bg"/>
  <text x="740" y="295" class="cell-text">Good</text>

  <!-- Overall Score -->
  <rect x="30" y="310" width="200" height="35" class="col-bg"/>
  <text x="50" y="335" class="cell-text">Rating</text>
  <rect x="240" y="310" width="220" height="35" class="col-bg"/>
  <text x="260" y="335" class="cell-text">3.4/5</text>
  <rect x="480" y="310" width="220" height="35" class="col-bg"/>
  <text x="500" y="335" class="cell-text">4.2/5</text>
  <rect x="720" y="310" width="150" height="35" class="col-bg"/>
  <text x="740" y="335" class="cell-text">3.5/5</text>

  <!-- Free Tier -->
  <rect x="30" y="350" width="200" height="35" class="col-bg"/>
  <text x="50" y="375" class="cell-text">Free Tier</text>
  <rect x="240" y="350" width="220" height="35" class="col-bg"/>
  <text x="260" y="375" class="cell-text">30 gen/month</text>
  <rect x="480" y="350" width="220" height="35" class="col-bg"/>
  <text x="500" y="375" class="cell-text">Limited access</text>
  <rect x="720" y="350" width="150" height="35" class="col-bg"/>
  <text x="740" y="375" class="cell-text">30 sec max</text>

  <!-- Footer -->
  <text x="40" y="430" class="muted">Luma offers unique spatial video but inconsistency hurts production workflows. Runway superior for consistency and control.</text>
</svg>