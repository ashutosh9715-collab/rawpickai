<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="1200" height="240">
  <rect width="900" height="180" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#22c55e" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Gumloop Credit System: Only AI Calls Cost Credits</text>
  <rect x="40" y="55" width="400" height="100" rx="10" fill="white" stroke="#22c55e" stroke-width="2"/>
  <text x="240" y="82" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#22c55e">FREE (no credits)</text>
  <text x="240" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Routing, logic, conditionals</text>
  <text x="240" y="123" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Formatting, data transformation</text>
  <text x="240" y="141" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">45-step workflow with 4 AI calls = same cost as 5-step with 4 AI calls</text>
  <rect x="460" y="55" width="400" height="100" rx="10" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="660" y="82" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#96845A">COSTS CREDITS</text>
  <text x="660" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">LLM calls (Ask AI, Extract Data)</text>
  <text x="660" y="123" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Web scraping, image analysis</text>
  <text x="660" y="141" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Cost scales with model used and tokens generated</text>
  <text x="450" y="172" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">This makes Gumloop significantly cheaper than Zapier for complex AI workflows with many logic steps.</text>
</svg>
