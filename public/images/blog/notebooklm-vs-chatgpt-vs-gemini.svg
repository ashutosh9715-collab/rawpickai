<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="460" rx="12" fill="#F4F1EA"/>

  <text x="400" y="36" fill="#1A2416" font-size="18" font-weight="700" text-anchor="middle">NotebookLM vs ChatGPT vs Gemini</text>
  <text x="400" y="56" fill="#8b8fa3" font-size="13" text-anchor="middle">Different tools, different jobs  -  April 2026</text>

  <!-- Column headers -->
  <rect x="40" y="78" width="240" height="38" rx="8" fill="#1a3328" stroke="#3a8c5e" stroke-width="2"/>
  <text x="160" y="103" fill="#3a8c5e" font-size="14" font-weight="700" text-anchor="middle">NotebookLM</text>

  <rect x="290" y="78" width="220" height="38" rx="8" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="400" y="103" fill="#c4c7d4" font-size="14" font-weight="700" text-anchor="middle">ChatGPT</text>

  <rect x="520" y="78" width="240" height="38" rx="8" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="640" y="103" fill="#c4c7d4" font-size="14" font-weight="700" text-anchor="middle">Gemini 3.1 Pro</text>

  <!-- Row: Data source -->
  <text x="40" y="148" fill="#5a5e72" font-size="10" font-weight="600">DATA SOURCE</text>
  <text x="160" y="170" fill="#1A2416" font-size="11" text-anchor="middle">Only your uploads</text>
  <text x="400" y="170" fill="#c4c7d4" font-size="11" text-anchor="middle">Training data + web</text>
  <text x="640" y="170" fill="#c4c7d4" font-size="11" text-anchor="middle">Training data + web</text>
  <line x1="40" y1="184" x2="760" y2="184" stroke="#1a1d2a" stroke-width="1"/>

  <!-- Row: Citations -->
  <text x="40" y="206" fill="#5a5e72" font-size="10" font-weight="600">CITATIONS</text>
  <text x="160" y="228" fill="#3a8c5e" font-size="11" font-weight="600" text-anchor="middle">Yes  -  to your passages</text>
  <text x="400" y="228" fill="#8b8fa3" font-size="11" text-anchor="middle">No source citations</text>
  <text x="640" y="228" fill="#8b8fa3" font-size="11" text-anchor="middle">Limited</text>
  <line x1="40" y1="242" x2="760" y2="242" stroke="#1a1d2a" stroke-width="1"/>

  <!-- Row: Hallucination risk -->
  <text x="40" y="264" fill="#5a5e72" font-size="10" font-weight="600">HALLUCINATION RISK</text>
  <text x="160" y="286" fill="#3a8c5e" font-size="11" font-weight="600" text-anchor="middle">2-3% (very low)</text>
  <text x="400" y="286" fill="#c97b3a" font-size="11" text-anchor="middle">8-12% (higher)</text>
  <text x="640" y="286" fill="#b0943a" font-size="11" text-anchor="middle">5-8% (moderate)</text>
  <line x1="40" y1="300" x2="760" y2="300" stroke="#1a1d2a" stroke-width="1"/>

  <!-- Row: Free tier -->
  <text x="40" y="322" fill="#5a5e72" font-size="10" font-weight="600">FREE TIER</text>
  <text x="160" y="344" fill="#3a8c5e" font-size="11" font-weight="600" text-anchor="middle">Excellent (100 notebooks)</text>
  <text x="400" y="344" fill="#c4c7d4" font-size="11" text-anchor="middle">Limited</text>
  <text x="640" y="344" fill="#c4c7d4" font-size="11" text-anchor="middle">Good (Flash model)</text>
  <line x1="40" y1="358" x2="760" y2="358" stroke="#1a1d2a" stroke-width="1"/>

  <!-- Row: Best for -->
  <text x="40" y="380" fill="#5a5e72" font-size="10" font-weight="600">BEST FOR</text>
  <text x="160" y="402" fill="#1A2416" font-size="10" text-anchor="middle">Research, studying,</text>
  <text x="160" y="416" fill="#1A2416" font-size="10" text-anchor="middle">document analysis</text>
  <text x="400" y="402" fill="#c4c7d4" font-size="10" text-anchor="middle">Open chat, writing,</text>
  <text x="400" y="416" fill="#c4c7d4" font-size="10" text-anchor="middle">brainstorming</text>
  <text x="640" y="402" fill="#c4c7d4" font-size="10" text-anchor="middle">Complex reasoning,</text>
  <text x="640" y="416" fill="#c4c7d4" font-size="10" text-anchor="middle">long documents, coding</text>

  <!-- Footer -->
  <text x="400" y="448" fill="#5a5e72" font-size="11" text-anchor="middle">NotebookLM is a specialist; ChatGPT and Gemini are generalists.  -  rawpickai.com</text>
</svg>
