  <line x1="60" y1="218" x2="300" y2="218" stroke="#4A5942" stroke-width="3"/>
  <text x="60" y="265" font-family="Georgia, serif" font-size="19" fill="#4A453E">20% workforce cut despite best quarter in 16-year history.</text>
  <text x="60" y="295" font-family="Georgia, serif" font-size="19" fill="#4A453E">Gemini baked into Android, Chrome, Wear OS, and new laptops.</text>
  <text x="60" y="325" font-family="Georgia, serif" font-size="19" fill="#4A453E">US-China tariff truce cuts AI chip costs for 90 days.</text>
  <rect x="700" y="100" width="420" height="380" rx="16" fill="#4A5942" opacity="0.08"/>
  <text x="910" y="160" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#96845A">THE AI JOBS PARADOX</text>
  <text x="910" y="210" font-family="Georgia, serif" font-size="48" font-weight="700" text-anchor="middle" fill="#4A5942">$640M</text>
