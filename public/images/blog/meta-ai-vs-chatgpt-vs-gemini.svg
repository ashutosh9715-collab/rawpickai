<svg viewBox="0 0 850 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #F4F1EA; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 600; fill: #4A5942; }
      .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #3A3228; }
      .cell { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #3A3228; }
      .bar-bg { fill: #DDD8CE; }
      .bar1 { fill: #6B7C5E; }
      .bar2 { fill: #96845A; }
      .bar3 { fill: #8A8577; }
      .row-odd { fill: #FEFDFB; }
      .row-even { fill: #F8F5F0; }
    </style>
  </defs>

  <rect class="bg" width="850" height="480" rx="12" />
  <text x="40" y="40" class="title">Meta AI vs ChatGPT vs Google Gemini</text>

  <!-- Table Header -->
  <rect x="40" y="65" width="770" height="35" fill="#EDE9DF" rx="0" />
  <text x="55" y="90" class="header">Feature</text>
  <text x="240" y="90" class="header" text-anchor="middle">Meta AI</text>
  <text x="480" y="90" class="header" text-anchor="middle">ChatGPT</text>
  <text x="720" y="90" class="header" text-anchor="middle">Google Gemini</text>

  <!-- Row 1: Price -->
  <rect x="40" y="100" width="770" height="45" class="row-odd" />
  <text x="55" y="125" class="header">Price</text>
  <text x="240" y="125" class="cell" text-anchor="middle">Free (₹85 premium)</text>
  <text x="480" y="125" class="cell" text-anchor="middle">Free + ₹500/mo</text>
  <text x="720" y="125" class="cell" text-anchor="middle">Free + ₹1,860/mo</text>

  <!-- Row 2: Access Method -->
  <rect x="40" y="145" width="770" height="45" class="row-even" />
  <text x="55" y="170" class="header">Access</text>
  <text x="240" y="170" class="cell" text-anchor="middle">WhatsApp/Messenger</text>
  <text x="480" y="170" class="cell" text-anchor="middle">Website/App</text>
  <text x="720" y="170" class="cell" text-anchor="middle">Website/Gmail</text>

  <!-- Row 3: Output Quality -->
  <rect x="40" y="190" width="770" height="45" class="row-odd" />
  <text x="55" y="215" class="header">Output Quality</text>
  <text x="240" y="215" class="cell" text-anchor="middle">3.0/5</text>
  <text x="480" y="215" class="cell" text-anchor="middle">4.2/5</text>
  <text x="720" y="215" class="cell" text-anchor="middle">3.8/5</text>

  <!-- Row 4: Code Generation -->
  <rect x="40" y="235" width="770" height="45" class="row-even" />
  <text x="55" y="260" class="header">Code Quality</text>
  <text x="240" y="260" class="cell" text-anchor="middle">Moderate</text>
  <text x="480" y="260" class="cell" text-anchor="middle">Excellent</text>
  <text x="720" y="260" class="cell" text-anchor="middle">Very Good</text>

  <!-- Row 5: Long-Form Writing -->
  <rect x="40" y="280" width="770" height="45" class="row-odd" />
  <text x="55" y="305" class="header">Writing (800+ words)</text>
  <text x="240" y="305" class="cell" text-anchor="middle">Struggles</text>
  <text x="480" y="305" class="cell" text-anchor="middle">Excellent</text>
  <text x="720" y="305" class="cell" text-anchor="middle">Very Good</text>

  <!-- Row 6: Mobile-First -->
  <rect x="40" y="325" width="770" height="45" class="row-even" />
  <text x="55" y="350" class="header">Mobile-First</text>
  <text x="240" y="350" class="cell" text-anchor="middle">Native (WhatsApp)</text>
  <text x="480" y="350" class="cell" text-anchor="middle">App required</text>
  <text x="720" y="350" class="cell" text-anchor="middle">Requires Gmail</text>

  <!-- Row 7: Best For -->
  <rect x="40" y="370" width="770" height="45" class="row-odd" />
  <text x="55" y="395" class="header">Best For</text>
  <text x="240" y="395" class="cell" text-anchor="middle">Casual queries</text>
  <text x="480" y="395" class="cell" text-anchor="middle">Complex work</text>
  <text x="720" y="395" class="cell" text-anchor="middle">Google users</text>

  <!-- Row 8: Reasoning -->
  <rect x="40" y="415" width="770" height="45" class="row-even" />
  <text x="55" y="440" class="header">Reasoning Tasks</text>
  <text x="240" y="440" class="cell" text-anchor="middle">Moderate</text>
  <text x="480" y="440" class="cell" text-anchor="middle">Strong</text>
  <text x="720" y="440" class="cell" text-anchor="middle">Good</text>
</svg>