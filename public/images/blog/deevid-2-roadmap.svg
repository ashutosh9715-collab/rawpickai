<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="1200" height="200">
  <rect width="900" height="150" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">DeeVid AI 2.0: Current vs Coming</text>
  <rect x="40" y="55" width="400" height="75" rx="8" fill="white" stroke="#6B6960" stroke-width="1"/>
  <text x="240" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#6B6960">Current (DeeVid 1.x)</text>
  <text x="240" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Manual tool selection, settings per task</text>
  <text x="240" y="120" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">You choose model, resolution, duration</text>
  <rect x="460" y="55" width="400" height="75" rx="8" fill="white" stroke="#22c55e" stroke-width="2"/>
  <text x="660" y="80" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#22c55e">DeeVid 2.0 (In Progress)</text>
  <text x="660" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Agentic: describe what you want</text>
  <text x="660" y="120" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#4A5942">System orchestrates tools automatically</text>
  <text x="450" y="143" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">The "Create with Agent" button in the current interface is a preview of the DeeVid 2.0 workflow.</text>
</svg>
