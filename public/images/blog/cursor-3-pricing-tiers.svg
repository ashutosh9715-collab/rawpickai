  <text x="254" y="164" fill="#3a8c5e" font-size="12" text-anchor="middle">≈$20 (≈₹1,860)</text>
  <line x1="200" y1="178" x2="308" y2="178" stroke="#2a3d2e" stroke-width="1"/>
  <text x="266" y="198" fill="#c4c7d4" font-size="10" text-anchor="middle">Unlimited completions</text>
  <text x="254" y="216" fill="#c4c7d4" font-size="10" text-anchor="middle">$20 usage credits</text>
  <text x="254" y="234" fill="#c4c7d4" font-size="10" text-anchor="middle">Cloud + local agents</text>
  <text x="254" y="252" fill="#c4c7d4" font-size="10" text-anchor="middle">Frontier models</text>
  <text x="254" y="270" fill="#c4c7d4" font-size="10" text-anchor="middle">Design Mode</text>

  <!-- Pro+ -->
  <rect x="342" y="76" width="142" height="240" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="413" y="104" fill="#8b8fa3" font-size="11" font-weight="600" text-anchor="middle">PRO+</text>
  <text x="413" y="136" fill="#1A2416" font-size="24" font-weight="700" text-anchor="middle">$60/mo</text>
  <text x="413" y="154" fill="#c97b3a" font-size="12" text-anchor="middle">≈$60 (≈₹5,580)</text>
  <line x1="362" y1="168" x2="464" y2="168" stroke="#2a2e3d" stroke-width="1"/>
  <text x="413" y="190" fill="#c4c7d4" font-size="10" text-anchor="middle">Everything in Pro</text>
  <text x="413" transform="rotate(-25,413,208)" y="208" fill="#c4c7d4" font-size="10" text-anchor="middle">3x usage credits ($60)</text>
  <text x="413" y="226" fill="#c4c7d4" font-size="10" text-anchor="middle">Priority queue</text>

  <!-- Ultra -->
  <rect x="498" y="76" width="142" height="240" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="569" y="104" fill="#8b8fa3" font-size="11" font-weight="600" text-anchor="middle">ULTRA</text>
  <text x="569" y="136" fill="#1A2416" font-size="24" font-weight="700" text-anchor="middle">$200/mo</text>
  <text x="569" y="154" fill="#c97b3a" font-size="12" text-anchor="middle">≈$200 (≈₹18,600)</text>
  <line x1="518" y1="168" x2="620" y2="168" stroke="#2a2e3d" stroke-width="1"/>
  <text x="569" y="190" fill="#c4c7d4" font-size="10" text-anchor="middle">Everything in Pro+</text>
  <text x="569" transform="rotate(-25,569,208)" y="208" fill="#c4c7d4" font-size="10" text-anchor="middle">20x Pro usage</text>
  <text x="569" y="226" fill="#c4c7d4" font-size="10" text-anchor="middle">Priority features</text>

  <!-- Teams -->
  <rect x="654" y="76" width="122" height="240" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="715" y="104" fill="#8b8fa3" font-size="11" font-weight="600" text-anchor="middle">TEAMS</text>
  <text x="715" y="132" fill="#1A2416" font-size="20" font-weight="700" text-anchor="middle">$40</text>
  <text x="715" y="148" fill="#8b8fa3" font-size="11" text-anchor="middle">/user/mo</text>
  <text x="715" y="164" fill="#c97b3a" font-size="12" text-anchor="middle">≈$40 (≈₹3,720)</text>
  <line x1="674" y1="178" x2="756" y2="178" stroke="#2a2e3d" stroke-width="1"/>
  <text x="715" y="198" fill="#c4c7d4" font-size="10" text-anchor="middle">Centralized billing</text>
  <text x="715" y="216" fill="#c4c7d4" font-size="10" text-anchor="middle">SSO + admin</text>
  <text x="715" y="234" fill="#c4c7d4" font-size="10" text-anchor="middle">Team controls</text>
