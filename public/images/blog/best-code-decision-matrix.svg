  <text x="350" y="202" font-size="11" font-weight="600" text-anchor="middle" fill="#4A5942">Start with Windsurf (free) to learn, upgrade to Cursor when you need agent mode</text>
  <text x="350" y="240" font-size="10" text-anchor="middle" fill="#8A8577">Data from RawPickAI independent testing - rawpickai.com</text>
