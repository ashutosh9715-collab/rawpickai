<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="420" rx="12" fill="#F4F1EA"/>

  <text x="400" y="32" fill="#4A5942" font-size="17" font-weight="700" text-anchor="middle">How AI Tools Actually Score</text>
  <text x="400" y="52" fill="#8A8577" font-size="12" text-anchor="middle">Distribution of overall scores across 48 tools we tested in 2026</text>

  <!-- Chart area -->
  <rect x="80" y="90" width="640" height="230" fill="#FFFFFF" rx="6" stroke="#DDD8CE" stroke-width="0.5"/>

  <!-- Y-axis gridlines (0, 5, 10, 15, 20, 25 count) -->
  <line x1="80" y1="105" x2="720" y2="105" stroke="#E8E3D6" stroke-dasharray="3,3"/>
  <text x="74" y="109" fill="#8A8577" font-size="10" text-anchor="end">25</text>
  <line x1="80" y1="148" x2="720" y2="148" stroke="#E8E3D6" stroke-dasharray="3,3"/>
  <text x="74" y="152" fill="#8A8577" font-size="10" text-anchor="end">20</text>
  <line x1="80" y1="191" x2="720" y2="191" stroke="#E8E3D6" stroke-dasharray="3,3"/>
  <text x="74" y="195" fill="#8A8577" font-size="10" text-anchor="end">15</text>
  <line x1="80" y1="234" x2="720" y2="234" stroke="#E8E3D6" stroke-dasharray="3,3"/>
  <text x="74" y="238" fill="#8A8577" font-size="10" text-anchor="end">10</text>
  <line x1="80" y1="277" x2="720" y2="277" stroke="#E8E3D6" stroke-dasharray="3,3"/>
  <text x="74" y="281" fill="#8A8577" font-size="10" text-anchor="end">5</text>
  <line x1="80" y1="320" x2="720" y2="320" stroke="#4A5942" stroke-width="1.5"/>
  <text x="74" y="324" fill="#8A8577" font-size="10" text-anchor="end">0</text>

  <!-- Y-axis label -->
  <text x="30" y="205" fill="#4A5942" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(-90, 30, 205)">Number of tools</text>

  <!-- Bars — counts: 4.5+ = 4, 4.0-4.4 = 11, 3.5-3.9 = 20, 3.0-3.4 = 11, <3.0 = 2 -->
  <!-- Each "5 count" = 43px. Base y=320. -->

  <!-- 4.5+ (4 tools) — top tier, sage dark -->
  <rect x="120" y="285" width="90" height="35" fill="#4A5942" rx="3"/>
  <text x="165" y="278" fill="#3A3228" font-size="18" font-weight="800" text-anchor="middle">4</text>
  <text x="165" y="345" fill="#4A5942" font-size="11" font-weight="700" text-anchor="middle">4.5+</text>
  <text x="165" y="362" fill="#8A8577" font-size="10" text-anchor="middle">Excellent</text>

  <!-- 4.0-4.4 (11 tools) — strong, sage mid -->
  <rect x="240" y="225" width="90" height="95" fill="#6B7C5E" rx="3"/>
  <text x="285" y="218" fill="#3A3228" font-size="18" font-weight="800" text-anchor="middle">11</text>
  <text x="285" y="345" fill="#4A5942" font-size="11" font-weight="700" text-anchor="middle">4.0 – 4.4</text>
  <text x="285" y="362" fill="#8A8577" font-size="10" text-anchor="middle">Strong</text>

  <!-- 3.5-3.9 (20 tools) — majority, tan -->
  <rect x="360" y="148" width="90" height="172" fill="#96845A" rx="3"/>
  <text x="405" y="141" fill="#3A3228" font-size="18" font-weight="800" text-anchor="middle">20</text>
  <text x="405" y="345" fill="#4A5942" font-size="11" font-weight="700" text-anchor="middle">3.5 – 3.9</text>
  <text x="405" y="362" fill="#8A8577" font-size="10" text-anchor="middle">Middle of road</text>

  <!-- 3.0-3.4 (11 tools) — weaker, muted -->
  <rect x="480" y="225" width="90" height="95" fill="#B8A982" rx="3"/>
  <text x="525" y="218" fill="#3A3228" font-size="18" font-weight="800" text-anchor="middle">11</text>
  <text x="525" y="345" fill="#4A5942" font-size="11" font-weight="700" text-anchor="middle">3.0 – 3.4</text>
  <text x="525" y="362" fill="#8A8577" font-size="10" text-anchor="middle">Weak</text>

  <!-- Below 3.0 (2 tools) -->
  <rect x="600" y="303" width="90" height="17" fill="#C9A96E" rx="3"/>
  <text x="645" y="296" fill="#3A3228" font-size="18" font-weight="800" text-anchor="middle">2</text>
  <text x="645" y="345" fill="#4A5942" font-size="11" font-weight="700" text-anchor="middle">Below 3.0</text>
  <text x="645" y="362" fill="#8A8577" font-size="10" text-anchor="middle">Avoid</text>

  <!-- Key insight -->
  <rect x="80" y="382" width="640" height="28" rx="6" fill="#4A5942"/>
  <text x="400" y="401" fill="#F4F1EA" font-size="12" font-weight="600" text-anchor="middle">Finding: only 4 of 48 tools scored 4.5+ — NotebookLM, ChatGPT, Cursor, Gemini</text>

  <text x="720" y="378" fill="#8A8577" font-size="10" text-anchor="end">Source: rawpickai.com · 48 tools · April 2026</text>
</svg>
