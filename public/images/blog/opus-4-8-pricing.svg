<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <rect width="900" height="220" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Opus 4.8 vs GPT-5.5: Pricing Head-to-Head</text>
  <rect x="40" y="55" width="820" height="28" rx="6" fill="#4A5942"/>
  <text x="185" y="74" font-family="Georgia, serif" font-size="11" font-weight="600" text-anchor="middle" fill="#F4F1EA">Tier</text>
  <text x="400" y="74" font-family="Georgia, serif" font-size="11" font-weight="600" text-anchor="middle" fill="#F4F1EA">Opus 4.8 (USD)</text>
  <text x="560" y="74" font-family="Georgia, serif" font-size="11" font-weight="600" text-anchor="middle" fill="#F4F1EA">Opus 4.8 (INR)</text>
  <text x="720" y="74" font-family="Georgia, serif" font-size="11" font-weight="600" text-anchor="middle" fill="#F4F1EA">GPT-5.5 equivalent</text>
  <rect x="40" y="87" width="820" height="32" fill="white" rx="3"/>
  <text x="185" y="109" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Consumer standard</text>
  <text x="400" y="109" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4A5942">$20/mo (Pro)</text>
  <text x="560" y="109" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A5942">≈₹1,860/mo</text>
  <text x="720" y="109" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">$20/mo (Plus)</text>
  <rect x="40" y="123" width="820" height="32" fill="#F9F7F2" rx="3"/>
  <text x="185" y="145" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Power user</text>
