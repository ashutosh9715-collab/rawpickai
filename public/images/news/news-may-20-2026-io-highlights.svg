<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <rect width="900" height="240" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Google I/O 2026: Beyond Gemini</text>
  <rect x="60" y="55" width="390" height="70" rx="8" fill="white" stroke="#4A5942" stroke-width="1"/>
  <text x="80" y="82" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#4A5942">1.</text>
  <text x="115" y="78" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A453E">Gemini Spark: 24/7 personal AI agent</text>
  <text x="115" y="100" font-family="Georgia, serif" font-size="12" fill="#6B6960">Runs tasks autonomously in the background</text>
  <rect x="470" y="55" width="390" height="70" rx="8" fill="white" stroke="#4A5942" stroke-width="1"/>
  <text x="490" y="82" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#4A5942">2.</text>
  <text x="525" y="78" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A453E">Samsung Intelligent Eyewear</text>
  <text x="525" y="100" font-family="Georgia, serif" font-size="12" fill="#6B6960">Gemini-powered glasses, launching this fall</text>
  <rect x="60" y="135" width="390" height="70" rx="8" fill="white" stroke="#96845A" stroke-width="1"/>
  <text x="80" y="162" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#96845A">3.</text>
  <text x="115" y="158" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A453E">Google Flow + Flow Music</text>
  <text x="115" y="180" font-family="Georgia, serif" font-size="12" fill="#6B6960">AI creative apps now on iOS and Android</text>
  <rect x="470" y="135" width="390" height="70" rx="8" fill="white" stroke="#96845A" stroke-width="1"/>
  <text x="490" y="162" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#96845A">4.</text>
  <text x="525" y="158" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A453E">SynthID in Search + Chrome</text>
  <text x="525" y="180" font-family="Georgia, serif" font-size="12" fill="#6B6960">AI content detection expanding beyond Gemini app</text>
  <text x="450" y="230" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Source: Google I/O 2026 keynote + 9to5Google recap, May 19-20, 2026</text>
</svg>
