<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170">
  <rect width="900" height="170" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Who Should Use Perplexity (And Who Shouldn't)</text>
  <rect x="40" y="55" width="410" height="90" rx="10" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="245" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#4A5942">Perfect for</text>
  <text x="245" y="103" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Researchers, journalists, students, analysts</text>
  <text x="245" y="123" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Anyone whose work needs verifiable sources</text>
  <text x="245" y="140" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Free tier is enough for most. Pro at $20/mo (≈₹1,860) for heavy use.</text>
  <rect x="470" y="55" width="390" height="90" rx="10" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="665" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#c0392b">Look elsewhere if</text>
  <text x="665" y="103" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">You need creative writing, image gen, or coding</text>
  <text x="665" y="123" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Perplexity is a research tool, not a general AI</text>
  <text x="665" y="140" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Use Claude for writing, ChatGPT for images, Cursor for code</text>
  <text x="450" y="163" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Perplexity does one thing better than anyone else: research with citations. Don't use it for everything.</text>
</svg>
