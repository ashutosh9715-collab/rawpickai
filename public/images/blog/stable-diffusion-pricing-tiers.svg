<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 600; fill: #4A5942; }
      .tier-card { fill: #FFF9F5; stroke: #DDD8CE; stroke-width: 2; }
      .tier-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; font-weight: 600; fill: #4A5942; }
      .price { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 32px; font-weight: 700; fill: #6B7C5E; }
      .currency { font-size: 18px; }
      .details { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #8A8577; }
      .feature { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #3A3228; }
      .label-small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #8A8577; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="500" rx="12"/>

  <!-- Header -->
  <text class="heading" x="40" y="50">Stable Diffusion Costs: Hardware vs Cloud</text>

  <!-- Local Hardware (One-time) -->
  <rect class="tier-card" x="40" y="90" width="220" height="380" rx="12"/>
  <text class="tier-name" x="60" y="120">Local GPU</text>
  <text class="price" x="60" y="155"><tspan class="currency">One-time</tspan></text>
  <text class="details" x="60" y="175">Purchase</text>

  <line x1="60" y1="190" x2="250" y2="190" stroke="#DDD8CE" stroke-width="1"/>

  <text class="label-small" x="60" y="210">RTX 3060 12GB</text>
  <text class="feature" x="60" y="230">≈$0-30k</text>

  <text class="label-small" x="60" y="255">RTX 4070 Super</text>
  <text class="feature" x="60" y="275">≈$1 (≈₹60)-70k</text>

  <text class="label-small" x="60" y="300">RTX 4090</text>
  <text class="feature" x="60" y="320">≈$1 (≈₹120)k+</text>

  <text class="label-small" x="60" y="345">Monthly Cost</text>
  <text class="feature" x="60" y="365">$0</text>
  <text class="feature" x="60" y="385">Unlimited</text>

  <!-- Cloud GPU Rental -->
  <rect class="tier-card" x="300" y="90" width="220" height="380" rx="12"/>
  <text class="tier-name" x="320" y="120">Cloud GPU</text>
  <text class="price" x="320" y="155"><tspan class="currency">Hourly</tspan></text>
  <text class="details" x="320" y="175">Rental</text>

  <line x1="320" y1="190" x2="510" y2="190" stroke="#DDD8CE" stroke-width="1"/>

  <text class="label-small" x="320" y="210">RunPod A6000</text>
  <text class="feature" x="320" y="230">≈$0-90/hr</text>

  <text class="label-small" x="320" y="255">Vast.ai GPUs</text>
  <text class="feature" x="320" y="275">≈$0-135/hr</text>

  <text class="label-small" x="320" y="300">100 images</text>
  <text class="feature" x="320" y="320">≈$48 (≈₹4,500)-9k</text>

  <text class="label-small" x="320" y="345">Monthly (100 img)</text>
  <text class="feature" x="320" y="365">≈$48 (≈₹4,500)-₹9,000</text>

  <!-- Comparison: Midjourney -->
  <rect class="tier-card" x="560" y="90" width="220" height="380" rx="12"/>
  <text class="tier-name" x="580" y="120">Midjourney</text>
  <text class="price" x="580" y="155"><tspan class="currency">Monthly</tspan></text>
  <text class="details" x="580" y="175">Subscription</text>

  <line x1="580" y1="190" x2="770" y2="190" stroke="#DDD8CE" stroke-width="1"/>

  <text class="label-small" x="580" y="210">Pro Plan</text>
  <text class="feature" x="580" y="230">≈$20 (≈₹1,860)</text>

  <text class="label-small" x="580" y="255">Annual Cost</text>
  <text class="feature" x="580" y="275">≈$240 (≈₹22,320)</text>

  <text class="label-small" x="580" y="300">3-Year Cost</text>
  <text class="feature" x="580" y="320">≈$600 (≈₹55,800)</text>

  <text class="label-small" x="580" y="345">vs SD 3060</text>
  <text class="feature" x="580" y="365">+$0k hardware</text>
  <text class="feature" x="580" y="385">= breakeven</text>
</svg>