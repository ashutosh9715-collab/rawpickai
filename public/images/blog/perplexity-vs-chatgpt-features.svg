<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #4A5942; }
      .label { font-size: 12px; fill: #3A3228; }
      .value { font-size: 11px; fill: #3A3228; }
      .track { fill: #DDD8CE; }
      .bar-perplexity { fill: #6B7C5E; }
      .bar-chatgpt { fill: #96845A; }
    </style>
  </defs>

  <rect class="bg" width="900" height="480"/>

  <text class="header" x="40" y="35">Research &amp; General Use Comparison</text>

  <g>
    <text class="label" x="40" y="70" font-weight="600">Citation Quality</text>
    <rect class="track" x="40" y="78" width="220" height="7" rx="3"/>
    <rect class="bar-perplexity" x="40" y="78" width="220" height="7" rx="3"/>
    <text class="value" x="270" y="87">Perplexity 10/10</text>

    <rect class="track" x="40" y="92" width="220" height="7" rx="3"/>
    <rect class="bar-chatgpt" x="40" y="92" width="110" height="7" rx="3"/>
    <text class="value" x="270" y="101">ChatGPT 5/10</text>
  </g>

  <g>
    <text class="label" x="40" y="135" font-weight="600">Factual Accuracy</text>
    <rect class="track" x="40" y="143" width="220" height="7" rx="3"/>
    <rect class="bar-perplexity" x="40" y="143" width="198" height="7" rx="3"/>
    <text class="value" x="270" y="152">Perplexity 9/10</text>

    <rect class="track" x="40" y="157" width="220" height="7" rx="3"/>
    <rect class="bar-chatgpt" x="40" y="157" width="154" height="7" rx="3"/>
    <text class="value" x="270" y="166">ChatGPT 7/10</text>
  </g>

  <g>
    <text class="label" x="40" y="200" font-weight="600">Writing Quality</text>
    <rect class="track" x="40" y="208" width="220" height="7" rx="3"/>
    <rect class="bar-perplexity" x="40" y="208" width="110" height="7" rx="3"/>
    <text class="value" x="270" y="217">Perplexity 5/10</text>

    <rect class="track" x="40" y="222" width="220" height="7" rx="3"/>
    <rect class="bar-chatgpt" x="40" y="222" width="176" height="7" rx="3"/>
    <text class="value" x="270" y="231">ChatGPT 8/10</text>
  </g>

  <g>
    <text class="label" x="40" y="265" font-weight="600">Image Generation</text>
    <rect class="track" x="40" y="273" width="220" height="7" rx="3"/>
    <rect class="bar-perplexity" x="40" y="273" width="0" height="7" rx="3"/>
    <text class="value" x="270" y="282">Perplexity 0/10</text>

    <rect class="track" x="40" y="287" width="220" height="7" rx="3"/>
    <rect class="bar-chatgpt" x="40" y="287" width="198" height="7" rx="3"/>
    <text class="value" x="270" y="296">ChatGPT 9/10</text>
  </g>

  <g>
    <text class="label" x="40" y="330" font-weight="600">Coding Ability</text>
    <rect class="track" x="40" y="338" width="220" height="7" rx="3"/>
    <rect class="bar-perplexity" x="40" y="338" width="99" height="7" rx="3"/>
    <text class="value" x="270" y="347">Perplexity 4.5/10</text>

    <rect class="track" x="40" y="352" width="220" height="7" rx="3"/>
    <rect class="bar-chatgpt" x="40" y="352" width="176" height="7" rx="3"/>
    <text class="value" x="270" y="361">ChatGPT 8/10</text>
  </g>

  <g>
    <text class="label" x="40" y="395" font-weight="600">Speed (for research)</text>
    <rect class="track" x="40" y="403" width="220" height="7" rx="3"/>
    <rect class="bar-perplexity" x="40" y="403" width="198" height="7" rx="3"/>
    <text class="value" x="270" y="412">Perplexity 9/10</text>

    <rect class="track" x="40" y="417" width="220" height="7" rx="3"/>
    <rect class="bar-chatgpt" x="40" y="417" width="132" height="7" rx="3"/>
    <text class="value" x="270" y="426">ChatGPT 6/10</text>
  </g>

  <text class="value" x="40" y="460" font-style="italic" font-size="11">Best combo: Perplexity for research facts, ChatGPT for everything else.</text>
</svg>