<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F1EA" rx="16"/>
  <rect x="0" y="0" width="1200" height="6" fill="#4A5942" rx="3"/>
  <text x="600" y="80" font-family="Georgia, serif" font-size="16" font-weight="600" text-anchor="middle" fill="#6B7C5E">RAWPICKAI NEWS · MAY 28, 2026</text>
  <text x="600" y="155" font-family="Georgia, serif" font-size="40" font-weight="700" text-anchor="middle" fill="#1A2416">KPMG Deploys Claude to 276,000 Staff,</text>
  <text x="600" y="210" font-family="Georgia, serif" font-size="40" font-weight="700" text-anchor="middle" fill="#1A2416">OpenAI Launches $4B DeployCo</text>
  <text x="600" y="265" font-family="Georgia, serif" font-size="24" font-weight="400" text-anchor="middle" fill="#4A453E">Enterprise AI just became a consulting war</text>
  <rect x="300" y="305" width="600" height="3" fill="#4A5942" opacity="0.2" rx="1"/>
  <rect x="150" y="340" width="280" height="120" rx="12" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="290" y="375" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#4A5942">KPMG + Claude</text>
  <text x="290" y="405" font-family="Georgia, serif" font-size="28" font-weight="700" text-anchor="middle" fill="#4A5942">276K</text>
  <text x="290" y="430" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">employees across</text>
  <text x="290" y="448" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">138 countries</text>
  <rect x="460" y="340" width="280" height="120" rx="12" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="600" y="375" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#96845A">OpenAI DeployCo</text>
  <text x="600" y="405" font-family="Georgia, serif" font-size="28" font-weight="700" text-anchor="middle" fill="#96845A">$4B</text>
  <text x="600" y="430" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">consulting subsidiary</text>
  <text x="600" y="448" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">19 investment firms</text>
  <rect x="770" y="340" width="280" height="120" rx="12" fill="white" stroke="#6B7C5E" stroke-width="1.5"/>
  <text x="910" y="375" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#6B7C5E">Enterprise AI Race</text>
  <text x="910" y="405" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A453E">KPMG, PwC, Deloitte,</text>
  <text x="910" y="430" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A453E">BlackRock all on Claude</text>
  <text x="910" y="448" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">vs OpenAI's own consulting arm</text>
  <text x="600" y="540" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#8A8577">rawpickai.com</text>
