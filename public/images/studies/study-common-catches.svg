<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <rect width="900" height="260" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#96845A" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Most Common Catches Across 48 Tools</text>
  <rect x="60" y="55" width="380" height="60" rx="8" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="80" y="82" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#c0392b">1.</text>
  <text x="115" y="78" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A453E">Output quality degrades at scale</text>
  <text x="115" y="98" font-family="Georgia, serif" font-size="12" fill="#6B6960">Works great for demos, falls apart on real projects</text>
  <rect x="460" y="55" width="380" height="60" rx="8" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="82" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#c0392b">2.</text>
  <text x="515" y="78" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A453E">Pricing page doesn't match reality</text>
  <text x="515" y="98" font-family="Georgia, serif" font-size="12" fill="#6B6960">Hidden limits, surprise overages, unclear tiers</text>
  <rect x="60" y="125" width="380" height="60" rx="8" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="80" y="152" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#96845A">3.</text>
  <text x="115" y="148" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A453E">Free tier is a bait-and-switch</text>
  <text x="115" y="168" font-family="Georgia, serif" font-size="12" fill="#6B6960">Great for one week, useless after that</text>
  <rect x="460" y="125" width="380" height="60" rx="8" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="480" y="152" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#96845A">4.</text>
  <text x="515" y="148" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A453E">No export or portability</text>
  <text x="515" y="168" font-family="Georgia, serif" font-size="12" fill="#6B6960">Your data goes in but doesn't come out cleanly</text>
  <rect x="60" y="195" width="380" height="60" rx="8" fill="white" stroke="#6B6960" stroke-width="1.5"/>
  <text x="80" y="222" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#6B6960">5.</text>
  <text x="115" y="218" font-family="Georgia, serif" font-size="13" font-weight="600" fill="#4A453E">Benchmark scores don't match real use</text>
  <text x="115" y="238" font-family="Georgia, serif" font-size="12" fill="#6B6960">Marketing claims vs actual daily performance</text>
</svg>
