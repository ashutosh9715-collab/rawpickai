<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --bg: #F4F1EA;
        --heading: #4A5942;
        --bar-primary: #6B7C5E;
        --bar-secondary: #96845A;
        --body: #3A3228;
        --muted: #8A8577;
        --track: #DDD8CE;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="350" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#4A5942">
    Pika AI Review Scores
  </text>

  <!-- Subtitle -->
  <text x="350" y="55" font-size="13" text-anchor="middle" fill="#8A8577">
    Overall: 3.7 / 5.0  -  Best Value Video Generator
  </text>

  <!-- Chart grid line -->
  <line x1="50" y1="70" x2="650" y2="70" stroke="#DDD8CE" stroke-width="1"/>

  <!-- Ease of Use -->
  <text x="50" y="105" font-size="12" fill="#3A3228" font-weight="500">Ease of Use</text>
  <rect x="200" y="92" width="270" height="20" fill="#DDD8CE" rx="12"/>
  <rect x="200" y="92" width="226.8" height="20" fill="#96845A" rx="12"/>
  <text x="480" y="108" font-size="12" fill="#3A3228" font-weight="bold">84/100</text>

  <!-- Output Quality -->
  <text x="50" y="155" font-size="12" fill="#3A3228" font-weight="500">Output Quality</text>
  <rect x="200" y="142" width="270" height="20" fill="#DDD8CE" rx="12"/>
  <rect x="200" y="142" width="189" height="20" fill="#6B7C5E" rx="12"/>
  <text x="480" y="158" font-size="12" fill="#3A3228" font-weight="bold">70/100</text>

  <!-- Value for Money -->
  <text x="50" y="205" font-size="12" fill="#3A3228" font-weight="500">Value for Money</text>
  <rect x="200" y="192" width="270" height="20" fill="#DDD8CE" rx="12"/>
  <rect x="200" y="192" width="232.2" height="20" fill="#96845A" rx="12"/>
  <text x="480" y="208" font-size="12" fill="#3A3228" font-weight="bold">86/100</text>

  <!-- Feature Depth -->
  <text x="50" y="255" font-size="12" fill="#3A3228" font-weight="500">Feature Depth</text>
  <rect x="200" y="242" width="270" height="20" fill="#DDD8CE" rx="12"/>
  <rect x="200" y="242" width="205.2" height="20" fill="#6B7C5E" rx="12"/>
  <text x="480" y="258" font-size="12" fill="#3A3228" font-weight="bold">76/100</text>

  <!-- Free Tier -->
  <text x="50" y="305" font-size="12" fill="#3A3228" font-weight="500">Free Tier</text>
  <rect x="200" y="292" width="270" height="20" fill="#DDD8CE" rx="12"/>
  <rect x="200" y="292" width="221.4" height="20" fill="#96845A" rx="12"/>
  <text x="480" y="308" font-size="12" fill="#3A3228" font-weight="bold">82/100</text>

  <!-- Overall Score Box -->
  <rect x="50" y="340" width="600" height="50" fill="#DDD8CE" rx="12"/>
  <text x="350" y="360" font-size="14" font-weight="bold" text-anchor="middle" fill="#3A3228">
    Overall Score: 3.7 / 5.0
  </text>
  <text x="350" y="380" font-size="11" text-anchor="middle" fill="#8A8577">
    Best for budget creators generating 10+ videos monthly
  </text>
</svg>