  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Gumloop vs Zapier vs Make: AI Workflow Comparison</text>
  <rect x="40" y="55" width="820" height="28" rx="6" fill="#4A5942"/>
