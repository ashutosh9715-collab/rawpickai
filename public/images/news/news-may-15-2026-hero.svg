  <text x="910" y="160" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#96845A">iOS 27 AI CHOICE</text>
  <text x="780" y="210" font-family="Georgia, serif" font-size="15" fill="#4A453E">ChatGPT</text>
  <text x="1040" y="210" font-family="Georgia, serif" font-size="13" fill="#96845A" text-anchor="end">Current default</text>
