  </text>
  <rect x="280" y="180" width="300" height="28" rx="12" fill="#DDD8CE"/>
  <rect x="280" y="180" width="228" height="28" rx="12" fill="#96845A"/>
  <text x="590" y="200" font-size="16" font-weight="bold" fill="#3A3228" font-family="system-ui">76/100</text>

  <!-- Value for Money -->
  <text x="40" y="260" font-size="16" font-weight="600" fill="#3A3228" font-family="system-ui">
    Value for Money
  </text>
  <rect x="280" y="245" width="300" height="28" rx="12" fill="#DDD8CE"/>
  <rect x="280" y="245" width="150" height="28" rx="12" fill="#6B7C5E"/>
  <text x="590" y="265" font-size="16" font-weight="bold" fill="#3A3228" font-family="system-ui">50/100</text>

  <!-- Feature Depth -->
  <text x="40" y="325" font-size="16" font-weight="600" fill="#3A3228" font-family="system-ui">
