<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="1200" height="213">
  <rect width="900" height="160" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Gumloop vs Traditional Automation: The Core Difference</text>
  <rect x="40" y="55" width="390" height="80" rx="8" fill="white" stroke="#6B6960" stroke-width="1"/>
  <text x="235" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#6B6960">Zapier / Make (AI bolted on)</text>
  <text x="235" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">App A triggers App B. AI is one</text>
  <text x="235" y="120" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">node among thousands. Cost per step.</text>
  <rect x="470" y="55" width="390" height="80" rx="8" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="665" y="80" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4A5942">Gumloop (AI-native)</text>
  <text x="665" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">AI is the workflow. 7 models.</text>
  <text x="665" y="120" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A5942">Only AI calls cost credits. Logic is free.</text>
  <text x="450" y="152" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Backed by $50M Series B (Benchmark). Founded to make AI the center of automation, not an afterthought.</text>
</svg>
