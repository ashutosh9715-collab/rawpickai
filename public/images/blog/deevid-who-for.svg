<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="1200" height="226">
  <rect width="900" height="170" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">DeeVid AI: Right Fit vs Wrong Fit</text>
  <rect x="40" y="55" width="400" height="95" rx="10" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="240" y="82" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4A5942">Good fit</text>
  <text x="240" y="106" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Solo creators needing video + image</text>
  <text x="240" y="124" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">+ music + voice in one platform</text>
  <text x="240" y="142" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Small business owners, social creators</text>
  <rect x="460" y="55" width="400" height="95" rx="10" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="660" y="82" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#c0392b">Poor fit</text>
  <text x="660" y="106" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Quality-first creators, API developers</text>
  <text x="660" y="124" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">daily posting schedules on Lite plan</text>
  <text x="660" y="142" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Use Runway for quality, Pika for free tier</text>
  <text x="450" y="163" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">The bundled tools are DeeVid's best argument. Video quality alone does not justify the credit system.</text>
</svg>
