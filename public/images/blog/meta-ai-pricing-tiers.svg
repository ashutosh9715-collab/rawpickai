<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #F4F1EA; }
      .card-bg { fill: #FFFFFF; stroke: #DDD8CE; stroke-width: 2; }
      .card-highlight { fill: #F0EDE4; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #4A5942; }
      .price { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 700; fill: #4A5942; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #8A8577; }
      .feature { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #3A3228; }
      .page-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 600; fill: #4A5942; }
    </style>
  </defs>

  <rect class="bg" width="800" height="320" rx="12" />
  <text x="40" y="35" class="page-title">Meta AI Pricing (Free + Premium)</text>

  <!-- Free Tier -->
  <g id="free">
    <rect x="50" y="60" width="200" height="240" rx="8" class="card-highlight" />
    <rect x="50" y="60" width="200" height="240" rx="8" class="card-bg" />
    <text x="150" y="95" text-anchor="middle" class="title">Free Tier</text>
    <text x="150" y="125" text-anchor="middle" class="price">$0</text>
    <text x="150" y="145" text-anchor="middle" class="subtitle">Forever free</text>
    <text x="70" y="170" class="feature">✓ WhatsApp access</text>
    <text x="70" y="190" class="feature">✓ Instagram access</text>
    <text x="70" y="210" class="feature">✓ Messenger access</text>
    <text x="70" y="230" class="feature">✓ Basic features</text>
    <text x="70" y="250" class="feature">✓ Unlimited chats</text>
  </g>

  <!-- Premium Tier -->
  <g id="premium">
    <rect x="300" y="60" width="200" height="240" rx="8" class="card-bg" />
    <text x="400" y="95" text-anchor="middle" class="title">Premium (Testing)</text>
    <text x="400" y="125" text-anchor="middle" class="price">$1</text>
    <text x="400" y="145" text-anchor="middle" class="subtitle">/month ()</text>
    <text x="320" y="170" class="feature">✓ All free features</text>
    <text x="320" y="190" class="feature">✓ Early features</text>
    <text x="320" y="210" class="feature">✓ Priority access</text>
    <text x="320" y="230" class="feature">✓ Higher limits</text>
    <text x="320" y="250" class="feature">✓ Custom settings</text>
  </g>

  <!-- Compare Note -->
  <g id="note">
    <rect x="550" y="60" width="210" height="240" rx="8" fill="#F9F6F1" stroke="#DDD8CE" stroke-width="1" stroke-dasharray="4,4" />
    <text x="655" y="95" text-anchor="middle" class="title" style="font-size: 14px;">Why Meta AI?</text>
    <text x="570" y="130" class="subtitle" style="font-size: 12px; line-height: 1.4;">Zero-friction</text>
    <text x="570" y="150" class="subtitle" style="font-size: 12px;">access through</text>
    <text x="570" y="170" class="subtitle" style="font-size: 12px;">WhatsApp makes it</text>
    <text x="570" y="190" class="subtitle" style="font-size: 12px;">the most accessible</text>
    <text x="570" y="210" class="subtitle" style="font-size: 12px;">AI for billions of</text>
    <text x="570" y="230" class="subtitle" style="font-size: 12px;">daily app users</text>
  </g>
</svg>