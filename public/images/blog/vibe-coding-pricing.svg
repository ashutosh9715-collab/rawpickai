  <text x="440" y="206" fill="#3A3228" font-size="10" text-anchor="middle">$20/mo (≈₹1,860)</text>
  <text x="600" y="206" fill="#6B7C5E" font-size="10" text-anchor="middle">Low</text>
  <text x="730" y="206" fill="#8A8577" font-size="10" text-anchor="middle">If Vercel ecosystem</text>

