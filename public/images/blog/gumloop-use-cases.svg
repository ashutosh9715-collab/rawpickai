  <text x="135" y="100" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#4A453E">Apollo + AI analysis</text>
  <text x="135" y="118" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">+ CRM update</text>
  <rect x="250" y="55" width="190" height="90" rx="8" fill="white" stroke="#6B7C5E" stroke-width="1.5"/>
