  <text x="345" y="118" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">+ publish automated</text>
  <rect x="460" y="55" width="190" height="90" rx="8" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="555" y="80" font-family="Georgia, serif" font-size="12" font-weight="600" text-anchor="middle" fill="#96845A">Web scraping</text>
