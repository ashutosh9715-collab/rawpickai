<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="1200" height="200">
  <rect width="900" height="150" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#96845A" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Gumloop India Pricing: Free vs Pro</text>
  <rect x="40" y="55" width="390" height="75" rx="8" fill="white" stroke="#22c55e" stroke-width="1.5"/>
  <text x="235" y="80" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#22c55e">Free Plan: Start here</text>
  <text x="235" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">5,000 credits/mo - No credit card</text>
  <text x="235" y="120" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">50 AI workflow runs avg. Enough to test.</text>
  <rect x="470" y="55" width="390" height="75" rx="8" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="665" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#96845A">Pro: $37/mo (≈₹3,441)</text>
  <text x="665" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">GST-registered: add 18% = ≈₹4,060</text>
  <text x="665" y="120" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Best for teams, not solo users</text>
  <text x="450" y="143" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">At ₹30K income, Pro is 11% of earnings. Start free. Upgrade when team needs justify it.</text>
</svg>
