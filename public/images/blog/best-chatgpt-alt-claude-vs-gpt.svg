<svg viewBox="0 0 700 250" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="250" fill="#F4F1EA"/>
  <text x="350" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#4A5942">Claude vs ChatGPT - Where Each Wins</text>
  <text x="350" y="48" font-size="11" text-anchor="middle" fill="#8A8577">Both cost $20/mo - choose based on your primary need</text>
  <text x="20" y="85" font-size="11" font-weight="700" fill="#3A3228">Task</text>
  <text x="350" y="85" font-size="11" font-weight="700" text-anchor="middle" fill="#6B7C5E">Claude</text>
  <text x="580" y="85" font-size="11" font-weight="700" text-anchor="middle" fill="#96845A">ChatGPT</text>
  <line x1="20" y1="95" x2="680" y2="95" stroke="#DDD8CE" stroke-width="1"/>
  <text x="20" y="115" font-size="11" fill="#3A3228">Writing quality</text>
  <text x="350" y="115" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Winner</text>
  <text x="580" y="115" font-size="11" text-anchor="middle" fill="#8A8577">Good</text>
  <line x1="20" y1="128" x2="680" y2="128" stroke="#DDD8CE" stroke-width="1"/>
  <text x="20" y="148" font-size="11" fill="#3A3228">Long documents (100K+)</text>
  <text x="350" y="148" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Winner</text>
  <text x="580" y="148" font-size="11" text-anchor="middle" fill="#8A8577">Good</text>
  <line x1="20" y1="161" x2="680" y2="161" stroke="#DDD8CE" stroke-width="1"/>
  <text x="20" y="181" font-size="11" fill="#3A3228">Image generation</text>
  <text x="350" y="181" font-size="11" text-anchor="middle" fill="#8A8577">No</text>
  <text x="580" y="181" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Winner</text>
  <line x1="20" y1="194" x2="680" y2="194" stroke="#DDD8CE" stroke-width="1"/>
  <text x="20" y="214" font-size="11" fill="#3A3228">Versatility (code + web + voice)</text>
  <text x="350" y="214" font-size="11" text-anchor="middle" fill="#8A8577">Limited</text>
  <text x="580" y="214" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Winner</text>
  <text x="350" y="245" font-size="10" text-anchor="middle" fill="#8A8577">Data from RawPickAI testing - rawpickai.com</text>
</svg>
