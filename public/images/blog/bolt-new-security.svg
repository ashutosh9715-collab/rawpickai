<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="380" rx="12" fill="#F4F1EA"/>

  <text x="40" y="38" fill="#3A3228" font-size="18" font-weight="700">Bolt.new Security Audit</text>
  <text x="40" y="58" fill="#8A8577" font-size="13">5 apps tested for OWASP Top 10 vulnerabilities</text>

  <!-- Table header -->
  <rect x="40" y="76" width="720" height="32" rx="6" fill="#4A5942"/>
  <text x="60" y="97" fill="#F4F1EA" font-size="12" font-weight="600">Security Check</text>
  <text x="400" y="97" fill="#F4F1EA" font-size="12" font-weight="600">Result</text>
  <text x="580" y="97" fill="#F4F1EA" font-size="12" font-weight="600">Status</text>

  <!-- Row 1: API Key -->
  <rect x="40" y="112" width="720" height="36" rx="0" fill="#FFFFFF" opacity="0.6"/>
  <text x="60" y="135" fill="#3A3228" font-size="12" font-weight="600">API Key Exposure</text>
  <text x="400" y="135" fill="#3A3228" font-size="12">1/5 leaked in .env</text>
  <circle cx="600" cy="130" r="8" fill="#96845A" opacity="0.2"/>
  <text x="595" y="134" fill="#96845A" font-size="11" font-weight="700">!</text>

  <!-- Row 2: Auth -->
  <rect x="40" y="148" width="720" height="36" rx="0" fill="#FFFFFF" opacity="0.3"/>
  <text x="60" y="171" fill="#3A3228" font-size="12" font-weight="600">Auth Implementation</text>
  <text x="400" y="171" fill="#3A3228" font-size="12">4/5 solid</text>
  <circle cx="600" cy="166" r="8" fill="#6B7C5E" opacity="0.3"/>
  <text x="595" y="170" fill="#6B7C5E" font-size="11" font-weight="700">P</text>

  <!-- Row 3: Input Sanitization -->
  <rect x="40" y="184" width="720" height="36" rx="0" fill="#FFFFFF" opacity="0.6"/>
  <text x="60" y="207" fill="#3A3228" font-size="12" font-weight="600">Input Sanitization</text>
  <text x="400" y="207" fill="#3A3228" font-size="12">0/5 passed</text>
  <circle cx="600" cy="202" r="8" fill="#96845A" opacity="0.2"/>
  <text x="594" y="206" fill="#96845A" font-size="11" font-weight="700">F</text>

  <!-- Row 4: Rate Limiting -->
  <rect x="40" y="220" width="720" height="36" rx="0" fill="#FFFFFF" opacity="0.3"/>
  <text x="60" y="243" fill="#3A3228" font-size="12" font-weight="600">Rate Limiting</text>
  <text x="400" y="243" fill="#3A3228" font-size="12">0/5 implemented</text>
  <circle cx="600" cy="238" r="8" fill="#96845A" opacity="0.2"/>
  <text x="594" y="242" fill="#96845A" font-size="11" font-weight="700">F</text>

  <!-- Row 5: XSS -->
  <rect x="40" y="256" width="720" height="36" rx="0" fill="#FFFFFF" opacity="0.6"/>
  <text x="60" y="279" fill="#3A3228" font-size="12" font-weight="600">XSS Protection</text>
  <text x="400" y="279" fill="#3A3228" font-size="12">3/5 (React defaults)</text>
  <circle cx="600" cy="274" r="8" fill="#6B7C5E" opacity="0.3"/>
  <text x="595" y="278" fill="#6B7C5E" font-size="11" font-weight="700">P</text>

  <!-- Row 6: CSRF -->
  <rect x="40" y="292" width="720" height="36" rx="0" fill="#FFFFFF" opacity="0.3"/>
  <text x="60" y="315" fill="#3A3228" font-size="12" font-weight="600">CSRF Protection</text>
  <text x="400" y="315" fill="#3A3228" font-size="12">1/5 handled</text>
  <circle cx="600" cy="310" r="8" fill="#96845A" opacity="0.2"/>
  <text x="594" y="314" fill="#96845A" font-size="11" font-weight="700">F</text>

  <!-- Footer -->
  <text x="40" y="358" fill="#8A8577" font-size="11">42.8% of vibe-coded apps fail basic security checks - rawpickai.com</text>
</svg>