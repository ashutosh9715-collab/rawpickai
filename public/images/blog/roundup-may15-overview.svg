  <text x="820" y="420" font-family="Georgia, serif" font-size="14" fill="#4A453E">Googlebooks laptops this fall</text>
  <text x="600" y="505" font-family="Georgia, serif" font-size="16" font-weight="600" text-anchor="middle" fill="#4A5942">Record revenue + mass layoffs + platform wars = the new normal</text>
  <text x="600" y="580" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#8A8577">rawpickai.com/blog</text>
