<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="340" fill="#F4F1EA"/>
  <text x="350" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#4A5942">Enterprise Cost Comparison</text>
  <text x="350" y="50" font-size="11" text-anchor="middle" fill="#8A8577">Annual cost for a 10-person team (USD)</text>

  <!-- Bars - horizontal, sorted by cost -->
  <text x="20" y="100" font-size="12" font-weight="600" fill="#3A3228">Google Slides</text>
  <rect x="180" y="86" width="10" height="24" rx="4" fill="#6B7C5E"/>
  <text x="200" y="103" font-size="12" font-weight="700" fill="#4A5942">$0/yr</text>

  <text x="20" y="145" font-size="12" font-weight="600" fill="#3A3228">Gamma Pro</text>
  <rect x="180" y="131" width="80" height="24" rx="4" fill="#6B7C5E"/>
  <text x="270" y="148" font-size="12" font-weight="700" fill="#4A5942">$2,400/yr</text>
  <text x="345" y="148" font-size="10" fill="#8A8577">(≈₹2.2L)</text>

  <text x="20" y="190" font-size="12" font-weight="600" fill="#3A3228">Canva Teams</text>
  <rect x="180" y="176" width="60" height="24" rx="4" fill="#96845A"/>
  <text x="250" y="193" font-size="12" font-weight="700" fill="#4A5942">$1,800/yr</text>
  <text x="330" y="193" font-size="10" fill="#8A8577">(≈₹1.7L)</text>

  <text x="20" y="235" font-size="12" font-weight="600" fill="#3A3228">Beautiful.ai Team</text>
  <rect x="180" y="221" width="150" height="24" rx="4" fill="#96845A"/>
  <text x="340" y="238" font-size="12" font-weight="700" fill="#4A5942">$4,800/yr</text>
  <text x="420" y="238" font-size="10" fill="#8A8577">(≈₹4.5L)</text>

  <text x="20" y="280" font-size="12" font-weight="600" fill="#3A3228">PowerPoint + Copilot</text>
  <rect x="180" y="266" width="320" height="24" rx="4" fill="#8A8577"/>
  <text x="510" y="283" font-size="12" font-weight="700" fill="#4A5942">$6,240/yr</text>
  <text x="595" y="283" font-size="10" fill="#8A8577">(≈₹5.8L)</text>

  <text x="350" y="325" font-size="10" text-anchor="middle" fill="#8A8577">Based on standard published pricing. Enterprise discounts may apply. Data from RawPickAI.</text>
</svg>
