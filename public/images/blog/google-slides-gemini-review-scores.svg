<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 700; fill: #4A5942; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #3A3228; }
      .value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #4A5942; }
      .bar-bg { fill: #DDD8CE; }
      .bar { fill: #6B7C5E; }
      .accent { fill: #96845A; }
      .muted { fill: #8A8577; }
      .special { fill: #6B7C5E; }
    </style>
  </defs>

  <rect class="bg" width="800" height="400" rx="12"/>

  <text class="heading" x="40" y="45">Google Slides + Gemini Review Scores</text>

  <!-- Value for Money -->
  <text class="label" x="40" y="100">Value for Money</text>
  <rect class="bar-bg" x="280" y="88" width="450" height="20" rx="4"/>
  <rect class="special" x="280" y="88" width="450" height="20" rx="4"/>
  <text class="value" x="745" y="105">100</text>

  <!-- Ease of Use -->
  <text class="label" x="40" y="155">Ease of Use</text>
  <rect class="bar-bg" x="280" y="143" width="450" height="20" rx="4"/>
  <rect class="bar" x="280" y="143" width="360" height="20" rx="4"/>
  <text class="value" x="745" y="160">80</text>

  <!-- Free Tier -->
  <text class="label" x="40" y="210">Free Tier</text>
  <rect class="bar-bg" x="280" y="198" width="450" height="20" rx="4"/>
  <rect class="bar" x="280" y="198" width="405" height="20" rx="4"/>
  <text class="value" x="745" y="215">90</text>

  <!-- Feature Depth -->
  <text class="label" x="40" y="265">Feature Depth</text>
  <rect class="bar-bg" x="280" y="253" width="450" height="20" rx="4"/>
  <rect class="bar" x="280" y="253" width="270" height="20" rx="4"/>
  <text class="value" x="745" y="270">60</text>

  <!-- Output Quality -->
  <text class="label" x="40" y="320">Output Quality</text>
  <rect class="bar-bg" x="280" y="308" width="450" height="20" rx="4"/>
  <rect class="accent" x="280" y="308" width="225" height="20" rx="4"/>
  <text class="value" x="745" y="325">50</text>

  <!-- Overall Score -->
  <text class="muted" x="40" y="370">Overall Score: 3.2/5</text>
</svg>
