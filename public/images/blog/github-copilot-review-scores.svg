<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --bg: #F4F1EA;
        --heading: #4A5942;
        --bar-primary: #6B7C5E;
        --bar-accent: #96845A;
        --body: #3A3228;
        --muted: #8A8577;
        --track: #DDD8CE;
      }
      body { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { fill: #4A5942; font-family: system-ui, -apple-system, sans-serif; font-weight: 600; }
      .label { fill: #3A3228; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
      .score-text { fill: #6B7C5E; font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; }
      .bar { rx: 12; }
    </style>
  </defs>

  <rect class="bg" width="700" height="400"/>

  <!-- Title -->
  <text class="heading" x="40" y="35" font-size="22">GitHub Copilot Scores</text>

  <!-- Overall Score -->
  <text class="label" x="40" y="70">Overall Score</text>
  <rect class="bar" x="40" y="80" width="280" height="28" fill="#6B7C5E" opacity="0.9"/>
  <text class="score-text" x="340" y="102">4.2 / 5.0</text>

  <!-- Ease of Use -->
  <text class="label" x="40" y="135">Ease of Use</text>
  <rect class="bar" x="40" y="145" width="297" height="24" fill="#6B7C5E" opacity="0.8"/>
  <rect class="bar" x="337" y="145" width="21" height="24" fill="#96845A" opacity="0.6"/>
  <text class="score-text" x="390" y="164">90 / 100</text>

  <!-- Output Quality -->
  <text class="label" x="40" y="195">Output Quality</text>
  <rect class="bar" x="40" y="205" width="271" height="24" fill="#6B7C5E" opacity="0.8"/>
  <rect class="bar" x="311" y="205" width="61" height="24" fill="#96845A" opacity="0.6"/>
  <text class="score-text" x="390" y="224">82 / 100</text>

  <!-- Value for Money -->
  <text class="label" x="40" y="255">Value for Money</text>
  <rect class="bar" x="40" y="265" width="264" height="24" fill="#6B7C5E" opacity="0.8"/>
  <rect class="bar" x="304" y="265" width="68" height="24" fill="#96845A" opacity="0.6"/>
  <text class="score-text" x="390" y="284">80 / 100</text>

  <!-- Feature Depth -->
  <text class="label" x="40" y="315">Feature Depth</text>
  <rect class="bar" x="40" y="325" width="278" height="24" fill="#6B7C5E" opacity="0.8"/>
  <rect class="bar" x="318" y="325" width="54" height="24" fill="#96845A" opacity="0.6"/>
  <text class="score-text" x="390" y="344">84 / 100</text>

  <!-- Free Tier -->
  <text class="label" x="40" y="375">Free Tier Quality</text>
  <rect class="bar" x="40" y="385" width="231" height="24" fill="#6B7C5E" opacity="0.8"/>
  <rect class="bar" x="271" y="385" width="101" height="24" fill="#96845A" opacity="0.6"/>
  <text class="score-text" x="390" y="404">70 / 100</text>
</svg>