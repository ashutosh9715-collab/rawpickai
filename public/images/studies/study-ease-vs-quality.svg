<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <rect width="900" height="260" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Ease of Use vs Output Quality — No Correlation</text>
  <text x="60" y="230" font-family="Georgia, serif" font-size="11" fill="#6B6960">Ease of Use →</text>
  <text x="60" y="60" font-family="Georgia, serif" font-size="11" fill="#6B6960">Output Quality ↑</text>
  <rect x="100" y="55" width="1" height="170" fill="#4A5942" opacity="0.2"/>
  <rect x="100" y="225" width="720" height="1" fill="#4A5942" opacity="0.2"/>
  <circle cx="750" cy="75" r="12" fill="#4A5942" opacity="0.7"/><text x="750" y="65" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#4A5942">NotebookLM</text>
  <circle cx="680" cy="85" r="11" fill="#4A5942" opacity="0.7"/><text x="680" y="75" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#4A5942">ChatGPT</text>
  <circle cx="600" cy="80" r="11" fill="#4A5942" opacity="0.7"/><text x="600" y="70" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#4A5942">Claude</text>
  <circle cx="400" cy="90" r="10" fill="#6B7C5E" opacity="0.7"/><text x="400" y="80" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#4A5942">Cursor</text>
  <circle cx="550" cy="110" r="10" fill="#6B7C5E" opacity="0.7"/><text x="550" y="100" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#6B7C5E">Gemini</text>
  <circle cx="300" cy="105" r="9" fill="#96845A" opacity="0.7"/><text x="300" y="95" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#96845A">Midjourney</text>
  <circle cx="200" cy="145" r="8" fill="#96845A" opacity="0.6"/><text x="200" y="135" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#96845A">Enterprise X</text>
  <circle cx="500" cy="160" r="8" fill="#96845A" opacity="0.5"/><text x="500" y="150" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#6B6960">Tool Y</text>
  <circle cx="350" cy="180" r="7" fill="#c0392b" opacity="0.4"/><text x="350" y="170" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#6B6960">Tool Z</text>
  <text x="450" y="250" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">R² = 0.12 — tools that are easy to use don't necessarily produce better output</text>
</svg>
