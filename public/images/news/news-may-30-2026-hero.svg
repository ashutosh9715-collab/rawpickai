  <rect x="100" y="310" width="230" height="120" rx="12" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="215" y="345" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#c0392b">Microsoft</text>
  <text x="215" y="373" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A453E">Canceled Claude Code</text>
  <text x="215" y="395" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">by June 30, 2026</text>
  <text x="215" y="415" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#c0392b">$500-2k/engineer/mo</text>
  <rect x="350" y="310" width="230" height="120" rx="12" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="465" y="345" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#96845A">Uber</text>
  <text x="465" y="373" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A453E">$3.4B AI budget</text>
  <text x="465" y="395" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">burned in 4 months</text>
  <text x="465" y="415" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#96845A">5,000 engineers affected</text>
  <rect x="600" y="310" width="230" height="120" rx="12" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="715" y="345" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#c0392b">Unknown company</text>
  <text x="715" y="373" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#c0392b">$500M</text>
  <text x="715" y="400" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Claude spend</text>
  <text x="715" y="418" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#c0392b">in a single month</text>
  <rect x="850" y="310" width="230" height="120" rx="12" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="965" y="345" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#4A5942">Microsoft Build</text>
  <text x="965" y="373" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A453E">Starts June 2-3</text>
  <text x="965" y="395" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">AI agents, Foundry</text>
  <text x="965" y="415" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#4A5942">No Windows 12</text>
  <text x="600" y="500" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#4A453E">Micron hits $1 trillion on AI chip demand. GitHub moves to usage-based billing June 1.</text>
  <text x="600" y="570" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#8A8577">rawpickai.com</text>
