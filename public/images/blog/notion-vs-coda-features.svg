<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #4A5942; }
      .label { font-size: 12px; fill: #3A3228; }
      .value { font-size: 11px; fill: #3A3228; }
      .track { fill: #DDD8CE; }
      .bar1 { fill: #6B7C5E; }
      .bar2 { fill: #96845A; }
    </style>
  </defs>

  <rect class="bg" width="900" height="450"/>

  <text class="header" x="40" y="35">Feature &amp; Pricing Matrix</text>

  <g>
    <text class="label" x="40" y="70" font-weight="600">Writing &amp; Content</text>
    <rect class="track" x="40" y="78" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="78" width="180" height="7" rx="3"/>
    <text class="value" x="250" y="87">Notion: 9/10</text>

    <rect class="track" x="40" y="92" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="92" width="110" height="7" rx="3"/>
    <text class="value" x="250" y="101">Coda: 5.5/10</text>
  </g>

  <g>
    <text class="label" x="40" y="135" font-weight="600">Data Analysis &amp; Formulas</text>
    <rect class="track" x="40" y="143" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="143" width="120" height="7" rx="3"/>
    <text class="value" x="250" y="152">Notion: 6/10</text>

    <rect class="track" x="40" y="157" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="157" width="200" height="7" rx="3"/>
    <text class="value" x="250" y="166">Coda: 10/10</text>
  </g>

  <g>
    <text class="label" x="40" y="200" font-weight="600">Knowledge Management</text>
    <rect class="track" x="40" y="208" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="208" width="200" height="7" rx="3"/>
    <text class="value" x="250" y="217">Notion: 10/10</text>

    <rect class="track" x="40" y="222" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="222" width="110" height="7" rx="3"/>
    <text class="value" x="250" y="231">Coda: 5.5/10</text>
  </g>

  <g>
    <text class="label" x="40" y="265" font-weight="600">Mobile Experience</text>
    <rect class="track" x="40" y="273" width="200" height="7" rx="3"/>
    <rect class="bar1" x="40" y="273" width="160" height="7" rx="3"/>
    <text class="value" x="250" y="282">Notion: 8/10 (strong)</text>

    <rect class="track" x="40" y="287" width="200" height="7" rx="3"/>
    <rect class="bar2" x="40" y="287" width="110" height="7" rx="3"/>
    <text class="value" x="250" y="296">Coda: 5.5/10 (desktop)</text>
  </g>

  <g>
    <text class="label" x="40" y="330" font-weight="600">Team of 20 Cost/Month</text>
    <rect class="bar1" x="40" y="345" width="100" height="40" rx="8"/>
    <text class="value" x="90" y="365" text-anchor="middle" fill="#F4F1EA" font-weight="600">$15</text>

    <rect class="bar2" x="240" y="345" width="100" height="40" rx="8"/>
    <text class="value" x="290" y="365" text-anchor="middle" fill="#F4F1EA" font-weight="600">$50</text>
  </g>

  <g>
    <text class="label" x="40" y="410" font-weight="600">Best For</text>
    <text class="value" x="40" y="430">Notion: Writers, wikis, knowledge teams | Coda: Operators, data, formula-heavy workflows</text>
  </g>
</svg>