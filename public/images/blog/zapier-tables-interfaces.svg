<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 155" width="1200" height="207">
  <rect width="900" height="155" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#96845A" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Zapier Tables vs Interfaces: Built-In Tools</text>
  <rect x="40" y="55" width="400" height="80" rx="8" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="240" y="78" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#4A5942">Zapier Tables</text>
  <text x="240" y="100" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Built-in database. Replaces Airtable</text>
  <text x="240" y="120" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">for simple data storage needs</text>
  <rect x="460" y="55" width="400" height="80" rx="8" fill="white" stroke="#6B7C5E" stroke-width="1.5"/>
  <text x="660" y="78" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#6B7C5E">Zapier Interfaces</text>
  <text x="660" y="100" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Form builder. Triggers Zaps directly</text>
  <text x="660" y="120" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Replaces Typeform for simple forms</text>
  <text x="450" y="148" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Both are included in Professional and Team plans. Neither replaces dedicated tools for complex needs.</text>
</svg>
