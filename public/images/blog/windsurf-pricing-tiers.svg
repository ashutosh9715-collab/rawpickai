<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 600; fill: #4A5942; }
      .tier-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #4A5942; }
      .price { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 700; fill: #3A3228; }
      .inr { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 500; fill: #8A8577; }
      .feature-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #3A3228; }
      .feature-muted { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #8A8577; }
      .tier-card { fill: #FFFFFF; stroke: #DDD8CE; stroke-width: 1.5; }
      .tier-highlight { fill: #F0EDE5; stroke: #6B7C5E; stroke-width: 2; }
      .checkmark { fill: #6B7C5E; }
      .muted { fill: #8A8577; }
    </style>
  </defs>

  <rect class="bg" width="900" height="500" rx="12"/>

  <!-- Header -->
  <text class="heading" x="40" y="45">Windsurf Pricing Tiers 2026</text>
  <text class="muted" x="40" y="65" font-size="12">Choose your plan  -  annual billing saves $2 (≈₹180)</text>

  <!-- Free Tier Card -->
  <rect class="tier-card" x="40" y="90" width="260" height="390" rx="12"/>
  <rect x="40" y="90" width="260" height="1" fill="#DDD8CE"/>
  <text class="tier-title" x="60" y="125">Free</text>
  <text class="price" x="60" y="160">$0</text>
  <text class="inr" x="60" y="178">$0/month</text>

  <!-- Free Features -->
  <circle cx="60" cy="210" r="4" class="checkmark"/>
  <text class="feature-text" x="80" y="215">Unlimited autocomplete</text>
  <circle cx="60" cy="235" r="4" class="checkmark"/>
  <text class="feature-text" x="80" y="240">42% acceptance rate</text>
  <circle cx="60" cy="260" r="4" class="checkmark"/>
  <text class="feature-text" x="80" y="265">Multi-file context</text>
  <circle cx="60" cy="285" r="4" class="checkmark"/>
  <text class="feature-text" x="80" y="290">Basic agent access</text>
  <circle cx="60" cy="310" r="4" fill="#DDD8CE"/>
  <text class="feature-muted" x="80" y="315">Priority features</text>
  <circle cx="60" cy="335" r="4" fill="#DDD8CE"/>
  <text class="feature-muted" x="80" y="340">Team features</text>

  <!-- Pro Tier Card (Highlighted) -->
  <rect class="tier-highlight" x="320" y="80" width="260" height="400" rx="12"/>
  <rect x="320" y="80" width="260" height="60" fill="#6B7C5E" rx="12"/>
  <text style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #F4F1EA;" x="340" y="100">MOST POPULAR</text>

  <text class="tier-title" x="340" y="150">Pro</text>
  <text class="price" x="340" y="185">$15</text>
  <text class="inr" x="340" y="203">≈$15/mo (≈₹1,395)nth</text>

  <!-- Pro Features -->
  <circle cx="340" cy="235" r="4" class="checkmark"/>
  <text class="feature-text" x="360" y="240">All Free features</text>
  <circle cx="340" cy="260" r="4" class="checkmark"/>
  <text class="feature-text" x="360" y="265">Full Cascade agent mode</text>
  <circle cx="340" cy="285" r="4" class="checkmark"/>
  <text class="feature-text" x="360" y="290">Enhanced completions</text>
  <circle cx="340" cy="310" r="4" class="checkmark"/>
  <text class="feature-text" x="360" y="315">Priority processing</text>
  <circle cx="340" cy="335" r="4" class="checkmark"/>
  <text class="feature-text" x="360" y="340">Advanced refactoring</text>
  <circle cx="340" cy="360" r="4" fill="#DDD8CE"/>
  <text class="feature-muted" x="360" y="365">Team collaboration</text>

  <!-- Team Tier Card -->
  <rect class="tier-card" x="600" y="90" width="260" height="390" rx="12"/>
  <rect x="600" y="90" width="260" height="1" fill="#DDD8CE"/>
  <text class="tier-title" x="620" y="125">Team</text>
  <text class="price" x="620" y="160">Custom</text>
  <text class="inr" x="620" y="178">Volume pricing</text>

  <!-- Team Features -->
  <circle cx="620" cy="210" r="4" class="checkmark"/>
  <text class="feature-text" x="640" y="215">All Pro features</text>
  <circle cx="620" cy="235" r="4" class="checkmark"/>
  <text class="feature-text" x="640" y="240">Team collaboration</text>
  <circle cx="620" cy="260" r="4" class="checkmark"/>
  <text class="feature-text" x="640" y="265">Admin controls</text>
  <circle cx="620" cy="285" r="4" class="checkmark"/>
  <text class="feature-text" x="640" y="290">Usage analytics</text>
  <circle cx="620" cy="310" r="4" class="checkmark"/>
  <text class="feature-text" x="640" y="315">Custom integration</text>
  <circle cx="620" cy="335" r="4" class="checkmark"/>
  <text class="feature-text" x="640" y="340">Priority support</text>

  <!-- Footer -->
  <text class="muted" x="40" y="490" font-size="11">Annual billing saves $2/year (≈₹180) on Pro tier  -  Pricing as of May 2026</text>
</svg>
