<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F1EA"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4A5942"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#96845A" letter-spacing="3">RAWPICKAI NEWS BRIEF</text>
  <text x="60" y="138" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#1A2416" letter-spacing="-1">Jury Tosses Musk's $134B Suit</text>
  <text x="60" y="186" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#1A2416" letter-spacing="-1">Against OpenAI in Under 2 Hours</text>
  <text x="60" y="234" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#4A5942" letter-spacing="-0.5">Google I/O 2026 Keynote Is Today</text>
  <line x1="60" y1="264" x2="320" y2="264" stroke="#4A5942" stroke-width="3"/>
  <text x="60" y="310" font-family="Georgia, serif" font-size="19" fill="#4A453E">Unanimous verdict: statute of limitations. Musk vows appeal.</text>
  <text x="60" y="340" font-family="Georgia, serif" font-size="19" fill="#4A453E">OpenAI's path to IPO just cleared a $134B obstacle.</text>
  <text x="60" y="370" font-family="Georgia, serif" font-size="19" fill="#4A453E">Google I/O keynote at 10 AM PT: Gemini, Android XR, Googlebooks.</text>
  <rect x="700" y="100" width="420" height="380" rx="16" fill="#4A5942" opacity="0.08"/>
  <text x="910" y="160" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#96845A">MUSK v. ALTMAN TIMELINE</text>
  <text x="780" y="200" font-family="Georgia, serif" font-size="13" fill="#4A453E">2015</text>
  <text x="1040" y="200" font-family="Georgia, serif" font-size="13" fill="#4A5942" text-anchor="end">OpenAI co-founded</text>
  <rect x="780" y="210" width="260" height="1" fill="#4A5942" opacity="0.15"/>
  <text x="780" y="238" font-family="Georgia, serif" font-size="13" fill="#4A453E">2018</text>
  <text x="1040" y="238" font-family="Georgia, serif" font-size="13" fill="#4A5942" text-anchor="end">Musk leaves board</text>
  <rect x="780" y="248" width="260" height="1" fill="#4A5942" opacity="0.15"/>
  <text x="780" y="276" font-family="Georgia, serif" font-size="13" fill="#4A453E">2023</text>
  <text x="1040" y="276" font-family="Georgia, serif" font-size="13" fill="#4A5942" text-anchor="end">Musk founds xAI</text>
  <rect x="780" y="286" width="260" height="1" fill="#4A5942" opacity="0.15"/>
  <text x="780" y="314" font-family="Georgia, serif" font-size="13" fill="#4A453E">2024</text>
  <text x="1040" y="314" font-family="Georgia, serif" font-size="13" fill="#4A5942" text-anchor="end">Lawsuit filed</text>
  <rect x="780" y="324" width="260" height="1" fill="#4A5942" opacity="0.15"/>
  <text x="780" y="352" font-family="Georgia, serif" font-size="13" fill="#4A453E">Apr 27, 2026</text>
  <text x="1040" y="352" font-family="Georgia, serif" font-size="13" fill="#4A5942" text-anchor="end">Trial begins (3 weeks)</text>
  <rect x="780" y="362" width="260" height="1" fill="#4A5942" opacity="0.15"/>
  <text x="780" y="390" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#1A2416">May 18, 2026</text>
  <text x="1040" y="390" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#c0392b" text-anchor="end">Jury rejects all claims</text>
  <rect x="780" y="410" width="260" height="1" fill="#4A5942" opacity="0.3"/>
  <text x="910" y="445" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#4A5942">Deliberation: &lt; 2 hours</text>
  <text x="910" y="468" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A453E">Verdict: Unanimous (9-0)</text>
  <text x="60" y="560" font-family="Georgia, serif" font-size="14" fill="#96845A">May 19, 2026</text>
  <text x="60" y="585" font-family="Georgia, serif" font-size="12" fill="#8A8577">rawpickai.com/news</text>
</svg>
