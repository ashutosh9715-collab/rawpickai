<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150">
  <rect width="900" height="150" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#96845A" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Telegram AI Bots: Messaging as the Next AI Interface</text>
  <rect x="60" y="55" width="250" height="70" rx="10" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="185" y="82" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#4A5942">What it does</text>
  <text x="185" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">AI bots read, filter, and reply</text>
  <text x="185" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">to messages on your behalf</text>
  <rect x="340" y="55" width="250" height="70" rx="10" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="465" y="82" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#96845A">Why it matters</text>
  <text x="465" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Messaging apps becoming</text>
  <text x="465" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">AI agent platforms</text>
  <rect x="620" y="55" width="250" height="70" rx="10" fill="white" stroke="#6B7C5E" stroke-width="1.5"/>
  <text x="745" y="82" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#6B7C5E">The pattern</text>
  <text x="745" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Google Spark, ChatGPT agents,</text>
  <text x="745" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">now Telegram: agents everywhere</text>
  <text x="450" y="143" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Source: Telegram blog, May 2026</text>
</svg>
