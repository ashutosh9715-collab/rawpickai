<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="480" rx="12" fill="#F4F1EA"/>

  <!-- Header -->
  <text x="400" y="40" fill="#1A2416" font-size="18" font-weight="700" text-anchor="middle">Project Glasswing</text>
  <text x="400" y="62" fill="#8b8fa3" font-size="13" text-anchor="middle">11 launch partners securing critical global infrastructure with Claude Mythos</text>

  <!-- Anthropic center badge -->
  <rect x="300" y="82" width="200" height="38" rx="19" fill="#c97b3a"/>
  <text x="400" y="106" fill="#1A2416" font-size="14" font-weight="700" text-anchor="middle">Anthropic</text>

  <!-- Connecting line -->
  <line x1="400" y1="120" x2="400" y2="148" stroke="#2a2e3d" stroke-width="2"/>

  <!-- Row 1: 4 partners -->
  <rect x="40" y="148" width="164" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="122" y="172" fill="#c4c7d4" font-size="11" text-anchor="middle">Amazon</text>
  <text x="122" y="190" fill="#5a5e72" font-size="10" text-anchor="middle">Web Services</text>

  <rect x="222" y="148" width="164" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="304" y="180" fill="#c4c7d4" font-size="11" text-anchor="middle">Apple</text>

  <rect x="404" y="148" width="164" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="486" y="180" fill="#c4c7d4" font-size="11" text-anchor="middle">Microsoft</text>

  <rect x="586" y="148" width="174" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="673" y="180" fill="#c4c7d4" font-size="11" text-anchor="middle">Google</text>

  <!-- Row 2: 4 partners -->
  <rect x="40" y="220" width="164" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="122" y="252" fill="#c4c7d4" font-size="11" text-anchor="middle">Nvidia</text>

  <rect x="222" y="220" width="164" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="304" y="252" fill="#c4c7d4" font-size="11" text-anchor="middle">CrowdStrike</text>

  <rect x="404" y="220" width="164" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="486" y="246" fill="#c4c7d4" font-size="11" text-anchor="middle">Palo Alto</text>
  <text x="486" y="260" fill="#5a5e72" font-size="10" text-anchor="middle">Networks</text>

  <rect x="586" y="220" width="174" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="673" y="252" fill="#c4c7d4" font-size="11" text-anchor="middle">Cisco</text>

  <!-- Row 3: 3 partners -->
  <rect x="130" y="292" width="164" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="212" y="324" fill="#c4c7d4" font-size="11" text-anchor="middle">Broadcom</text>

  <rect x="312" y="292" width="176" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="400" y="318" fill="#c4c7d4" font-size="11" text-anchor="middle">JPMorgan</text>
  <text x="400" y="334" fill="#5a5e72" font-size="10" text-anchor="middle">Chase</text>

  <rect x="506" y="292" width="164" height="56" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="588" y="318" fill="#c4c7d4" font-size="11" text-anchor="middle">Linux</text>
  <text x="588" y="334" fill="#5a5e72" font-size="10" text-anchor="middle">Foundation</text>

  <!-- 40+ additional -->
  <line x1="150" y1="370" x2="650" y2="370" stroke="#2a2e3d" stroke-width="1"/>
  <rect x="250" y="384" width="300" height="40" rx="20" fill="#1a1d2a" stroke="#c97b3a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="400" y="409" fill="#c97b3a" font-size="12" font-weight="600" text-anchor="middle">+ 40 additional organizations</text>

  <!-- Commitments -->
  <text x="200" y="455" fill="#c97b3a" font-size="22" font-weight="700" text-anchor="middle">$100M</text>
  <text x="200" y="472" fill="#5a5e72" font-size="11" text-anchor="middle">usage credits committed</text>

  <text x="600" y="455" fill="#c97b3a" font-size="22" font-weight="700" text-anchor="middle">$4M</text>
  <text x="600" y="472" fill="#5a5e72" font-size="11" text-anchor="middle">open-source security donations</text>

</svg>
