<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <rect width="900" height="160" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#96845A" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Two AI Companies, Two Approaches to Data</text>
  <rect x="60" y="55" width="380" height="80" rx="10" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="250" y="80" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#c0392b">Meta: Train AI on employees</text>
  <text x="250" y="100" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Monitor keystrokes, screenshots, code</text>
  <text x="250" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Then lay off the people you monitored</text>
  <rect x="470" y="55" width="380" height="80" rx="10" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="660" y="80" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#4A5942">Anthropic: Use AI to improve AI</text>
  <text x="660" y="100" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Karpathy's team: Claude training Claude</text>
  <text x="660" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Hire researchers, don't surveil them</text>
  <text x="450" y="152" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Same week: Meta fires 8,000 after tracking them. Anthropic hires Karpathy to build with trust.</text>
</svg>
