  <text x="390" y="165" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#22c55e">7 providers</text>
  <text x="570" y="165" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">OpenAI + Claude</text>
  <text x="750" y="165" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">OpenAI mainly</text>
  <rect x="40" y="177" width="820" height="26" fill="#F9F7F2" rx="3"/>
  <text x="180" y="195" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">App integrations</text>
  <text x="390" y="195" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Growing</text>
