<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="680" height="420" rx="12" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#4A5942">Which Model Should You Use?</text>
  <text x="340" y="48" text-anchor="middle" font-size="12" fill="#8A8577">Decision guide for Composer 2.5 vs alternatives</text>

  <!-- Start node -->
  <rect x="240" y="64" width="200" height="36" rx="18" fill="#4A5942"/>
  <text x="340" y="87" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F1EA">Using Cursor as main IDE?</text>

  <!-- Arrow down from start -->
  <line x1="340" y1="100" x2="340" y2="120" stroke="#8A8577" stroke-width="1.5"/>

  <!-- Q2 node -->
  <rect x="210" y="120" width="260" height="36" rx="18" fill="#6B7C5E"/>
  <text x="340" y="143" text-anchor="middle" font-size="12" font-weight="600" fill="#F4F1EA">Main use: agentic coding sessions?</text>

  <!-- Yes branch - left -->
  <line x1="210" y1="138" x2="110" y2="138" stroke="#8A8577" stroke-width="1.5"/>
  <line x1="110" y1="138" x2="110" y2="198" stroke="#8A8577" stroke-width="1.5"/>
  <text x="155" y="130" text-anchor="middle" font-size="10" fill="#8A8577">Yes</text>

  <!-- Left result: Composer 2.5 Standard -->
  <rect x="30" y="198" width="160" height="50" rx="10" fill="#6B7C5E"/>
  <text x="110" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1EA">Composer 2.5</text>
  <text x="110" y="233" text-anchor="middle" font-size="11" fill="#F4F1EA">Standard tier</text>
  <text x="110" y="247" text-anchor="middle" font-size="10" fill="#DDD8CE">$0.50/$2.50 per M</text>

  <!-- No / right branch from Q2 -->
  <line x1="470" y1="138" x2="560" y2="138" stroke="#8A8577" stroke-width="1.5"/>
  <line x1="560" y1="138" x2="560" y2="198" stroke="#8A8577" stroke-width="1.5"/>
  <text x="510" y="130" text-anchor="middle" font-size="10" fill="#8A8577">No</text>

  <!-- Q3: terminal/shell heavy? -->
  <rect x="490" y="198" width="160" height="50" rx="10" fill="#96845A"/>
  <text x="570" y="215" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1EA">Terminal/shell</text>
  <text x="570" y="230" text-anchor="middle" font-size="11" fill="#F4F1EA">heavy workflows?</text>

  <!-- Yes from Q3 - down -->
  <line x1="570" y1="248" x2="570" y2="300" stroke="#8A8577" stroke-width="1.5"/>
  <text x="580" y="278" font-size="10" fill="#8A8577">Yes</text>
  <rect x="490" y="300" width="160" height="50" rx="10" fill="#96845A"/>
  <text x="570" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1EA">GPT-5.5</text>
  <text x="570" y="335" text-anchor="middle" font-size="11" fill="#F4F1EA">via Codex</text>
  <text x="570" y="349" text-anchor="middle" font-size="10" fill="#DDD8CE">82.7% Terminal-Bench</text>

  <!-- No from Q3 - left to middle result -->
  <line x1="490" y1="223" x2="350" y2="223" stroke="#8A8577" stroke-width="1.5"/>
  <line x1="350" y1="223" x2="350" y2="300" stroke="#8A8577" stroke-width="1.5"/>
  <text x="415" y="216" text-anchor="middle" font-size="10" fill="#8A8577">No</text>
  <rect x="250" y="300" width="200" height="50" rx="10" fill="#6B7C5E"/>
  <text x="350" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1EA">Composer 2.5 Fast</text>
  <text x="350" y="335" text-anchor="middle" font-size="11" fill="#F4F1EA">interactive mode</text>
  <text x="350" y="349" text-anchor="middle" font-size="10" fill="#DDD8CE">$3.00/$15.00 per M</text>

  <!-- NOT using Cursor at all - from start node top-left -->
  <line x1="240" y1="82" x2="110" y2="82" stroke="#8A8577" stroke-width="1.5"/>
  <line x1="110" y1="82" x2="110" y2="128" stroke="#8A8577" stroke-width="1.5"/>
  <text x="168" y="72" text-anchor="middle" font-size="10" fill="#8A8577">Not using Cursor</text>

  <rect x="30" y="128" width="160" height="50" rx="10" fill="#8A8577"/>
  <text x="110" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1EA">Claude Sonnet 4.6</text>
  <text x="110" y="163" text-anchor="middle" font-size="11" fill="#F4F1EA">or Claude Opus 4.7</text>
  <text x="110" y="177" text-anchor="middle" font-size="10" fill="#DDD8CE">works any environment</text>

  <!-- Footer note -->
  <text x="340" y="392" text-anchor="middle" font-size="11" fill="#8A8577">Composer 2.5 is Cursor-only. Claude Sonnet/Opus</text>
  <text x="340" y="408" text-anchor="middle" font-size="11" fill="#8A8577">available via API in any editor. rawpickai.com</text>
</svg>
