<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #4A5942; }
      .tier-name { font-size: 14px; font-weight: bold; fill: #3A3228; }
      .price { font-size: 16px; font-weight: bold; fill: #96845A; }
      .credits { font-size: 12px; fill: #3A3228; }
      .description { font-size: 11px; fill: #8A8577; }
      .bar-bg { fill: #DDD8CE; }
      .bar-fill { fill: #6B7C5E; }
      .bar-secondary { fill: #96845A; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">Descript Pricing Tiers</text>
  <text x="400" y="48" text-anchor="middle" class="description">Monthly costs for podcasters and video creators</text>

  <!-- Free Tier -->
  <g>
    <rect x="20" y="70" width="170" height="300" fill="white" stroke="#DDD8CE" stroke-width="2" rx="8"/>
    <text x="105" y="100" text-anchor="middle" class="tier-name">Free</text>
    <text x="105" y="125" text-anchor="middle" class="price">$0</text>
    <text x="105" y="145" text-anchor="middle" class="credits">(₹0)</text>
    <rect x="35" y="160" width="140" height="8" rx="4" class="bar-bg"/>
    <rect x="35" y="160" width="14" height="8" rx="4" class="bar-secondary"/>
    <text x="105" y="185" text-anchor="middle" class="credits">1 project</text>
    <text x="105" y="205" text-anchor="middle" class="description" style="font-size: 10px;">10 min/month</text>
    <text x="105" y="220" text-anchor="middle" class="description" style="font-size: 9px;">Testing only</text>
  </g>

  <!-- Hobbyist Tier -->
  <g>
    <rect x="215" y="70" width="170" height="300" fill="white" stroke="#DDD8CE" stroke-width="2" rx="8"/>
    <text x="300" y="100" text-anchor="middle" class="tier-name">Hobbyist</text>
    <text x="300" y="125" text-anchor="middle" class="price">$16/mo</text>
    <text x="300" y="145" text-anchor="middle" class="credits">(≈₹1,488)</text>
    <rect x="230" y="160" width="140" height="8" rx="4" class="bar-bg"/>
    <rect x="230" y="160" width="70" height="8" rx="4" class="bar-fill"/>
    <text x="300" y="185" text-anchor="middle" class="credits">10 projects</text>
    <text x="300" y="205" text-anchor="middle" class="description" style="font-size: 10px;">Unlimited trans.</text>
    <text x="300" y="220" text-anchor="middle" class="description" style="font-size: 9px;">Skip this tier</text>
  </g>

  <!-- Creator Tier - RECOMMENDED -->
  <g>
    <rect x="410" y="70" width="170" height="300" fill="white" stroke="#96845A" stroke-width="3" rx="8"/>
    <!-- Badge -->
    <rect x="440" y="55" width="110" height="20" fill="#96845A" rx="4"/>
    <text x="495" y="67" text-anchor="middle" class="description" style="fill: white; font-weight: bold; font-size: 10px;">RECOMMENDED</text>

    <text x="495" y="100" text-anchor="middle" class="tier-name">Creator</text>
    <text x="495" y="125" text-anchor="middle" class="price">$24/mo</text>
    <text x="495" y="145" text-anchor="middle" class="credits">(≈₹2,232)</text>
    <rect x="425" y="160" width="140" height="8" rx="4" class="bar-bg"/>
    <rect x="425" y="160" width="140" height="8" rx="4" class="bar-secondary"/>
    <text x="495" y="185" text-anchor="middle" class="credits">Unlimited</text>
    <text x="495" y="205" text-anchor="middle" class="description" style="font-size: 10px;">Studio Sound +</text>
    <text x="495" y="220" text-anchor="middle" class="description" style="font-size: 9px;">Overdub</text>
  </g>

  <!-- Business Tier -->
  <g>
    <rect x="605" y="70" width="170" height="300" fill="white" stroke="#DDD8CE" stroke-width="2" rx="8"/>
    <text x="690" y="100" text-anchor="middle" class="tier-name">Business</text>
    <text x="690" y="125" text-anchor="middle" class="price">$50/mo</text>
    <text x="690" y="145" text-anchor="middle" class="credits">(≈₹4,650)</text>
    <rect x="620" y="160" width="140" height="8" rx="4" class="bar-bg"/>
    <rect x="620" y="160" width="140" height="8" rx="4" class="bar-fill"/>
    <text x="690" y="185" text-anchor="middle" class="credits">Unlimited</text>
    <text x="690" y="205" text-anchor="middle" class="description" style="font-size: 10px;">Team features +</text>
    <text x="690" y="220" text-anchor="middle" class="description" style="font-size: 9px;">Priority support</text>
  </g>

  <!-- Footer note -->
  <text x="400" y="400" text-anchor="middle" class="description">Creator tier is the obvious choice for solo podcasters and YouTubers. Hobbyist sits awkwardly between Free and Creator - skip it.</text>
  <text x="400" y="420" text-anchor="middle" class="description">Business tier adds team collaboration and priority support. Only justified if multiple people are editing together.</text>
  <text x="400" y="440" text-anchor="middle" class="description">Conversion at ₹93/USD | Updated May 2026</text>
</svg>