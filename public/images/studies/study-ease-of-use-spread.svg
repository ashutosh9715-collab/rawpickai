<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <rect width="900" height="220" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Ease of Use — The Widest Spread (40 to 95)</text>
  <text x="100" y="75" font-family="Georgia, serif" font-size="12" fill="#6B6960">40</text>
  <text x="820" y="75" font-family="Georgia, serif" font-size="12" fill="#6B6960">95</text>
  <rect x="100" y="85" width="720" height="30" rx="6" fill="#E8E6E0"/>
  <rect x="100" y="85" width="720" height="30" rx="6" fill="url(#easeGrad)"/>
  <defs><linearGradient id="easeGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c0392b" stop-opacity="0.4"/><stop offset="50%" stop-color="#96845A" stop-opacity="0.5"/><stop offset="100%" stop-color="#4A5942" stop-opacity="0.6"/></linearGradient></defs>
  <circle cx="100" cy="100" r="8" fill="#c0392b"/><text x="100" y="140" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#c0392b">Lowest: 40</text><text x="100" y="155" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#6B6960">(Enterprise tools)</text>
  <circle cx="520" cy="100" r="10" fill="#96845A" stroke="white" stroke-width="2"/><text x="520" y="140" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#96845A">Median: 75</text>
  <circle cx="820" cy="100" r="8" fill="#4A5942"/><text x="820" y="140" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#4A5942">Highest: 95</text><text x="820" y="155" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#6B6960">(NotebookLM)</text>
  <text x="450" y="185" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">55-point spread — widest gap of any scoring dimension. Ease of use predicts adoption more than output quality.</text>
  <text x="450" y="210" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Source: RawPickAI 2026 Study</text>
</svg>
