<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 28px; font-weight: 600; fill: #4A5942; }
      .subheading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #8A8577; }
      .tool-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; font-weight: 600; fill: #3A3228; }
      .metric-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; fill: #3A3228; }
      .value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #8A8577; }
      .bar-bg { fill: #DDD8CE; }
      .bar1 { fill: #6B7C5E; }
      .bar2 { fill: #96845A; }
      .bar3 { fill: #A89F8F; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="600" rx="12"/>

  <!-- Header -->
  <text class="heading" x="40" y="50">Ideogram vs Midjourney vs DALL-E 3</text>
  <text class="subheading" x="40" y="70">Text accuracy, quality, and best-fit comparison</text>

  <!-- Text Rendering -->
  <text class="metric-label" x="40" y="115">Text Rendering Accuracy</text>
  <rect class="bar-bg" x="150" y="105" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="105" width="180" height="16" rx="6"/>
  <text class="value" x="360" y="115">Ideogram: 85-90%</text>

  <rect class="bar-bg" x="550" y="105" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="105" width="30" height="16" rx="6"/>
  <text class="value" x="760" y="115">Midjourney: 5-10%</text>

  <rect class="bar-bg" x="150" y="130" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="130" width="50" height="16" rx="6"/>
  <text class="value" x="360" y="140">DALL-E 3: 15-20%</text>

  <!-- Photorealism -->
  <text class="metric-label" x="40" y="180">Photorealism</text>
  <rect class="bar-bg" x="150" y="170" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="170" width="140" height="16" rx="6"/>
  <text class="value" x="360" y="180">Ideogram: 70%</text>

  <rect class="bar-bg" x="550" y="170" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="170" width="200" height="16" rx="6"/>
  <text class="value" x="760" y="180">Midjourney: 100%</text>

  <rect class="bar-bg" x="150" y="195" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="195" width="180" height="16" rx="6"/>
  <text class="value" x="360" y="205">DALL-E 3: 90%</text>

  <!-- Artistic Quality -->
  <text class="metric-label" x="40" y="245">Artistic Quality</text>
  <rect class="bar-bg" x="150" y="235" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="235" width="120" height="16" rx="6"/>
  <text class="value" x="360" y="245">Ideogram: 60%</text>

  <rect class="bar-bg" x="550" y="235" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="235" width="200" height="16" rx="6"/>
  <text class="value" x="760" y="245">Midjourney: 100%</text>

  <rect class="bar-bg" x="150" y="260" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="260" width="160" height="16" rx="6"/>
  <text class="value" x="360" y="270">DALL-E 3: 80%</text>

  <!-- Monthly Cost -->
  <text class="metric-label" x="40" y="310">Monthly Cost</text>
  <text class="value" x="150" y="320">Ideogram</text>
  <rect class="bar-bg" x="150" y="300" width="200" height="16" rx="6"/>
  <rect class="bar1" x="150" y="300" width="140" height="16" rx="6"/>
  <text class="value" x="360" y="310">≈₹1,395</text>

  <text class="value" x="550" y="320">Midjourney</text>
  <rect class="bar-bg" x="550" y="300" width="200" height="16" rx="6"/>
  <rect class="bar2" x="550" y="300" width="170" height="16" rx="6"/>
  <text class="value" x="760" y="310">≈₹1,860</text>

  <text class="value" x="150" y="345">DALL-E 3</text>
  <rect class="bar-bg" x="150" y="325" width="200" height="16" rx="6"/>
  <rect class="bar3" x="150" y="325" width="165" height="16" rx="6"/>
  <text class="value" x="360" y="335">≈₹1,860</text>

  <!-- Use Case Recommendations -->
  <text class="metric-label" x="40" y="385">Best for</text>

  <!-- Ideogram Box -->
  <rect x="40" y="400" width="280" height="180" fill="#FFF9F5" stroke="#6B7C5E" stroke-width="2" rx="10"/>
  <text class="tool-name" x="60" y="425" style="fill: #6B7C5E;">✓ Ideogram</text>
  <text class="value" x="60" y="448">• Text rendering</text>
  <text class="value" x="60" y="468">• Social graphics</text>
  <text class="value" x="60" y="488">• Marketing banners</text>
  <text class="value" x="60" y="508">• Email headers</text>
  <text class="value" x="60" y="528">• Ad creatives</text>
  <text class="value" x="60" y="548">• Quick iteration</text>
  <text class="value" x="60" y="568">• Budget-conscious</text>

  <!-- Midjourney Box -->
  <rect x="360" y="400" width="280" height="180" fill="#FFF9F5" stroke="#96845A" stroke-width="2" rx="10"/>
  <text class="tool-name" x="380" y="425" style="fill: #96845A;">✓ Midjourney</text>
  <text class="value" x="380" y="448">• Fine art</text>
  <text class="value" x="380" y="468">• Photorealism</text>
  <text class="value" x="380" y="488">• Portfolio work</text>
  <text class="value" x="380" y="508">• Editorial</text>
  <text class="value" x="380" y="528">• Sophisticated color</text>
  <text class="value" x="380" y="548">• Complex composition</text>
  <text class="value" x="380" y="568">• Premium aesthetic</text>

  <!-- DALL-E 3 Box -->
  <rect x="680" y="400" width="280" height="180" fill="#FFF9F5" stroke="#A89F8F" stroke-width="2" rx="10"/>
  <text class="tool-name" x="700" y="425" style="fill: #A89F8F;">✓ DALL-E 3</text>
  <text class="value" x="700" y="448">• High quality</text>
  <text class="value" x="700" y="468">• ChatGPT integration</text>
  <text class="value" x="700" y="488">• Editing tools</text>
  <text class="value" x="700" y="508">• Inpainting</text>
  <text class="value" x="700" y="528">• General purpose</text>
  <text class="value" x="700" y="548">• Iterative refinement</text>
  <text class="value" x="700" y="568">• API available</text>
</svg>