<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="360" rx="12" fill="#F4F1EA"/>

  <text x="40" y="38" fill="#3A3228" font-size="18" font-weight="700">What I Got Wrong About Bolt.new</text>
  <text x="40" y="58" fill="#8A8577" font-size="13">My assumptions vs reality after testing</text>

  <!-- Table header -->
  <rect x="40" y="76" width="340" height="32" rx="6" fill="#96845A"/>
  <text x="60" y="97" fill="#F4F1EA" font-size="12" font-weight="600">What I Expected</text>
  <rect x="380" y="76" width="380" height="32" rx="6" fill="#6B7C5E"/>
  <text x="400" y="97" fill="#F4F1EA" font-size="12" font-weight="600">What Actually Happened</text>

  <!-- Row 1 -->
  <rect x="40" y="112" width="340" height="44" fill="#FFFFFF" opacity="0.5"/>
  <rect x="380" y="112" width="380" height="44" fill="#FFFFFF" opacity="0.3"/>
  <text x="60" y="131" fill="#3A3228" font-size="12">WebContainers are a gimmick</text>
  <text x="60" y="147" fill="#8A8577" font-size="10">Browser runtime? Sounds like a toy</text>
  <text x="400" y="131" fill="#3A3228" font-size="12" font-weight="600">Performance is surprisingly good</text>
  <text x="400" y="147" fill="#8A8577" font-size="10">Fast installs, responsive dev server</text>

  <!-- Row 2 -->
  <rect x="40" y="156" width="340" height="44" fill="#FFFFFF" opacity="0.3"/>
  <rect x="380" y="156" width="380" height="44" fill="#FFFFFF" opacity="0.5"/>
  <text x="60" y="175" fill="#3A3228" font-size="12">Terrible for full-stack apps</text>
  <text x="60" y="191" fill="#8A8577" font-size="10">No auto-backend = no full-stack</text>
  <text x="400" y="175" fill="#3A3228" font-size="12" font-weight="600">Best of 3 tools on hardest test</text>
  <text x="400" y="191" fill="#8A8577" font-size="10">Multi-step form worked in 5 prompts</text>

  <!-- Row 3 -->
  <rect x="40" y="200" width="340" height="44" fill="#FFFFFF" opacity="0.5"/>
  <rect x="380" y="200" width="380" height="44" fill="#FFFFFF" opacity="0.3"/>
  <text x="60" y="219" fill="#3A3228" font-size="12">Free tier is enough to evaluate</text>
  <text x="60" y="235" fill="#8A8577" font-size="10">Should work for a test run</text>
  <text x="400" y="219" fill="#3A3228" font-size="12" font-weight="600">Burns out in 20 minutes</text>
  <text x="400" y="235" fill="#8A8577" font-size="10">Need Pro to seriously evaluate</text>

  <!-- Row 4 -->
  <rect x="40" y="244" width="340" height="44" fill="#FFFFFF" opacity="0.3"/>
  <rect x="380" y="244" width="380" height="44" fill="#FFFFFF" opacity="0.5"/>
  <text x="60" y="263" fill="#3A3228" font-size="12">Speed is overrated</text>
  <text x="60" y="279" fill="#8A8577" font-size="10">A few seconds don't matter</text>
  <text x="400" y="263" fill="#3A3228" font-size="12" font-weight="600">Speed changes the workflow</text>
  <text x="400" y="279" fill="#8A8577" font-size="10">Sub-15s feedback = flow state</text>

  <!-- Row 5 -->
  <rect x="40" y="288" width="340" height="44" fill="#FFFFFF" opacity="0.5"/>
  <rect x="380" y="288" width="380" height="44" fill="#FFFFFF" opacity="0.3"/>
  <text x="60" y="307" fill="#3A3228" font-size="12">Memory won't be an issue</text>
  <text x="60" y="323" fill="#8A8577" font-size="10">Modern browsers handle it</text>
  <text x="400" y="307" fill="#3A3228" font-size="12" font-weight="600">2 tab crashes in one session</text>
  <text x="400" y="323" fill="#8A8577" font-size="10">16 GB RAM minimum recommended</text>

  <!-- Footer -->
  <text x="40" y="352" fill="#8A8577" font-size="11">Owning mistakes is part of honest reviewing - rawpickai.com</text>
</svg>