<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150">
  <rect width="900" height="150" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">The Honesty Angle: What "4x Fewer Missed Flaws" Means in Practice</text>
  <rect x="60" y="55" width="380" height="70" rx="8" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="250" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#c0392b">Opus 4.7 problem</text>
  <text x="250" y="100" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Comment verbosity, missed tool calls,</text>
  <text x="250" y="116" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">unsupported claims about code quality</text>
  <rect x="470" y="55" width="380" height="70" rx="8" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="660" y="80" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4A5942">Opus 4.8 fix</text>
  <text x="660" y="100" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">4x less likely to miss flaws in its own code,</text>
  <text x="660" y="116" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A5942">flags uncertainties, cleaner tool use</text>
  <text x="450" y="143" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Devin (Cognition): "Fixes comment-verbosity and tool-calling issues we saw with 4.7. Noticeably better signal-to-noise ratio."</text>
</svg>
