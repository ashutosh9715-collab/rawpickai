  <text x="745" y="128" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Image, audio, video, text in</text>
  <text x="745" y="146" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Video output grounded in reality</text>
  <text x="745" y="173" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#22c55e">Available today</text>
  <text x="450" y="230" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Source: Google I/O 2026 keynote, May 19, 2026</text>
