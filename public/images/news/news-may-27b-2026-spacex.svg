  <text x="357" y="118" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Goldman Sachs lead</text>
  <rect x="470" y="55" width="185" height="75" rx="8" fill="white" stroke="#4A5942" stroke-width="2"/>
