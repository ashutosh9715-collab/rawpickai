<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --bg: #F4F1EA;
        --heading: #4A5942;
        --bar1: #6B7C5E;
        --bar2: #96845A;
        --body: #3A3228;
        --muted: #8A8577;
        --track: #DDD8CE;
      }
      body { background: var(--bg); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#F4F1EA" rx="12"/>

  <!-- Title -->
  <text x="40" y="35" font-size="24" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    Grammarly 2026: Review Scores
  </text>

  <!-- Legend -->
  <text x="40" y="65" font-size="13" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">
    Based on 3 weeks of testing across 100+ writing samples
  </text>

  <!-- Bar 1: Ease of Use -->
  <text x="40" y="110" font-size="14" font-weight="600" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    Ease of Use
  </text>
  <rect x="40" y="120" width="450" height="24" fill="#DDD8CE" rx="6"/>
  <rect x="40" y="120" width="405" height="24" fill="#6B7C5E" rx="6"/>
  <text x="460" y="137" font-size="13" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    90/100
  </text>

  <!-- Bar 2: Output Quality -->
  <text x="40" y="170" font-size="14" font-weight="600" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    Output Quality
  </text>
  <rect x="40" y="180" width="450" height="24" fill="#DDD8CE" rx="6"/>
  <rect x="40" y="180" width="360" height="24" fill="#96845A" rx="6"/>
  <text x="460" y="197" font-size="13" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    80/100
  </text>

  <!-- Bar 3: Value for Money -->
  <text x="40" y="230" font-size="14" font-weight="600" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    Value for Money
  </text>
  <rect x="40" y="240" width="450" height="24" fill="#DDD8CE" rx="6"/>
  <rect x="40" y="240" width="342" height="24" fill="#6B7C5E" rx="6"/>
  <text x="460" y="257" font-size="13" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    76/100
  </text>

  <!-- Bar 4: Feature Depth -->
  <text x="40" y="290" font-size="14" font-weight="600" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    Feature Depth
  </text>
  <rect x="40" y="300" width="450" height="24" fill="#DDD8CE" rx="6"/>
  <rect x="40" y="300" width="378" height="24" fill="#96845A" rx="6"/>
  <text x="460" y="317" font-size="13" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    84/100
  </text>

  <!-- Bar 5: Free Tier -->
  <text x="40" y="350" font-size="14" font-weight="600" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    Free Tier Quality
  </text>
  <rect x="40" y="360" width="450" height="24" fill="#DDD8CE" rx="6"/>
  <rect x="40" y="360" width="387" height="24" fill="#6B7C5E" rx="6"/>
  <text x="460" y="377" font-size="13" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    86/100
  </text>
</svg>