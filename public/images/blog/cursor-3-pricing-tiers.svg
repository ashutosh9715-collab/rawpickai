<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="340" rx="12" fill="#F4F1EA"/>

  <text x="400" y="36" fill="#1A2416" font-size="18" font-weight="700" text-anchor="middle">Cursor 3 Pricing Plans (April 2026)</text>
  <text x="400" y="56" fill="#8b8fa3" font-size="13" text-anchor="middle">USD (≈₹93/USD)</text>

  <!-- Hobby -->
  <rect x="24" y="76" width="142" height="240" rx="10" fill="#1a1d2a" stroke="#2a2e3d" stroke-width="1"/>
  <text x="95" y="104" fill="#8b8fa3" font-size="11" font-weight="600" text-anchor="middle">HOBBY</text>
  <text x="95" y="136" fill="#1A2416" font-size="26" font-weight="700" text-anchor="middle">Free</text>
  <line x1="44" y1="156" x2="146" y2="156" stroke="#2a2e3d" stroke-width="1"/>
  <text x="95" y="178" fill="#5a5e72" font-size="10" text-anchor="middle">Limited agent requests</text>
  <text x="95" y="196" fill="#5a5e72" font-size="10" text-anchor="middle">Limited Tab completions</text>
  <text x="95" y="214" fill="#5a5e72" font-size="10" text-anchor="middle">Local agents only</text>
  <text x="95" y="232" fill="#5a5e72" font-size="10" text-anchor="middle">Basic models</text>

  <!-- Pro (highlighted) -->
  <rect x="180" y="70" width="148" height="252" rx="10" fill="#1a2a1f" stroke="#3a8c5e" stroke-width="2"/>
  <rect x="210" y="78" width="88" height="18" rx="9" fill="#3a8c5e"/>
  <text x="254" y="91" fill="#1A2416" font-size="9" font-weight="700" text-anchor="middle">BEST VALUE</text>
