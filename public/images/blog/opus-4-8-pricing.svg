  <text x="560" y="145" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A5942">≈₹9,300/mo</text>
  <text x="720" y="145" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#c0392b">$200/mo (Pro)</text>
  <rect x="40" y="159" width="820" height="32" fill="white" rx="3"/>
  <text x="185" y="181" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">API (input per M tokens)</text>
  <text x="400" y="181" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#22c55e">$5 (≈₹465)</text>
  <text x="560" y="181" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Same both tiers</text>
  <text x="720" y="181" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">$5 (≈₹465)</text>
  <rect x="40" y="195" width="820" height="32" fill="#F9F7F2" rx="3"/>
  <text x="185" y="217" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">API (output per M tokens)</text>
  <text x="400" y="217" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A5942">$25 (≈₹2,325)</text>
  <text x="560" y="217" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Same both tiers</text>
  <text x="720" y="217" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">$25 (≈₹2,325)</text>
