<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="340" rx="12" fill="#F4F1EA"/>

  <!-- Overall score ring -->
  <circle cx="120" cy="160" r="70" fill="none" stroke="#1a1d2a" stroke-width="10"/>
  <circle cx="120" cy="160" r="70" fill="none" stroke="#3a8c5e" stroke-width="10"
    stroke-dasharray="440" stroke-dashoffset="35" stroke-linecap="round"
    transform="rotate(-90 120 160)"/>
  <text x="120" y="152" fill="#1A2416" font-size="36" font-weight="700" text-anchor="middle">4.6</text>
  <text x="120" y="174" fill="#8b8fa3" font-size="14" text-anchor="middle">out of 5</text>
  <text x="120" y="260" fill="#3a8c5e" font-size="13" font-weight="600" text-anchor="middle">OVERALL SCORE</text>

  <!-- Score bars -->
  <!-- Free Tier: 95 -->
  <text x="260" y="62" fill="#c4c7d4" font-size="12" font-weight="500">Free Tier</text>
  <text x="740" y="62" fill="#1A2416" font-size="12" font-weight="700" text-anchor="end">95</text>
  <rect x="260" y="70" width="480" height="10" rx="5" fill="#1a1d2a"/>
  <rect x="260" y="70" width="456" height="10" rx="5" fill="#3a8c5e"/>

  <!-- Value for Money: 95 -->
  <text x="260" y="108" fill="#c4c7d4" font-size="12" font-weight="500">Value for Money</text>
  <text x="740" y="108" fill="#1A2416" font-size="12" font-weight="700" text-anchor="end">95</text>
  <rect x="260" y="116" width="480" height="10" rx="5" fill="#1a1d2a"/>
  <rect x="260" y="116" width="456" height="10" rx="5" fill="#3a8c5e"/>

  <!-- Ease of Use: 92 -->
  <text x="260" y="154" fill="#c4c7d4" font-size="12" font-weight="500">Ease of Use</text>
  <text x="740" y="154" fill="#1A2416" font-size="12" font-weight="700" text-anchor="end">92</text>
  <rect x="260" y="162" width="480" height="10" rx="5" fill="#1a1d2a"/>
  <rect x="260" y="162" width="442" height="10" rx="5" fill="#3a8c5e"/>

  <!-- Output Quality: 90 -->
  <text x="260" y="200" fill="#c4c7d4" font-size="12" font-weight="500">Output Quality</text>
  <text x="740" y="200" fill="#1A2416" font-size="12" font-weight="700" text-anchor="end">90</text>
  <rect x="260" y="208" width="480" height="10" rx="5" fill="#1a1d2a"/>
  <rect x="260" y="208" width="432" height="10" rx="5" fill="#3a8c5e"/>

  <!-- Feature Depth: 90 -->
  <text x="260" y="246" fill="#c4c7d4" font-size="12" font-weight="500">Feature Depth</text>
  <text x="740" y="246" fill="#1A2416" font-size="12" font-weight="700" text-anchor="end">90</text>
  <rect x="260" y="254" width="480" height="10" rx="5" fill="#1a1d2a"/>
  <rect x="260" y="254" width="432" height="10" rx="5" fill="#3a8c5e"/>

  <!-- Footer -->
  <text x="400" y="310" fill="#5a5e72" font-size="11" text-anchor="middle">NotebookLM Review  -  rawpickai.com</text>
</svg>
