  <text x="350" y="48" font-size="11" text-anchor="middle" fill="#8A8577">Head-to-head on key developer tasks</text>
  <text x="20" y="85" font-size="12" font-weight="700" fill="#3A3228">Task</text>
  <text x="350" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="#3A3228">Claude Code</text>
  <text x="580" y="85" font-size="12" font-weight="700" text-anchor="middle" fill="#3A3228">Cursor</text>
  <line x1="20" y1="95" x2="680" y2="95" stroke="#DDD8CE" stroke-width="1"/>
  <text x="20" y="118" font-size="11" fill="#3A3228">Complex refactoring</text>
  <text x="350" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Winner</text>
  <text x="580" y="118" font-size="11" text-anchor="middle" fill="#8A8577">Good</text>
  <line x1="20" y1="131" x2="680" y2="131" stroke="#DDD8CE" stroke-width="1"/>
  <text x="20" y="153" font-size="11" fill="#3A3228">Real-time autocomplete</text>
  <text x="350" y="153" font-size="11" text-anchor="middle" fill="#8A8577">N/A (terminal)</text>
  <text x="580" y="153" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Winner</text>
  <line x1="20" y1="166" x2="680" y2="166" stroke="#DDD8CE" stroke-width="1"/>
  <text x="20" y="188" font-size="11" fill="#3A3228">Bug investigation</text>
  <text x="350" y="188" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Winner</text>
  <text x="580" y="188" font-size="11" text-anchor="middle" fill="#8A8577">Good</text>
  <line x1="20" y1="201" x2="680" y2="201" stroke="#DDD8CE" stroke-width="1"/>
  <text x="20" y="223" font-size="11" fill="#3A3228">Quick code generation</text>
  <text x="350" y="223" font-size="11" text-anchor="middle" fill="#8A8577">Slower</text>
  <text x="580" y="223" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Winner</text>
  <line x1="20" y1="236" x2="680" y2="236" stroke="#DDD8CE" stroke-width="1"/>
  <text x="20" y="258" font-size="11" fill="#3A3228">Large codebase (10K+ lines)</text>
  <text x="350" y="258" font-size="12" font-weight="600" text-anchor="middle" fill="#4A5942">Winner</text>
  <text x="580" y="258" font-size="11" text-anchor="middle" fill="#8A8577">Good</text>
  <text x="350" y="278" font-size="10" text-anchor="middle" fill="#8A8577">Data from RawPickAI independent testing - rawpickai.com</text>
</svg>
