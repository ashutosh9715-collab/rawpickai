  <text x="170" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">quota fast on Pro plan</text>
  <rect x="320" y="55" width="260" height="80" rx="8" fill="white" stroke="#96845A" stroke-width="1.5"/>
