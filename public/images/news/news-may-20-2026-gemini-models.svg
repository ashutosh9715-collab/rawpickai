<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <rect width="900" height="240" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Google I/O 2026: New Gemini Models at a Glance</text>
  <rect x="60" y="55" width="250" height="150" rx="12" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="185" y="82" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4A5942">Gemini 3.5 Flash</text>
  <text x="185" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Beats 3.1 Pro on coding,</text>
  <text x="185" y="123" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">agentic, and multimodal tasks</text>
  <text x="185" y="150" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">4x faster output tokens/sec</text>
  <text x="185" y="173" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#22c55e">Available now</text>
  <text x="185" y="193" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Gemini app, API, Search</text>
  <rect x="340" y="55" width="250" height="150" rx="12" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="465" y="82" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#96845A">Gemini 3.5 Pro</text>
  <text x="465" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Currently in testing</text>
  <text x="465" y="128" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Details not yet released</text>
  <text x="465" y="173" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#f59e0b">Coming next month</text>
  <rect x="620" y="55" width="250" height="150" rx="12" fill="white" stroke="#6B7C5E" stroke-width="1.5"/>
  <text x="745" y="82" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#6B7C5E">Gemini Omni Flash</text>
