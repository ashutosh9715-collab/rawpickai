<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="360" rx="12" fill="#F4F1EA"/>

  <!-- Header -->
  <text x="400" y="36" fill="#4A5942" font-size="17" font-weight="700" text-anchor="middle">What The Research Actually Found</text>
  <text x="400" y="56" fill="#8A8577" font-size="12" text-anchor="middle">Independent security studies on AI-generated code, 2025–2026</text>

  <!-- Three stat cards in a row -->

  <!-- Card 1: Veracode -->
  <rect x="30" y="90" width="240" height="220" rx="10" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="30" y="90" width="240" height="4" rx="2" fill="#4A5942"/>
  <text x="150" y="140" fill="#4A5942" font-size="52" font-weight="800" text-anchor="middle">45%</text>
  <text x="150" y="170" fill="#3A3228" font-size="13" font-weight="600" text-anchor="middle">of AI-generated code</text>
  <text x="150" y="188" fill="#3A3228" font-size="13" font-weight="600" text-anchor="middle">contains OWASP Top 10</text>
  <text x="150" y="206" fill="#3A3228" font-size="13" font-weight="600" text-anchor="middle">vulnerabilities</text>
  <line x1="70" y1="232" x2="230" y2="232" stroke="#DDD8CE" stroke-width="1"/>
  <text x="150" y="256" fill="#8A8577" font-size="11" text-anchor="middle">Source: Veracode</text>
  <text x="150" y="272" fill="#8A8577" font-size="11" text-anchor="middle">tested 100+ LLMs</text>
  <text x="150" y="292" fill="#96845A" font-size="11" font-weight="600" text-anchor="middle">March 2026</text>

  <!-- Card 2: Georgia Tech -->
  <rect x="280" y="90" width="240" height="220" rx="10" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="280" y="90" width="240" height="4" rx="2" fill="#6B7C5E"/>
  <text x="400" y="140" fill="#6B7C5E" font-size="52" font-weight="800" text-anchor="middle">35</text>
  <text x="400" y="170" fill="#3A3228" font-size="13" font-weight="600" text-anchor="middle">CVEs in a single month</text>
  <text x="400" y="188" fill="#3A3228" font-size="13" font-weight="600" text-anchor="middle">attributed directly to</text>
  <text x="400" y="206" fill="#3A3228" font-size="13" font-weight="600" text-anchor="middle">AI-generated code</text>
  <line x1="320" y1="232" x2="480" y2="232" stroke="#DDD8CE" stroke-width="1"/>
  <text x="400" y="256" fill="#8A8577" font-size="11" text-anchor="middle">Source: Georgia Tech</text>
  <text x="400" y="272" fill="#8A8577" font-size="11" text-anchor="middle">Vibe Security Radar</text>
  <text x="400" y="292" fill="#96845A" font-size="11" font-weight="600" text-anchor="middle">March 2026</text>

  <!-- Card 3: Moltbook -->
  <rect x="530" y="90" width="240" height="220" rx="10" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="530" y="90" width="240" height="4" rx="2" fill="#96845A"/>
  <text x="650" y="140" fill="#96845A" font-size="48" font-weight="800" text-anchor="middle">1.5M</text>
  <text x="650" y="170" fill="#3A3228" font-size="13" font-weight="600" text-anchor="middle">auth tokens exposed</text>
  <text x="650" y="188" fill="#3A3228" font-size="13" font-weight="600" text-anchor="middle">in 3 days after launch</text>
  <text x="650" y="206" fill="#3A3228" font-size="13" font-weight="600" text-anchor="middle">of a vibe-coded app</text>
  <line x1="570" y1="232" x2="730" y2="232" stroke="#DDD8CE" stroke-width="1"/>
  <text x="650" y="256" fill="#8A8577" font-size="11" text-anchor="middle">Source: Wiz security</text>
  <text x="650" y="272" fill="#8A8577" font-size="11" text-anchor="middle">Moltbook breach</text>
  <text x="650" y="292" fill="#96845A" font-size="11" font-weight="600" text-anchor="middle">February 2026</text>

  <!-- Footer -->
  <text x="400" y="340" fill="#8A8577" font-size="11" text-anchor="middle">Vibe Coding Security Research  -  compiled by rawpickai.com</text>
</svg>
