<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="1200" height="213">
  <rect width="900" height="160" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#6B7C5E" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Building Your First Zap: Time Comparison</text>
  <rect x="40" y="55" width="260" height="80" rx="8" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="170" y="80" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#4A5942">With Copilot</text>
  <text x="170" y="102" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#22c55e">8 min</text>
  <text x="170" y="125" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Describe, verify, done</text>
  <rect x="320" y="55" width="260" height="80" rx="8" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="450" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#96845A">Without Copilot</text>
  <text x="450" y="102" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#96845A">12-15 min</text>
  <text x="450" y="125" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Manual field mapping</text>
  <rect x="600" y="55" width="260" height="80" rx="8" fill="white" stroke="#6B6960" stroke-width="1"/>
  <text x="730" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#6B6960">Make / n8n</text>
  <text x="730" y="102" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="middle" fill="#6B6960">20-30 min</text>
  <text x="730" y="125" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Canvas + technical setup</text>
  <text x="450" y="152" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Tested on a 2-step Google Sheets to Slack Zap. Copilot time includes field verification.</text>
