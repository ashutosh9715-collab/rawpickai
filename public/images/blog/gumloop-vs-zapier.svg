  <text x="390" y="74" font-family="Georgia, serif" font-size="11" font-weight="600" text-anchor="middle" fill="#F4F1EA">Gumloop</text>
  <text x="570" y="74" font-family="Georgia, serif" font-size="11" font-weight="600" text-anchor="middle" fill="#F4F1EA">Zapier</text>
  <text x="750" y="74" font-family="Georgia, serif" font-size="11" font-weight="600" text-anchor="middle" fill="#F4F1EA">Make</text>
  <rect x="40" y="87" width="820" height="26" fill="white" rx="3"/>
  <text x="180" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">AI-native design</text>
  <text x="390" y="105" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#22c55e">Yes (built for AI)</text>
  <text x="570" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Bolted on</text>
  <text x="750" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Bolted on</text>
  <rect x="40" y="117" width="820" height="26" fill="#F9F7F2" rx="3"/>
  <text x="180" y="135" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Non-AI steps cost</text>
  <text x="390" y="135" font-family="Georgia, serif" font-size="13" font-weight="700" text-anchor="middle" fill="#22c55e">Free</text>
  <text x="570" y="135" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#c0392b">1 task each</text>
  <text x="750" y="135" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#c0392b">1 operation each</text>
  <rect x="40" y="147" width="820" height="26" fill="white" rx="3"/>
