<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="1200" height="200">
  <rect width="900" height="150" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Zapier Canvas: AI Process Mapping</text>
  <rect x="60" y="55" width="380" height="75" rx="8" fill="white" stroke="#4A5942" stroke-width="1.5"/>
  <text x="250" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#4A5942">What it does</text>
  <text x="250" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">AI maps your process visually</text>
  <text x="250" y="120" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">then generates Zaps from each step</text>
  <rect x="470" y="55" width="380" height="75" rx="8" fill="white" stroke="#96845A" stroke-width="1"/>
  <text x="660" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#96845A">Best for</text>
  <text x="660" y="102" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Planning before building</text>
  <text x="660" y="120" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#6B6960">Not a finished design tool</text>
  <text x="450" y="143" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Available on Professional and Team plans. Useful starting point for complex multi-team processes.</text>
</svg>
