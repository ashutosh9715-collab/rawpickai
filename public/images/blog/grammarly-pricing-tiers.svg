<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --bg: #F4F1EA;
        --heading: #4A5942;
        --bar1: #6B7C5E;
        --bar2: #96845A;
        --body: #3A3228;
        --muted: #8A8577;
        --track: #DDD8CE;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="700" height="500" fill="#F4F1EA" rx="12"/>

  <!-- Title -->
  <text x="40" y="35" font-size="24" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    Grammarly Pricing Tiers
  </text>

  <!-- Card 1: Free -->
  <rect x="30" y="60" width="190" height="410" fill="white" stroke="#DDD8CE" stroke-width="1" rx="12"/>
  <text x="50" y="95" font-size="16" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    Free
  </text>
  <text x="50" y="125" font-size="20" font-weight="bold" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    $0
  </text>
  <text x="50" y="145" font-size="12" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">
    ₹0/month
  </text>
  <line x1="50" y1="155" x2="200" y2="155" stroke="#DDD8CE" stroke-width="1"/>
  <text x="50" y="180" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Grammar &amp; spelling
  </text>
  <text x="50" y="205" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Basic tone detection
  </text>
  <text x="50" y="230" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Browser extension
  </text>
  <text x="50" y="255" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Gmail &amp; Google Docs
  </text>
  <text x="50" y="280" font-size="12" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">
    ✗ No AI rewriting
  </text>
  <text x="50" y="305" font-size="12" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">
    ✗ No plagiarism check
  </text>
  <text x="50" y="330" font-size="12" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">
    ✗ Limited features
  </text>
  <rect x="50" y="360" width="130" height="35" fill="#6B7C5E" rx="6"/>
  <text x="115" y="383" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Try Free
  </text>

  <!-- Card 2: Pro (Highlighted) -->
  <rect x="250" y="50" width="190" height="430" fill="#F4F1EA" stroke="#96845A" stroke-width="2" rx="12"/>
  <rect x="265" y="60" width="160" height="25" fill="#96845A" rx="6"/>
  <text x="345" y="77" font-size="11" font-weight="bold" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    RECOMMENDED
  </text>
  <text x="270" y="110" font-size="16" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    Pro
  </text>
  <text x="270" y="140" font-size="20" font-weight="bold" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    $12/yr
  </text>
  <text x="270" y="160" font-size="12" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">
    ≈₹1,116/year
  </text>
  <line x1="270" y1="170" x2="420" y2="170" stroke="#DDD8CE" stroke-width="1"/>
  <text x="270" y="195" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ All Free features
  </text>
  <text x="270" y="220" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Full AI rewriting
  </text>
  <text x="270" y="245" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Tone rewriting
  </text>
  <text x="270" y="270" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Plagiarism detection
  </text>
  <text x="270" y="295" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Citation management
  </text>
  <text x="270" y="320" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Generative features
  </text>
  <text x="270" y="345" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Premium support
  </text>
  <rect x="270" y="370" width="130" height="35" fill="#96845A" rx="6"/>
  <text x="335" y="393" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Start Pro
  </text>

  <!-- Card 3: Business -->
  <rect x="470" y="60" width="190" height="410" fill="white" stroke="#DDD8CE" stroke-width="1" rx="12"/>
  <text x="490" y="95" font-size="16" font-weight="bold" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    Business
  </text>
  <text x="490" y="125" font-size="20" font-weight="bold" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    Custom
  </text>
  <text x="490" y="145" font-size="12" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">
    ≈₹930/user/mo
  </text>
  <line x1="490" y1="155" x2="640" y2="155" stroke="#DDD8CE" stroke-width="1"/>
  <text x="490" y="180" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ All Pro features
  </text>
  <text x="490" y="205" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Team analytics
  </text>
  <text x="490" y="230" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Style guides
  </text>
  <text x="490" y="255" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Admin console
  </text>
  <text x="490" y="280" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ SSO/SAML
  </text>
  <text x="490" y="305" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">
    ✓ Dedicated support
  </text>
  <text x="490" y="330" font-size="12" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">
    For teams 5+
  </text>
  <rect x="490" y="360" width="130" height="35" fill="#6B7C5E" rx="6"/>
  <text x="555" y="383" font-size="12" font-weight="bold" fill="white" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Contact Sales
  </text>
</svg>