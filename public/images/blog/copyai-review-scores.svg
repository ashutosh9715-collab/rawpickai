  </text>
  <rect x="280" y="310" width="300" height="28" rx="12" fill="#DDD8CE"/>
  <rect x="280" y="310" width="252" height="28" rx="12" fill="#96845A"/>
  <text x="590" y="330" font-size="16" font-weight="bold" fill="#3A3228" font-family="system-ui">84/100</text>

  <!-- Free Tier -->
  <text x="40" y="390" font-size="16" font-weight="600" fill="#3A3228" font-family="system-ui">
    Free Tier
  </text>
  <rect x="280" y="375" width="300" height="28" rx="12" fill="#DDD8CE"/>
  <rect x="280" y="375" width="180" height="28" rx="12" fill="#6B7C5E"/>
  <text x="590" y="395" font-size="16" font-weight="bold" fill="#3A3228" font-family="system-ui">60/100</text>

  <!-- Overall Score Box -->
  <rect x="40" y="440" width="720" height="50" rx="12" fill="#96845A" opacity="0.15"/>
  <text x="60" y="460" font-size="16" font-weight="600" fill="#3A3228" font-family="system-ui">
    Overall Score
  </text>
  <text x="720" y="470" font-size="28" font-weight="bold" fill="#4A5942" font-family="system-ui" text-anchor="end">
    3.5 / 5.0
  </text>
