<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { color-scheme: light; }
      .bg { fill: #F4F1EA; }
      .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 700; fill: #4A5942; }
      .subheader { font-size: 14px; font-weight: 600; fill: #4A5942; }
      .label { font-size: 13px; fill: #3A3228; }
      .value { font-size: 12px; fill: #3A3228; font-weight: 500; }
      .muted { fill: #8A8577; font-size: 12px; }
      .bar-claude { fill: #6B7C5E; }
      .bar-chatgpt { fill: #96845A; }
      .bar-gemini { fill: #8A8577; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="600"/>

  <!-- Title -->
  <text class="header" x="50" y="40">Pricing Comparison (May 2026)</text>

  <!-- Monthly Cost Comparison -->
  <text class="subheader" x="50" y="100">Monthly Subscription Cost</text>

  <!-- Claude -->
  <text class="label" x="50" y="140">Claude Pro</text>
  <rect class="bar-claude" x="50" y="155" width="140" height="40" rx="12"/>
  <text class="value" x="120" y="183" text-anchor="middle" fill="#F4F1EA" font-weight="700" font-size="16">$20</text>
  <text class="muted" x="50" y="210">($20/month)</text>

  <!-- ChatGPT -->
  <text class="label" x="350" y="140">ChatGPT Plus</text>
  <rect class="bar-chatgpt" x="350" y="155" width="140" height="40" rx="12"/>
  <text class="value" x="420" y="183" text-anchor="middle" fill="#F4F1EA" font-weight="700" font-size="16">$20</text>
  <text class="muted" x="350" y="210">($20/month)</text>

  <!-- Gemini -->
  <text class="label" x="650" y="140">Gemini Advanced</text>
  <rect class="bar-gemini" x="650" y="155" width="140" height="40" rx="12"/>
  <text class="value" x="720" y="183" text-anchor="middle" fill="#F4F1EA" font-weight="700" font-size="16">$20</text>
  <text class="muted" x="650" y="210">($20/month)</text>

  <!-- What You Get -->
  <text class="subheader" x="50" y="280">What's Included</text>

  <!-- Claude Column -->
  <text class="label" x="50" y="310">Claude (Pro)</text>
  <text class="value" x="50" y="330">✓ Opus 4.6 model</text>
  <text class="value" x="50" y="348">✓ 5x usage vs free</text>
  <text class="value" x="50" y="366">✓ Claude Projects</text>
  <text class="value" x="50" y="384">✓ Priority access</text>
  <text class="value" x="50" y="402">✗ No image generation</text>
  <text class="value" x="50" y="420">✗ No bundled extras</text>

  <!-- ChatGPT Column -->
  <text class="label" x="350" y="310">ChatGPT (Plus)</text>
  <text class="value" x="350" y="330">✓ GPT-5.4 model</text>
  <text class="value" x="350" y="348">✓ DALL-E 3 images</text>
  <text class="value" x="350" y="366">✓ Web browsing</text>
  <text class="value" x="350" y="384">✓ Code execution</text>
  <text class="value" x="350" y="402">✓ GPT Store access</text>
  <text class="value" x="350" y="420">✓ Voice mode</text>

  <!-- Gemini Column -->
  <text class="label" x="650" y="310">Gemini (Advanced)</text>
  <text class="value" x="650" y="330">✓ Ultra 2.0 model</text>
  <text class="value" x="650" y="348">✓ 2TB Google Drive</text>
  <text class="value" x="650" y="366">✓ Imagen 3 images</text>
  <text class="value" x="650" y="384">✓ Google Search native</text>
  <text class="value" x="650" y="402">✓ Workspace integration</text>
  <text class="value" x="650" y="420">✓ 1M token context</text>

  <!-- Annual Breakdown -->
  <text class="subheader" x="50" y="480">Annual Cost (if paid monthly)</text>
  <text class="value" x="50" y="510">Claude: $240/year (≈₹22,320)</text>
  <text class="value" x="350" y="510">ChatGPT: $240/year (≈₹22,320)</text>
  <text class="value" x="650" y="510">Gemini: $240/year (≈₹22,320)</text>

  <!-- Free Tier Note -->
  <text class="subheader" x="50" y="560">Free Tier Winner: Gemini</text>
  <text class="muted" x="50" y="580">All three offer free tiers. Gemini's free tier has the most generous limits. Claude &amp; ChatGPT free tiers have tighter caps.</text>
</svg>