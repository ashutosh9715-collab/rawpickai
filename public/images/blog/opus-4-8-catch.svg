  <text x="450" y="118" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">to upgrade for Mythos 1</text>
  <rect x="600" y="55" width="260" height="80" rx="8" fill="white" stroke="#6B6960" stroke-width="1.5"/>
  <text x="730" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#6B6960">Multimodal still weak</text>
