  <text x="910" y="415" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#4A453E">Vatican chose Anthropic</text>
  <text x="910" y="440" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#6B6960">over Google and OpenAI</text>
  <text x="600" y="540" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#8A8577">rawpickai.com</text>
