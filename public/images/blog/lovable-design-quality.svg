<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="280" rx="12" fill="#F4F1EA"/>
  <text x="350" y="35" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#4A5942" text-anchor="middle">Design Quality Comparison</text>

  <!-- Lovable -->
  <text x="40" y="80" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#3A3228">Lovable</text>
  <rect x="160" y="68" width="420" height="18" rx="9" fill="#DDD8CE"/>
  <rect x="160" y="68" width="315" height="18" rx="9" fill="#6B7C5E"/>
  <text x="485" y="82" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#3A3228">75/100</text>

  <!-- v0 -->
  <text x="40" y="125" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#3A3228">v0 by Vercel</text>
  <rect x="160" y="113" width="420" height="18" rx="9" fill="#DDD8CE"/>
  <rect x="160" y="113" width="386" height="18" rx="9" fill="#96845A"/>
  <text x="556" y="127" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#3A3228">92/100</text>

  <!-- Bolt.new -->
  <text x="40" y="170" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#3A3228">Bolt.new</text>
  <rect x="160" y="158" width="420" height="18" rx="9" fill="#DDD8CE"/>
  <rect x="160" y="158" width="336" height="18" rx="9" fill="#6B7C5E"/>
  <text x="506" y="172" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#3A3228">80/100</text>

  <!-- Notes -->
  <line x1="40" y1="200" x2="660" y2="200" stroke="#DDD8CE" stroke-width="1"/>
  <text x="40" y="225" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8A8577">v0 leads on visual polish. Lovable's default UI feels functional</text>
  <text x="40" y="243" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8A8577">but dated. Bolt.new sits in the middle with cleaner code structure.</text>
  <text x="40" y="268" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#8A8577">Scores based on 5-project test, May 2026</text>
</svg>