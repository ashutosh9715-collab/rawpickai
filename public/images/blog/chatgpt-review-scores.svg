<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="350" rx="12" fill="#F4F1EA"/>

  <text x="40" y="40" fill="#3A3228" font-size="18" font-weight="700">ChatGPT Review Scores</text>
  <text x="40" y="60" fill="#8A8577" font-size="13">Our rating across 5 categories  -  Overall: 4.5/5</text>

  <!-- Overall score circle -->
  <circle cx="710" cy="50" r="30" fill="none" stroke="#DDD8CE" stroke-width="6"/>
  <circle cx="710" cy="50" r="30" fill="none" stroke="#96845A" stroke-width="6" stroke-dasharray="170" stroke-dashoffset="17" transform="rotate(-90 710 50)"/>
  <text x="710" y="46" fill="#3A3228" font-size="18" font-weight="700" text-anchor="middle">4.5</text>
  <text x="710" y="62" fill="#8A8577" font-size="10" text-anchor="middle">/5</text>

  <!-- Ease of Use: 92 -->
  <text x="40" y="108" fill="#4A5942" font-size="13" font-weight="600">Ease of Use</text>
  <rect x="200" y="94" width="480" height="22" rx="6" fill="#DDD8CE"/>
  <rect x="200" y="94" width="442" height="22" rx="6" fill="#6B7C5E"/>
  <text x="684" y="110" fill="#3A3228" font-size="13" font-weight="700">92</text>

  <!-- Output Quality: 88 -->
  <text x="40" y="158" fill="#4A5942" font-size="13" font-weight="600">Output Quality</text>
  <rect x="200" y="144" width="480" height="22" rx="6" fill="#DDD8CE"/>
  <rect x="200" y="144" width="422" height="22" rx="6" fill="#6B7C5E"/>
  <text x="674" y="160" fill="#3A3228" font-size="13" font-weight="700">88</text>

  <!-- Value for Money: 78 -->
  <text x="40" y="208" fill="#4A5942" font-size="13" font-weight="600">Value for Money</text>
  <rect x="200" y="194" width="480" height="22" rx="6" fill="#DDD8CE"/>
  <rect x="200" y="194" width="374" height="22" rx="6" fill="#96845A"/>
  <text x="654" y="210" fill="#3A3228" font-size="13" font-weight="700">78</text>

  <!-- Feature Depth: 90 -->
  <text x="40" y="258" fill="#4A5942" font-size="13" font-weight="600">Feature Depth</text>
  <rect x="200" y="244" width="480" height="22" rx="6" fill="#DDD8CE"/>
  <rect x="200" y="244" width="432" height="22" rx="6" fill="#6B7C5E"/>
  <text x="684" y="260" fill="#3A3228" font-size="13" font-weight="700">90</text>

  <!-- Free Tier: 72 -->
  <text x="40" y="308" fill="#4A5942" font-size="13" font-weight="600">Free Tier</text>
  <rect x="200" y="294" width="480" height="22" rx="6" fill="#DDD8CE"/>
  <rect x="200" y="294" width="346" height="22" rx="6" fill="#96845A"/>
  <text x="656" y="310" fill="#3A3228" font-size="13" font-weight="700">72</text>

  <!-- Footer -->
  <text x="40" y="342" fill="#8A8577" font-size="11">Tested over 4 months on ChatGPT Plus and Pro  -  rawpickai.com</text>
</svg>
