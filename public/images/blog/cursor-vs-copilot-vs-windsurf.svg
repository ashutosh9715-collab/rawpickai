<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .background { fill: #F4F1EA; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 26px; font-weight: 700; fill: #4A5942; }
      .table-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .header-bg { fill: #6B7C5E; }
      .header-accent { fill: #96845A; }
      .row-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; fill: #4A5942; }
      .cell-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #3A3228; }
      .cell-price { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #96845A; }
      .row-bg-alt { fill: #ffffff; }
      .row-bg { fill: #fafaf8; }
      .border { stroke: #DDD8CE; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" class="background"/>

  <!-- Title -->
  <text x="40" y="40" class="title">Cursor vs GitHub Copilot vs Windsurf</text>

  <!-- Table Headers -->
  <rect x="40" y="60" width="920" height="35" class="header-bg"/>
  <text x="50" y="85" class="table-header">Feature</text>
  <text x="280" y="85" class="table-header">Cursor</text>
  <text x="520" y="85" class="table-header">GitHub Copilot</text>
  <text x="760" y="85" class="table-header">Windsurf</text>

  <!-- Row 1: Interface -->
  <rect x="40" y="95" width="920" height="30" class="row-bg"/>
  <text x="50" y="118" class="row-label">Interface</text>
  <text x="280" y="118" class="cell-text">AI-first IDE</text>
  <text x="520" y="118" class="cell-text">VS Code plugin</text>
  <text x="760" y="118" class="cell-text">AI-first IDE</text>

  <!-- Row 2: Autocomplete Quality -->
  <rect x="40" y="125" width="920" height="30" class="row-bg-alt"/>
  <text x="50" y="148" class="row-label">Autocomplete Quality</text>
  <text x="280" y="148" class="cell-text">70% acceptance</text>
  <text x="520" y="148" class="cell-text">45% acceptance</text>
  <text x="760" y="148" class="cell-text">68% acceptance</text>

  <!-- Row 3: Agent Mode -->
  <rect x="40" y="155" width="920" height="30" class="row-bg"/>
  <text x="50" y="178" class="row-label">Agent Mode</text>
  <text x="280" y="178" class="cell-text">Yes, 65% success</text>
  <text x="520" y="178" class="cell-text">No</text>
  <text x="760" y="178" class="cell-text">Yes, parallel agents</text>

  <!-- Row 4: Monthly Cost USD -->
  <rect x="40" y="185" width="920" height="30" class="row-bg-alt"/>
  <text x="50" y="208" class="row-label">Cost (USD/month)</text>
  <text x="280" y="208" class="cell-price">$20 Pro</text>
  <text x="520" y="208" class="cell-price">$10 Pro</text>
  <text x="760" y="208" class="cell-price">$20</text>

  <!-- Row 5: Monthly Cost INR -->
  <rect x="40" y="215" width="920" height="30" class="row-bg"/>
  <text x="50" y="238" class="row-label">Cost (USD/month)</text>
  <text x="280" y="238" class="cell-price">≈$20 (≈₹1,860)</text>
  <text x="520" y="238" class="cell-price">≈$10 (≈₹930)</text>
  <text x="760" y="238" class="cell-price">≈$20 (≈₹1,860)</text>

  <!-- Row 6: Learning Curve -->
  <rect x="40" y="245" width="920" height="30" class="row-bg-alt"/>
  <text x="50" y="268" class="row-label">Learning Curve</text>
  <text x="280" y="268" class="cell-text">Medium (1-2 weeks)</text>
  <text x="520" y="268" class="cell-text">Very low</text>
  <text x="760" y="268" class="cell-text">Medium (similar)</text>

  <!-- Row 7: Best For -->
  <rect x="40" y="275" width="920" height="30" class="row-bg"/>
  <text x="50" y="298" class="row-label">Best For</text>
  <text x="280" y="298" class="cell-text">Feature work, refactoring</text>
  <text x="520" y="298" class="cell-text">Quick edits, minimal setup</text>
  <text x="760" y="298" class="cell-text">Iteration speed</text>

  <!-- Row 8: Offline Support -->
  <rect x="40" y="305" width="920" height="30" class="row-bg-alt"/>
  <text x="50" y="328" class="row-label">Offline Support</text>
  <text x="280" y="328" class="cell-text">No</text>
  <text x="520" y="328" class="cell-text">Partial (limited)</text>
  <text x="760" y="328" class="cell-text">No</text>

  <!-- Row 9: Extension Compat -->
  <rect x="40" y="335" width="920" height="30" class="row-bg"/>
  <text x="50" y="358" class="row-label">Extension Compatibility</text>
  <text x="280" y="358" class="cell-text">90% compatible</text>
  <text x="520" y="358" class="cell-text">100% (in VS Code)</text>
  <text x="760" y="358" class="cell-text">90% compatible</text>

  <!-- Row 10: Free Tier -->
  <rect x="40" y="365" width="920" height="30" class="row-bg-alt"/>
  <text x="50" y="388" class="row-label">Free Tier Quality</text>
  <text x="280" y="388" class="cell-text">Limited (trial)</text>
  <text x="520" y="388" class="cell-text">Generous (good)</text>
  <text x="760" y="388" class="cell-text">Limited (trial)</text>

  <!-- Summary Box -->
  <rect x="40" y="415" width="920" height="160" rx="12" fill="#ffffff" stroke="#DDD8CE" stroke-width="2"/>
  <text x="60" y="440" class="row-label">Summary</text>

  <text x="60" y="465" class="cell-text" style="font-weight: 600;">Cursor:</text>
  <text x="60" y="480" class="cell-text">Best overall for developers who write code daily. Agent mode and autocomplete quality justify $20/mo (≈₹1,860)nth. 1-2 week learning curve.</text>

  <text x="60" y="505" class="cell-text" style="font-weight: 600;">Copilot:</text>
  <text x="60" y="520" class="cell-text">Most affordable at $10/mo (≈₹930)nth. Best for staying in VS Code. Lower acceptance rate (45% vs 70%) but zero switching friction.</text>

  <text x="60" y="545" class="cell-text" style="font-weight: 600;">Windsurf:</text>
  <text x="60" y="560" class="cell-text">Similar cost to Cursor. Parallel agents for faster iteration. Marginally faster than Cursor on large tasks. Similar learning curve.</text>

</svg>