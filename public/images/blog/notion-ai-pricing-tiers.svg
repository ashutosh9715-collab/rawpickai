<svg viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --bg: #F4F1EA;
        --heading: #4A5942;
        --bar-primary: #6B7C5E;
        --bar-accent: #96845A;
        --body: #3A3228;
        --muted: #8A8577;
        --track: #DDD8CE;
      }
      body { background-color: var(--bg); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="550" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="500" y="45" font-size="32" font-weight="bold" text-anchor="middle" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">
    Notion AI Pricing Tiers
  </text>

  <!-- Card 1: Free -->
  <g>
    <rect x="50" y="100" width="180" height="380" fill="white" stroke="#DDD8CE" stroke-width="2" rx="12"/>
    <text x="140" y="145" font-size="20" font-weight="bold" text-anchor="middle" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">Free</text>
    <text x="140" y="180" font-size="24" font-weight="bold" text-anchor="middle" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">$0</text>
    <text x="140" y="200" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">/month</text>
    <line x1="60" y1="220" x2="220" y2="220" stroke="#DDD8CE" stroke-width="1"/>
    <text x="140" y="250" font-size="13" text-anchor="middle" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif" font-weight="600">10 AI actions</text>
    <text x="140" y="270" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">Limited testing</text>
    <circle cx="140" cy="305" r="4" fill="#6B7C5E"/>
    <text x="155" y="310" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Q&amp;A access</text>
    <circle cx="140" cy="335" r="4" fill="#6B7C5E"/>
    <text x="155" y="340" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Writing help</text>
    <circle cx="140" cy="365" r="4" fill="#DDD8CE"/>
    <text x="155" y="370" font-size="12" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">Summarization</text>
    <circle cx="140" cy="395" r="4" fill="#DDD8CE"/>
    <text x="155" y="400" font-size="12" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">Auto-fill fields</text>
    <text x="140" y="450" font-size="11" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif" font-style="italic">Try before paying</text>
  </g>

  <!-- Card 2: Plus (Featured) -->
  <g>
    <!-- Highlight border -->
    <rect x="260" y="80" width="180" height="420" fill="none" stroke="#96845A" stroke-width="3" rx="12"/>
    <rect x="260" y="100" width="180" height="380" fill="white" rx="12"/>
    <text x="260" y="90" font-size="11" font-weight="bold" fill="#96845A" font-family="system-ui, -apple-system, sans-serif">MOST POPULAR</text>
    <text x="350" y="145" font-size="20" font-weight="bold" text-anchor="middle" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">Plus</text>
    <text x="350" y="180" font-size="28" font-weight="bold" text-anchor="middle" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">$10</text>
    <text x="350" y="200" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">/month</text>
    <text x="350" y="220" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">(≈₹930)</text>
    <line x1="270" y1="235" x2="430" y2="235" stroke="#DDD8CE" stroke-width="1"/>
    <text x="350" y="265" font-size="13" text-anchor="middle" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Unlimited AI</text>
    <text x="350" y="285" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">All features included</text>
    <circle cx="280" cy="315" r="4" fill="#6B7C5E"/>
    <text x="295" y="320" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Q&amp;A across workspace</text>
    <circle cx="280" cy="345" r="4" fill="#6B7C5E"/>
    <text x="295" y="350" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Writing assistance</text>
    <circle cx="280" cy="375" r="4" fill="#6B7C5E"/>
    <text x="295" y="380" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Summarization</text>
    <circle cx="280" cy="405" r="4" fill="#6B7C5E"/>
    <text x="295" y="410" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Auto-fill + extraction</text>
    <text x="350" y="450" font-size="11" text-anchor="middle" fill="#96845A" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Best value</text>
  </g>

  <!-- Card 3: Business -->
  <g>
    <rect x="470" y="100" width="180" height="380" fill="white" stroke="#DDD8CE" stroke-width="2" rx="12"/>
    <text x="560" y="145" font-size="20" font-weight="bold" text-anchor="middle" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">Business</text>
    <text x="560" y="180" font-size="28" font-weight="bold" text-anchor="middle" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">$18</text>
    <text x="560" y="200" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">/month</text>
    <text x="560" y="220" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">(≈₹1,674)</text>
    <line x1="480" y1="235" x2="640" y2="235" stroke="#DDD8CE" stroke-width="1"/>
    <text x="560" y="265" font-size="13" text-anchor="middle" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Unlimited AI</text>
    <text x="560" y="285" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">Team features</text>
    <circle cx="490" cy="315" r="4" fill="#6B7C5E"/>
    <text x="505" y="320" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">All Plus features</text>
    <circle cx="490" cy="345" r="4" fill="#6B7C5E"/>
    <text x="505" y="350" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Guest accounts</text>
    <circle cx="490" cy="375" r="4" fill="#6B7C5E"/>
    <text x="505" y="380" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Advanced permissions</text>
    <circle cx="490" cy="405" r="4" fill="#6B7C5E"/>
    <text x="505" y="410" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Team workspaces</text>
    <text x="560" y="450" font-size="11" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif" font-style="italic">For teams</text>
  </g>

  <!-- Card 4: Enterprise -->
  <g>
    <rect x="680" y="100" width="180" height="380" fill="white" stroke="#DDD8CE" stroke-width="2" rx="12"/>
    <text x="770" y="145" font-size="20" font-weight="bold" text-anchor="middle" fill="#4A5942" font-family="system-ui, -apple-system, sans-serif">Enterprise</text>
    <text x="770" y="180" font-size="24" font-weight="bold" text-anchor="middle" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Custom</text>
    <text x="770" y="200" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">pricing</text>
    <line x1="690" y1="220" x2="850" y2="220" stroke="#DDD8CE" stroke-width="1"/>
    <text x="770" y="250" font-size="13" text-anchor="middle" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif" font-weight="600">Everything</text>
    <text x="770" y="270" font-size="12" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif">for large orgs</text>
    <circle cx="700" cy="305" r="4" fill="#6B7C5E"/>
    <text x="715" y="310" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Unlimited everything</text>
    <circle cx="700" cy="335" r="4" fill="#6B7C5E"/>
    <text x="715" y="340" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">SSO + security</text>
    <circle cx="700" cy="365" r="4" fill="#6B7C5E"/>
    <text x="715" y="370" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Dedicated support</text>
    <circle cx="700" cy="395" r="4" fill="#6B7C5E"/>
    <text x="715" y="400" font-size="12" fill="#3A3228" font-family="system-ui, -apple-system, sans-serif">Custom SLAs</text>
    <text x="770" y="450" font-size="11" text-anchor="middle" fill="#8A8577" font-family="system-ui, -apple-system, sans-serif" font-style="italic">Contact sales</text>
  </g>

</svg>