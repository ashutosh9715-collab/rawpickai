<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F1EA" rx="16"/>
  <rect x="0" y="0" width="1200" height="6" fill="#4A5942" rx="3"/>
  <text x="600" y="80" font-family="Georgia, serif" font-size="16" font-weight="600" text-anchor="middle" fill="#6B7C5E">RAWPICKAI NEWS · MAY 25, 2026</text>
  <text x="600" y="160" font-family="Georgia, serif" font-size="40" font-weight="700" text-anchor="middle" fill="#1A2416">Pope Leo XIV Releases AI Encyclical</text>
