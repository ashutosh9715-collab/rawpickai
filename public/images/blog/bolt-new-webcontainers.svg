<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, system-ui, sans-serif">
  <rect width="800" height="380" rx="12" fill="#F4F1EA"/>

  <text x="400" y="36" fill="#3A3228" font-size="18" font-weight="700" text-anchor="middle">How Bolt.new WebContainers Work</text>
  <text x="400" y="56" fill="#8A8577" font-size="13" text-anchor="middle">Node.js runs inside your browser - no cloud VM</text>

  <!-- Your Browser box -->
  <rect x="40" y="80" width="720" height="260" rx="12" fill="none" stroke="#6B7C5E" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="102" fill="#6B7C5E" font-size="12" font-weight="700">YOUR BROWSER TAB</text>

  <!-- Prompt box -->
  <rect x="80" y="120" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1.5"/>
  <text x="160" y="148" fill="#4A5942" font-size="13" font-weight="700" text-anchor="middle">Your Prompt</text>
  <text x="160" y="168" fill="#8A8577" font-size="10" text-anchor="middle">"Build a todo app"</text>

  <!-- Arrow 1 -->
  <line x1="240" y1="155" x2="290" y2="155" stroke="#96845A" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- AI Model box -->
  <rect x="290" y="120" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1.5"/>
  <text x="370" y="148" fill="#4A5942" font-size="13" font-weight="700" text-anchor="middle">AI Model</text>
  <text x="370" y="168" fill="#8A8577" font-size="10" text-anchor="middle">Generates code</text>

  <!-- Arrow 2 -->
  <line x1="450" y1="155" x2="500" y2="155" stroke="#96845A" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- WebContainers box -->
  <rect x="500" y="120" width="220" height="70" rx="8" fill="#6B7C5E" stroke="none"/>
  <text x="610" y="148" fill="#F4F1EA" font-size="13" font-weight="700" text-anchor="middle">WebContainers</text>
  <text x="610" y="168" fill="#F4F1EA" font-size="10" text-anchor="middle" opacity="0.8">Node.js via WebAssembly</text>

  <!-- Arrow down from WebContainers -->
  <line x1="610" y1="190" x2="610" y2="230" stroke="#96845A" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Bottom row -->
  <rect x="80" y="240" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1.5"/>
  <text x="145" y="266" fill="#4A5942" font-size="11" font-weight="600" text-anchor="middle">File System</text>
  <text x="145" y="282" fill="#8A8577" font-size="10" text-anchor="middle">All files visible</text>

  <rect x="230" y="240" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1.5"/>
  <text x="295" y="266" fill="#4A5942" font-size="11" font-weight="600" text-anchor="middle">npm Packages</text>
  <text x="295" y="282" fill="#8A8577" font-size="10" text-anchor="middle">Real installs</text>

  <rect x="380" y="240" width="130" height="60" rx="8" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1.5"/>
  <text x="445" y="266" fill="#4A5942" font-size="11" font-weight="600" text-anchor="middle">Dev Server</text>
  <text x="445" y="282" fill="#8A8577" font-size="10" text-anchor="middle">Hot reload</text>

  <rect x="530" y="240" width="190" height="60" rx="8" fill="#96845A" stroke="none"/>
  <text x="625" y="266" fill="#F4F1EA" font-size="11" font-weight="600" text-anchor="middle">Live Preview</text>
  <text x="625" y="282" fill="#F4F1EA" font-size="10" text-anchor="middle" opacity="0.8">Running app in tab</text>

  <!-- Footer -->
  <text x="40" y="365" fill="#8A8577" font-size="11">No remote server needed - everything runs locally in your browser - rawpickai.com</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#96845A"/>
    </marker>
  </defs>
</svg>