<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="320" rx="12" fill="#F4F1EA"/>
  <text x="400" y="36" fill="#4A5942" font-size="18" font-weight="700" text-anchor="middle">How Each Tool Works Under the Hood</text>

  <!-- Lovable -->
  <rect x="30" y="60" width="230" height="220" rx="10" fill="#EEEAE2" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="30" y="60" width="230" height="36" rx="10" fill="#96845A"/>
  <rect x="30" y="86" width="230" height="10" fill="#96845A"/>
  <text x="145" y="84" fill="#F4F1EA" font-size="14" font-weight="700" text-anchor="middle">Lovable</text>
  <text x="145" y="118" fill="#3A3228" font-size="11" text-anchor="middle" font-weight="600">Opinionated Stack</text>
