  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">The Catches Nobody Mentions About Opus 4.8</text>
  <rect x="40" y="55" width="260" height="80" rx="8" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="170" y="80" font-family="Georgia, serif" font-size="13" font-weight="600" text-anchor="middle" fill="#c0392b">Rate limits on Max</text>
