<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="680" height="320" rx="12" fill="#F4F1EA"/>

  <!-- Title -->
  <text x="340" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#4A5942">Composer 2 vs Composer 2.5</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#8A8577">Benchmark improvement across three metrics</text>

  <!-- Legend -->
  <rect x="200" y="68" width="12" height="12" rx="3" fill="#96845A"/>
  <text x="218" y="79" font-size="11" fill="#3A3228">Composer 2</text>
  <rect x="320" y="68" width="12" height="12" rx="3" fill="#6B7C5E"/>
  <text x="338" y="79" font-size="11" fill="#3A3228">Composer 2.5</text>

  <!-- === SWE-Bench === -->
  <text x="120" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5942">SWE-Bench</text>
  <text x="120" y="124" text-anchor="middle" font-size="11" fill="#8A8577">Multilingual</text>

  <!-- Track -->
  <rect x="30" y="134" width="180" height="14" rx="4" fill="#DDD8CE"/>
  <!-- Composer 2 bar: 73.7% -->
  <rect x="30" y="134" width="132.66" height="14" rx="4" fill="#96845A"/>
  <!-- Composer 2.5 bar -->
  <rect x="30" y="152" width="180" height="14" rx="4" fill="#DDD8CE"/>
  <rect x="30" y="152" width="143.64" height="14" rx="4" fill="#6B7C5E"/>

  <text x="168" y="145" font-size="11" font-weight="600" fill="#3A3228">73.7%</text>
  <text x="179" y="163" font-size="11" font-weight="600" fill="#3A3228">79.8%</text>

  <!-- Delta badge -->
  <rect x="62" y="173" width="60" height="18" rx="6" fill="#6B7C5E"/>
  <text x="92" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1EA">+6.1 pts</text>

  <!-- === CursorBench === -->
  <text x="340" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5942">CursorBench</text>
  <text x="340" y="124" text-anchor="middle" font-size="11" fill="#8A8577">v3.1</text>

  <rect x="250" y="134" width="180" height="14" rx="4" fill="#DDD8CE"/>
  <!-- Composer 2: 52.2% of 180 = 93.96 -->
  <rect x="250" y="134" width="93.96" height="14" rx="4" fill="#96845A"/>
  <rect x="250" y="152" width="180" height="14" rx="4" fill="#DDD8CE"/>
  <!-- Composer 2.5: 63.2% of 180 = 113.76 -->
  <rect x="250" y="152" width="113.76" height="14" rx="4" fill="#6B7C5E"/>

  <text x="350" y="145" font-size="11" font-weight="600" fill="#3A3228">52.2%</text>
  <text x="370" y="163" font-size="11" font-weight="600" fill="#3A3228">63.2%</text>

  <rect x="278" y="173" width="60" height="18" rx="6" fill="#6B7C5E"/>
  <text x="308" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1EA">+11 pts</text>

  <!-- === Terminal-Bench === -->
  <text x="560" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#4A5942">Terminal-Bench</text>
  <text x="560" y="124" text-anchor="middle" font-size="11" fill="#8A8577">Score</text>

  <rect x="470" y="134" width="180" height="14" rx="4" fill="#DDD8CE"/>
  <!-- Composer 2: 61.7% of 180 = 111.06 -->
  <rect x="470" y="134" width="111.06" height="14" rx="4" fill="#96845A"/>
  <rect x="470" y="152" width="180" height="14" rx="4" fill="#DDD8CE"/>
  <!-- Composer 2.5: 69.3% of 180 = 124.74 -->
  <rect x="470" y="152" width="124.74" height="14" rx="4" fill="#6B7C5E"/>

  <text x="587" y="145" font-size="11" font-weight="600" fill="#3A3228">61.7%</text>
  <text x="600" y="163" font-size="11" font-weight="600" fill="#3A3228">69.3%</text>

  <rect x="497" y="173" width="60" height="18" rx="6" fill="#6B7C5E"/>
  <text x="527" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F1EA">+7.6 pts</text>

  <!-- Dividers -->
  <line x1="218" y1="95" x2="218" y2="210" stroke="#DDD8CE" stroke-width="1"/>
  <line x1="438" y1="95" x2="438" y2="210" stroke="#DDD8CE" stroke-width="1"/>

  <!-- Note -->
  <text x="340" y="240" text-anchor="middle" font-size="11" fill="#8A8577">All scores: higher is better.</text>
  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#8A8577">CursorBench is Cursor's internal agentic coding benchmark.</text>
  <text x="340" y="276" text-anchor="middle" font-size="11" fill="#8A8577">rawpickai.com</text>
</svg>
