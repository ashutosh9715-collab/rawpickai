<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title2">
  <title id="title2">Microsoft 365 E7 Frontier Suite bundle breakdown components and pricing</title>
  <rect width="800" height="480" fill="#F4F1EA"/>

  <text x="40" y="50" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1A2416">Microsoft 365 E7: What's actually in the bundle</text>
  <text x="40" y="74" font-family="Georgia, serif" font-size="14" fill="#6B6960">Four products bundled at $99/month vs $117 separately. Pricing in USD (≈₹93/USD).</text>

  <!-- Component 1 -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="350" height="84" rx="8" fill="#FFFFFF" stroke="#D4D0C0" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="84" fill="#4A5942"/>
    <text x="20" y="28" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1A2416">Microsoft 365 E5</text>
    <text x="20" y="48" font-family="Georgia, serif" font-size="12" fill="#4A453E">Productivity suite  -  Office, Teams, security tools</text>
    <text x="20" y="68" font-family="Georgia, serif" font-size="11" fill="#6B6960">Standalone: $60/mo (≈ ₹5,580)  -  from July 2026</text>
  </g>

  <g transform="translate(410, 100)">
    <rect x="0" y="0" width="350" height="84" rx="8" fill="#FFFFFF" stroke="#D4D0C0" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="84" fill="#6B7C5E"/>
    <text x="20" y="28" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1A2416">Microsoft 365 Copilot</text>
    <text x="20" y="48" font-family="Georgia, serif" font-size="12" fill="#4A453E">AI assistant in Word, Excel, PowerPoint, Teams</text>
    <text x="20" y="68" font-family="Georgia, serif" font-size="11" fill="#6B6960">Standalone: $30/mo (≈ ₹2,790)</text>
  </g>

  <g transform="translate(40, 200)">
    <rect x="0" y="0" width="350" height="84" rx="8" fill="#FFFFFF" stroke="#D4D0C0" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="84" fill="#96845A"/>
    <text x="20" y="28" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1A2416">Entra Suite</text>
    <text x="20" y="48" font-family="Georgia, serif" font-size="12" fill="#4A453E">Identity governance and access control</text>
    <text x="20" y="68" font-family="Georgia, serif" font-size="11" fill="#6B6960">Standalone: $12/mo (≈ ₹1,116)</text>
  </g>

  <g transform="translate(410, 200)">
    <rect x="0" y="0" width="350" height="84" rx="8" fill="#FFFFFF" stroke="#D4D0C0" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="84" fill="#2D3A28"/>
    <text x="20" y="28" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#1A2416">Agent 365 (NEW)</text>
    <text x="20" y="48" font-family="Georgia, serif" font-size="12" fill="#4A453E">Governance layer for AI agents</text>
    <text x="20" y="68" font-family="Georgia, serif" font-size="11" fill="#6B6960">Standalone: $15/mo (≈ ₹1,395)  -  GA today</text>
  </g>

  <!-- Math line -->
  <line x1="40" y1="312" x2="760" y2="312" stroke="#D4D0C0" stroke-width="1"/>

  <g transform="translate(40, 332)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="13" fill="#6B6960">Buy separately:</text>
    <text x="350" y="0" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#791F1F" text-anchor="end">$117/user/month (≈ ₹10,881)</text>

    <text x="0" y="30" font-family="Georgia, serif" font-size="13" fill="#6B6960">E7 bundle list price:</text>
    <text x="350" y="30" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#1A2416" text-anchor="end">$99/user/month (≈ ₹9,207)</text>

    <text x="0" y="60" font-family="Georgia, serif" font-size="13" fill="#6B6960">Bundle savings:</text>
    <text x="350" y="60" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#085041" text-anchor="end">≈15% off, ≈$216/user/year</text>
  </g>

  <!-- Right side: caveat box -->
  <g transform="translate(420, 332)">
    <rect x="0" y="-20" width="340" height="100" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="16" y="19" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#633806">CAVEAT</text>
    <text x="16" y="41" font-family="Georgia, serif" font-size="12" fill="#4A453E">CSP partners can run promo discounts</text>
    <text x="16" y="42" font-family="Georgia, serif" font-size="12" fill="#4A453E">through Dec 31, 2026. Effective price</text>
    <text x="16" y="73" font-family="Georgia, serif" font-size="12" fill="#4A453E">could land at $84/mo with volume tiers</text>
    <text x="16" y="74" font-family="Georgia, serif" font-size="12" fill="#4A453E">(100, 300+ seat thresholds).</text>
  </g>

  <text x="40" y="460" font-family="Georgia, serif" font-size="11" fill="#6B6960">Source: Microsoft 365 Blog · SAMexpert pricing analysis · Verified May 1, 2026</text>
</svg>
