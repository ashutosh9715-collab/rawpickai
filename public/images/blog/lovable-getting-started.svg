<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="200" rx="12" fill="#F4F1EA"/>
  <text x="350" y="32" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#4A5942" text-anchor="middle">Getting Started With Lovable</text>

  <!-- Step 1 -->
  <rect x="20" y="60" width="145" height="100" rx="10" fill="#6B7C5E"/>
  <text x="92" y="90" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" text-anchor="middle">1</text>
  <text x="92" y="115" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1EA" text-anchor="middle">Sign Up</text>
  <text x="92" y="133" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#DDD8CE" text-anchor="middle">Free account</text>
  <text x="92" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#DDD8CE" text-anchor="middle">30 seconds</text>

  <!-- Arrow 1 -->
  <path d="M175 110 L190 110" stroke="#96845A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#96845A"/></marker></defs>

  <!-- Step 2 -->
  <rect x="195" y="60" width="145" height="100" rx="10" fill="#96845A"/>
  <text x="267" y="90" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" text-anchor="middle">2</text>
  <text x="267" y="115" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1EA" text-anchor="middle">Describe App</text>
  <text x="267" y="133" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4F1EA" text-anchor="middle">Natural language</text>
  <text x="267" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4F1EA" text-anchor="middle">prompt</text>

  <!-- Arrow 2 -->
  <path d="M350 110 L365 110" stroke="#96845A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="370" y="60" width="145" height="100" rx="10" fill="#6B7C5E"/>
  <text x="442" y="90" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" text-anchor="middle">3</text>
  <text x="442" y="115" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1EA" text-anchor="middle">AI Builds</text>
  <text x="442" y="133" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#DDD8CE" text-anchor="middle">React + Supabase</text>
  <text x="442" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#DDD8CE" text-anchor="middle">auto-configured</text>

  <!-- Arrow 3 -->
  <path d="M525 110 L540 110" stroke="#96845A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="545" y="60" width="135" height="100" rx="10" fill="#96845A"/>
  <text x="612" y="90" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#F4F1EA" text-anchor="middle">4</text>
  <text x="612" y="115" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4F1EA" text-anchor="middle">Deploy</text>
  <text x="612" y="133" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4F1EA" text-anchor="middle">One-click live</text>
  <text x="612" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F4F1EA" text-anchor="middle">URL</text>

  <text x="350" y="188" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#8A8577" text-anchor="middle">Total time from signup to deployed app: under 5 minutes</text>
</svg>