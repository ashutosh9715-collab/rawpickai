<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="300" rx="12" fill="#F4F1EA"/>
  <text x="400" y="32" fill="#4A5942" font-size="16" font-weight="700" text-anchor="middle">Average Build Speed Across 5 Projects</text>
  <text x="400" y="50" fill="#8A8577" font-size="11" text-anchor="middle">Time from first prompt to working prototype</text>

  <!-- Lovable -->
  <text x="40" y="100" fill="#4A5942" font-size="13" font-weight="600">Lovable</text>
  <text x="740" y="100" fill="#3A3228" font-size="13" font-weight="700" text-anchor="end">2m 18s avg</text>
  <rect x="140" y="88" width="580" height="16" rx="8" fill="#DDD8CE"/>
  <rect x="140" y="88" width="330" height="16" rx="8" fill="#96845A"/>

  <!-- v0 -->
  <text x="40" y="150" fill="#4A5942" font-size="13" font-weight="600">v0</text>
  <text x="740" y="150" fill="#3A3228" font-size="13" font-weight="700" text-anchor="end">3m 05s avg</text>
  <rect x="140" y="138" width="580" height="16" rx="8" fill="#DDD8CE"/>
  <rect x="140" y="138" width="440" height="16" rx="8" fill="#6B7C5E"/>

  <!-- Bolt.new -->
  <text x="40" y="200" fill="#4A5942" font-size="13" font-weight="600">Bolt.new</text>
  <text x="740" y="200" fill="#3A3228" font-size="13" font-weight="700" text-anchor="end">2m 31s avg</text>
  <rect x="140" y="188" width="580" height="16" rx="8" fill="#DDD8CE"/>
  <rect x="140" y="188" width="360" height="16" rx="8" fill="#4A5942"/>

  <!-- Note -->
  <rect x="140" y="230" width="520" height="36" rx="6" fill="#EEEAE2"/>
  <text x="400" y="248" fill="#8A8577" font-size="10" text-anchor="middle">Lovable fastest for full-stack (auto backend) / v0 fastest for frontend-only / Bolt.new fastest for complex multi-feature</text>
  <text x="400" y="262" fill="#8A8577" font-size="10" text-anchor="middle">Speed varies by project complexity - averages from 5 test projects</text>

  <text x="400" y="290" fill="#8A8577" font-size="10" text-anchor="middle">Speed Comparison - rawpickai.com</text>
</svg>
