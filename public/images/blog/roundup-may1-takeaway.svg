<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title5">
  <title id="title5">Pull quote takeaway Microsoft consolidating enterprise AI stack indie operators ignore platform wars May 1 2026</title>
  <rect width="800" height="360" fill="#2D3A28"/>

  <!-- Decorative quote marks -->
  <text x="60" y="120" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#4A5942" opacity="0.35">"</text>

  <!-- Main quote -->
  <foreignObject x="100" y="60" width="640" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 28px; font-weight: 600; color: #F4F1EA; line-height: 1.35; letter-spacing: -0.005em;">
      The platform layer is closing fast. The indie story is unchanged: pick the tools that work for your workflow, pay for the ones you actually use, ignore the platform wars.
    </div>
  </foreignObject>

  <!-- Divider -->
  <line x1="100" y1="280" x2="200" y2="280" stroke="#8FB28E" stroke-width="3"/>

  <!-- Attribution -->
  <text x="100" y="312" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#F4F1EA">Ash · RawPickAI weekly roundup</text>
  <text x="100" y="332" font-family="Georgia, serif" font-size="13" fill="#A8B5A0">May 1, 2026 · Week of April 28 – May 1</text>

  <!-- Branding mark -->
  <g transform="translate(720, 300)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#8FB28E" stroke-width="2"/>
    <circle cx="20" cy="20" r="3" fill="#8FB28E"/>
    <line x1="20" y1="2" x2="20" y2="10" stroke="#8FB28E" stroke-width="2"/>
    <line x1="20" y1="30" x2="20" y2="38" stroke="#8FB28E" stroke-width="2"/>
    <line x1="2" y1="20" x2="10" y2="20" stroke="#8FB28E" stroke-width="2"/>
    <line x1="30" y1="20" x2="38" y2="20" stroke="#8FB28E" stroke-width="2"/>
  </g>
</svg>
