  <text x="570" y="200" fill="#96845A" font-size="12" font-weight="700" text-anchor="middle">Needs hunting</text>
  <text x="780" y="200" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>

