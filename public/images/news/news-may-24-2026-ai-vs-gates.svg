<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <rect width="900" height="160" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Gates Foundation AI Commitments: Anthropic vs OpenAI</text>
  <rect x="100" y="55" width="320" height="80" rx="10" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="260" y="82" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4A5942">Anthropic: $200M / 4 years</text>
  <text x="260" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">Health + education + agriculture</text>
  <text x="260" y="125" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Largest Gates AI commitment to date</text>
  <rect x="480" y="55" width="320" height="80" rx="10" fill="white" stroke="#96845A" stroke-width="1.5"/>
  <text x="640" y="82" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#96845A">OpenAI: $50M / Horizon1000</text>
  <text x="640" y="105" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">African clinic expansion only</text>
  <text x="640" y="125" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Announced January 2026</text>
  <text x="450" y="153" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Anthropic's partnership is 4x larger and spans health, education, and economic mobility across multiple continents</text>
</svg>
