<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <rect width="900" height="160" fill="#F4F1EA" rx="12"/>
  <rect x="0" y="0" width="900" height="4" fill="#4A5942" rx="2"/>
  <text x="450" y="35" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1A2416">Two Enterprise Strategies: Partner vs Build</text>
  <rect x="60" y="55" width="380" height="80" rx="10" fill="white" stroke="#4A5942" stroke-width="2"/>
  <text x="250" y="80" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#4A5942">Anthropic: Partner</text>
  <text x="250" y="103" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">KPMG, Deloitte, PwC, BlackRock deploy Claude</text>
  <text x="250" y="123" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">Consulting firms sell, Anthropic builds</text>
  <rect x="470" y="55" width="380" height="80" rx="10" fill="white" stroke="#96845A" stroke-width="2"/>
  <text x="660" y="80" font-family="Georgia, serif" font-size="14" font-weight="700" text-anchor="middle" fill="#96845A">OpenAI: Build</text>
  <text x="660" y="103" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#4A453E">DeployCo competes with consulting firms</text>
  <text x="660" y="123" font-family="Georgia, serif" font-size="12" text-anchor="middle" fill="#6B6960">OpenAI both sells AND deploys</text>
  <text x="450" y="152" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#8A8577">Anthropic keeps partners happy. OpenAI risks alienating them. Which strategy wins depends on enterprise trust.</text>
</svg>
