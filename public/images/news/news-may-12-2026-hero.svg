<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F1EA"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4A5942"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#96845A" letter-spacing="3">RAWPICKAI NEWS BRIEF</text>
  <text x="60" y="140" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#1A2416" letter-spacing="-1">Alphabet Hits $4.8 Trillion</text>
  <text x="60" y="190" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#1A2416" letter-spacing="-1">76% of Firms Have a CAIO</text>
  <line x1="60" y1="220" x2="300" y2="220" stroke="#4A5942" stroke-width="3"/>
  <text x="60" y="268" font-family="Georgia, serif" font-size="19" fill="#4A453E">Google owns the full AI stack: chips, models, cloud, distribution.</text>
  <text x="60" y="298" font-family="Georgia, serif" font-size="19" fill="#4A453E">Chief AI Officer role tripled in one year (IBM, 2000 CEOs).</text>
  <text x="60" y="328" font-family="Georgia, serif" font-size="19" fill="#4A453E">AI adoption hit 53% globally — faster than PCs or the internet.</text>
  <rect x="700" y="100" width="420" height="380" rx="16" fill="#4A5942" opacity="0.08"/>
  <text x="910" y="165" font-family="Georgia, serif" font-size="14" font-weight="600" text-anchor="middle" fill="#96845A">AI BY THE NUMBERS</text>
  <text x="910" y="215" font-family="Georgia, serif" font-size="52" font-weight="700" text-anchor="middle" fill="#4A5942">$4.8T</text>
  <text x="910" y="245" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#4A453E">Alphabet market cap (160% YoY)</text>
  <text x="910" y="300" font-family="Georgia, serif" font-size="42" font-weight="700" text-anchor="middle" fill="#96845A">76%</text>
  <text x="910" y="325" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#4A453E">of companies have a CAIO (was 26%)</text>
  <text x="910" y="380" font-family="Georgia, serif" font-size="42" font-weight="700" text-anchor="middle" fill="#6B7C5E">53%</text>
  <text x="910" y="405" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#4A453E">global AI adoption in 3 years</text>
  <text x="910" y="450" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#96845A">$581.7B corporate AI investment in 2025</text>
  <text x="60" y="560" font-family="Georgia, serif" font-size="14" fill="#96845A">May 12, 2026</text>
  <text x="60" y="585" font-family="Georgia, serif" font-size="12" fill="#8A8577">rawpickai.com/news</text>
