  <text x="350" y="296" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Very good</text>
  <text x="570" y="296" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>
  <text x="780" y="296" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>

  <!-- Row 5: Code assistance -->
  <rect x="20" y="316" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="316" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="316" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="316" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="344" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Code assistance</text>
  <text x="350" y="344" fill="#96845A" font-size="12" font-weight="700" text-anchor="middle">Fair</text>
  <text x="570" y="344" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Excellent</text>
  <text x="780" y="344" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>

  <!-- Row 6: Real-time info -->
  <rect x="20" y="364" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="364" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="364" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="364" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="392" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Real-time info</text>
  <text x="350" y="392" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Live search</text>
  <text x="570" y="392" fill="#96845A" font-size="12" font-weight="700" text-anchor="middle">Through plugins</text>
  <text x="780" y="392" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Native</text>

  <!-- Row 7: Creative tasks -->
  <rect x="20" y="412" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="240" y="412" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="460" y="412" width="220" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>
  <rect x="680" y="412" width="200" height="40" rx="6" fill="#FFFFFF" stroke="#DDD8CE" stroke-width="1"/>

  <text x="130" y="440" fill="#3A3228" font-size="12" font-weight="600" text-anchor="middle">Creative tasks</text>
  <text x="350" y="440" fill="#96845A" font-size="12" font-weight="700" text-anchor="middle">Limited</text>
  <text x="570" y="440" fill="#4A5942" font-size="12" font-weight="700" text-anchor="middle">Excellent</text>
  <text x="780" y="440" fill="#6B7C5E" font-size="12" font-weight="700" text-anchor="middle">Good</text>

  <!-- Legend -->
  <text x="20" y="472" fill="#8A8577" font-size="11">Scale: Excellent = Best in class | Very good = Competitive | Good = Usable | Fair = Limited | Poor = Avoid</text>
</svg>
